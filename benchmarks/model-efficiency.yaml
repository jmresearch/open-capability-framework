      Baseline. Depth/Scope discipline in all cells; anchors real on spot-checks; several runs
      self-caught structural errors (1:1 foci) and fixed them before delivering.
    tokens_per_run_median: 85000
    canon_capable: true
    recommended_runs: 5
    date: 2026-07-02
    source: skills/create-canonical-role/references/saturation-study.md

