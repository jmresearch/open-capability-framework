# Deterministic guard + regeneration for derived artifacts. No LLM involved:
# every step is a pure script over data/*.csv and roles/*/role.yaml.
#
# - PRs: consistency checks + ladder validation + "text renders must not be
#   stale" (md only — xlsx is excluded from staleness diffs because openpyxl
#   output is not byte-stable).
# - Push to main: regenerate everything (md + xlsx) and auto-commit any
#   changes as github-actions[bot] with [skip ci].
#
# Out of scope by design: semantic steps (accepting contrib proposals into
# data/, consolidation, gap judgment) stay with maintainers/tooling upstream
# of the merge. The root Open_Capability_Framework.xlsx workbook has no
# generator script and is not touched here.

name: renders

on:
  pull_request:
    paths:
      - 'data/**'
      - 'roles/**'
      - 'contrib/**'
      - 'scripts/**'
      - 'skills/career-ladder/scripts/**'
  push:
    branches: [main]
    paths:
      - 'data/bibliography.csv'
      - 'data/capabilities.csv'
      - 'data/capabilities.json'
      - 'data/capability_levels.csv'
      - 'data/domains.csv'
      - 'data/proficiency_scale.csv'
      - 'data/scope_levels.csv'
      - 'roles/**/role.yaml'
      - 'roles/**/ladder.md'
      - 'roles/**/ladder.csv'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install openpyxl pyyaml
      - name: Consistency guards + ladder validation
        run: python scripts/check_consistency.py --strict
      - name: Text renders must not be stale
        run: |
          python scripts/render_catalog.py
          python scripts/render_role_links.py
          python scripts/render_role_ladder.py
          if ! git diff --exit-code -- '*.md' 'roles/*/ladder.csv'; then
            echo '::error::Derived renders are stale. Run scripts/render_catalog.py, scripts/render_role_links.py and scripts/render_role_ladder.py, then commit the result.'
            exit 1
          fi

  regenerate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install openpyxl pyyaml
      - name: Guard before regenerating
        run: python scripts/check_consistency.py --strict
      - name: Regenerate all derived renders
        run: |
          python scripts/render_catalog.py
          python scripts/render_role_links.py
          python scripts/render_role_ladder.py
          python scripts/render_role_xlsx.py
      - name: Commit regenerated renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.md data/capabilities.xlsx roles/*/ladder.md roles/*/ladder.csv roles/*/ladder.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "ci: regenerate derived renders [skip ci]"
            git push
          else
            echo "Renders already current — nothing to commit."
          fi
