      M2: {p: P3, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P3 ('independently aligns conflicting stakeholders and navigates tense executive conversations') is managing a complex, multi-stakeholder relationship for a critical platform, balancing conflicting needs unaided."}
      M3: {p: P4, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P4 ('defines stakeholder-engagement approaches others adopt and brokers the hardest alignment') is the partnership model several teams manage relationships through -- Director-level."}
