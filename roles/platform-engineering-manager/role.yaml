    mappings:
      M1: {p: P2, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P2 ('reports upward answer-first with a specific ask; escalates early with options attached') is communicating one team's work clearly to stakeholders, tuned to the audience -- Duarte's audience-first framing at first-line scope."}
      M2: {p: P3, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P3 ('briefs senior leaders under pressure -- facts, impact, options, and a recommendation inside the first two minutes') is representing a critical area to senior stakeholders under scrutiny, unaided."}
      M3: {p: P4, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P4 ('builds and lands investment cases with executive audiences...coaches others for executive rooms') is the communication standard other leads adopt -- Director-level."}
      M4: {p: P5, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "M4 steps up to P5 here, one level earlier than this ladder's usual M4:P4 plateau, because driving the platform narrative to executive audiences and winning funding (CC-06 P5: 'operates the executive room as a peer -- advances positions, absorbs hostile questioning...changes the room's decision') matches GitLab's Senior Director exec-facing scope, not P4's coaching-others register."}
      M5: {p: P5, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "M5 holds the same P5 bar as M4; the VP differentiator is representing developer productivity and platform value to the top of the company, not a deeper communication behavior."}
      M6: {p: P6, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P6 ('speaks for an organization's technical reality to boards, investors, and press...organizational credibility survives the appearances') is Duarte's persuasive-narrative discipline applied at the company-representing register."}
    evidence:
      M1: "Translates a technical platform issue into terms a non-engineer decision-maker acts on."
      M2: "Gets a skeptical stakeholder to a decision through a well-framed case."
      M3: "Crafts the platform narrative several teams reuse to align stakeholders."
      M4: "Turns a complex platform investment into an exec-level story that lands the budget."
      M5: "Sets how the function tells its story to the board and business."
      M6: "Speaks for platform to the board and externally as a recognized voice."
