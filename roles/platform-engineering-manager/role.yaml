      M3: {p: P4, sources: [winters2020, sfia9], why: "OPS-33 P4 ('designs the migration operating model a domain reuses -- adoption instrumentation, incentives, and deprecation guarantees') is the domain-wide operating model several teams' rollouts run on -- Director-level, SFIA9 Level 5."}
