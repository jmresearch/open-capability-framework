role: Platform Engineering Management
slug: platform-engineering-manager
variant: manager
minted: 2026-07-07
scope_note: >
  M1-M6 map to the leadership scope axis: one platform team (S1) -> a complex / critical platform
  team (S2) -> a platform domain, cross-team (S3) -> a platform sub-org (S4) -> the platform
  function (S5) -> org-wide platform (S6). This is the people-leadership track for internal
  developer-platform / DevEx / infrastructure teams: it carries the full engineering-management
  load (hiring, coaching, performance, delivery, org design, strategy, communication) AND the
  platform-specific accountabilities that distinguish it from the generic Engineering Management
  ladder - platform-as-a-product thinking, developer experience and adoption, paved-road strategy,
  reliability and operational leverage, and self-service infrastructure. Upper-level cells are
  written as indirect-leverage behaviors demonstrable before the seat is granted; some
  accountability (budget of record, headcount authority, board exposure) is only fully exercised
  in-seat. Consolidated 2026-07-07 by union from five independent same-methodology blind runs
  (146 source competencies -> 38 from the ensemble union), then extended to 44 on a Fable
  consistency review that added the Self & Personal Effectiveness key area (borrowed verbatim from
  the Engineering Management canon: managerial leverage, delegation, self-awareness, resilience,
  decision-making under uncertainty, ethics) - territory the blind PEM ensemble systematically
  under-produced but which is not platform-contingent. Every focus area spans 2+ competencies.
  Proficiency targets follow the manager curve, calibrated per competency against the Engineering
  Management and Platform Engineering canonical records for cross-ladder consistency (every shared
  capability id carries the same M1-M6 curve as the Engineering Management record). One competency,
  "Adoption & migration strategy," references a pending catalog proposal (OPS-33,
  contrib/2026-07-platform-adoption-and-deprecation-management.md) because no existing capability
  covers internal-platform adoption / migration / deprecation.
levels:
  - {code: M1, title: Platform Engineering Manager, scope: one platform team, focus: builds one healthy platform team and the platform-as-a-product fundamentals}
  - {code: M2, title: Senior Platform Engineering Manager, scope: a complex / critical platform team, focus: runs a high-stakes platform team and its reliability and DevEx outcomes}
  - {code: M3, title: Director of Platform Engineering, scope: a platform domain (cross-team), focus: sets strategy and paved-road standards for a cross-team platform domain}
  - {code: M4, title: Senior Director of Platform Engineering, scope: a platform sub-org, focus: builds the operating system and architecture a platform sub-org runs on}
  - {code: M5, title: VP of Platform Engineering, scope: the platform function, focus: sets platform-function direction and represents developer productivity to the business}
  - {code: M6, title: SVP / Head of Platform, scope: org-wide platform, focus: "sets org-wide platform vision, operating model, and the company-level infrastructure bets"}
