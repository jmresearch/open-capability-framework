      M2: {p: P3, sources: [skelton-pais2019, conway1968], why: "EM-04 P3 ('independently restructures teams to fit changing work and resolves boundary conflicts') is designing a critical team's structure and interaction mode -- X-as-a-service or collaboration -- unaided."}
      M3: {p: P4, sources: [skelton-pais2019, conway1968], why: "EM-04 P4 ('defines org-design approaches others adopt and reshapes the most tangled structures') is redesigning team boundaries across the domain to cut cross-team cognitive load -- Director-level."}
      M4: {p: P4, sources: [skelton-pais2019, conway1968], why: "M4 keeps P4; Senior Director scope is the sub-org's org structure using stream-aligned, platform, and enabling patterns, not a deeper design behavior."}
      M5: {p: P5, sources: [skelton-pais2019, conway1968], why: "EM-04 P5 ('sets org-structuring strategy across the org and anticipates scaling inflection points') matches VP-level ownership of Conway-aligned interfaces to product orgs."}
      M6: {p: P6, sources: [skelton-pais2019, conway1968], why: "EM-04 P6 ('defines effective engineering-org design for the discipline and is cited externally on it') is Team Topologies applied at the org-wide, externally cited register."}
    evidence:
