role: Platform Engineering Management
slug: platform-engineering-manager
variant: manager
minted: 2026-07-07
scope_note: >
  M1-M6 map to the leadership scope axis: one platform team (S1) -> a complex / critical platform
  team (S2) -> a platform domain, cross-team (S3) -> a platform sub-org (S4) -> the platform
  function (S5) -> org-wide platform (S6). This is the people-leadership track for internal
  developer-platform / DevEx / infrastructure teams: it carries the full engineering-management
  load (hiring, coaching, performance, delivery, org design, strategy, communication) AND the
  platform-specific accountabilities that distinguish it from the generic Engineering Management
  ladder - platform-as-a-product thinking, developer experience and adoption, paved-road strategy,
  reliability and operational leverage, and self-service infrastructure. Upper-level cells are
  written as indirect-leverage behaviors demonstrable before the seat is granted; some
  accountability (budget of record, headcount authority, board exposure) is only fully exercised
  in-seat. Consolidated 2026-07-07 by union from five independent same-methodology blind runs
  (146 source competencies -> 38 from the ensemble union), then extended to 44 on a Fable
  consistency review that added the Self & Personal Effectiveness key area (borrowed verbatim from
  the Engineering Management canon: managerial leverage, delegation, self-awareness, resilience,
  decision-making under uncertainty, ethics) - territory the blind PEM ensemble systematically
  under-produced but which is not platform-contingent. Every focus area spans 2+ competencies.
  Proficiency targets follow the manager curve, calibrated per competency against the Engineering
  Management and Platform Engineering canonical records for cross-ladder consistency (every shared
  capability id carries the same M1-M6 curve as the Engineering Management record), with one sourced
  exception: STRAT-01 maps M4 -> P4 here (not the EM record's pre-retrofit M4 -> P5) because a
  sub-org-scoped strategy is the pattern-setting behavior STRAT-01 P4 describes, not P5's enterprise
  register; EM's own STRAT-01 curve is still unsourced and due the same check when EM goes through
  its own R3 retrofit. One competency,
  "Adoption & migration strategy," maps to OPS-33 (Platform adoption & deprecation management),
  accepted into the catalog from a proposal because no existing capability covered internal-platform
  adoption / migration / deprecation. R3 sourced-derivation retrofit (2026-07-09): every mapping now
  carries a bibliography source and a per-competency why; anchors resolve to bibliography keys; role
  flavor from the prior authored ladder survives only where it passes the cell-derivation instance
  test, stored under evidence:. Rendered ladder.md/ladder.csv/ladder.xlsx are derived from this file
  plus the catalog and must never be hand-edited.
ladder_name: Platform Engineering Manager (M1-M6) - Canonical
ladder_description: >
  People-leadership ladder (M1-M6) for internal developer-platform, DevEx, and infrastructure teams,
  carrying the full engineering-management load plus platform-as-a-product, reliability, paved-road,
  and self-service accountabilities.
derived: true
levels:
  - {code: M1, title: Platform Engineering Manager, scope: one platform team, focus: builds one healthy platform team and the platform-as-a-product fundamentals}
  - {code: M2, title: Senior Platform Engineering Manager, scope: a complex / critical platform team, focus: runs a high-stakes platform team and its reliability and DevEx outcomes}
  - {code: M3, title: Director of Platform Engineering, scope: a platform domain (cross-team), focus: sets strategy and paved-road standards for a cross-team platform domain}
  - {code: M4, title: Senior Director of Platform Engineering, scope: a platform sub-org, focus: builds the operating system and architecture a platform sub-org runs on}
  - {code: M5, title: VP of Platform Engineering, scope: the platform function, focus: sets platform-function direction and represents developer productivity to the business}
  - {code: M6, title: SVP / Head of Platform, scope: org-wide platform, focus: "sets org-wide platform vision, operating model, and the company-level infrastructure bets"}
competencies:
  # ---- People Leadership & Team Health ----
  - theme: Hiring & selection
    capability: LI-02
    key_area: People Leadership & Team Health
    key_attribute: Hiring & Team Formation
    anchor: schmidt-hunter1998
    anchor_why: "structured, work-sample selection predicts job performance far better than unstructured judgment"
    mappings:
      M1: {p: P3, sources: [schmidt-hunter1998, gitlab-em-jd], why: "LI-02 P3 ('shapes hiring for a team; designs loops; makes sound staffing calls') is the bar at first-line manager, not P2's participate-and-calibrate band -- GitLab's EM job family gives a first-line manager full loop ownership for their own team, matching Schmidt & Hunter's structured-selection design work."}
      M2: {p: P3, sources: [schmidt-hunter1998, gitlab-em-jd], why: "M2 holds the same P3 loop-design bar as M1; GitLab's Senior EM band differentiates by team stakes (critical, specialist hires) and interviewer calibration, not by a deeper selection behavior."}
      M3: {p: P4, sources: [schmidt-hunter1998, gitlab-em-jd], why: "LI-02 P4 ('drives hiring strategy across teams; builds the interviewing bar') is GitLab's Director-level scope -- a bar and pattern other hiring managers adopt, not one team's loop."}
      M4: {p: P4, sources: [schmidt-hunter1998, gitlab-em-jd], why: "M4 keeps the P4 hiring-strategy bar; GitLab's Senior Director differentiates by sub-org reach (the pipeline a sub-org hires through), not a new selection behavior."}
      M5: {p: P5, sources: [schmidt-hunter1998, gitlab-em-jd], why: "LI-02 P5 ('sets the org's talent strategy') matches GitLab's VP-level ownership of function-wide talent strategy and grow-vs-buy trade-offs."}
      M6: {p: P6, sources: [schmidt-hunter1998, gitlab-em-jd], why: "LI-02 P6 ('shapes company-wide talent philosophy') is Schmidt & Hunter's selection science applied at the company-defining register GitLab's SVP/Head band expects."}
    evidence:
      M1: "Defends every hire/no-hire in debrief with recorded signal evidence rather than gut feel."
      M2: "Rebuilds a loop that is letting weak candidates through by tightening the signals it actually tests."
      M3: "Publishes the rubric and calibration cadence several teams' loops now run on."
      M4: "Certifies interviewers and installs a bar-raiser mechanism that measurably lifts quality-of-hire."
      M5: "Shapes leveling and headcount decisions across the function from pipeline and labor-market data."
      M6: "Pioneers selection practice, like work-sample design for platform work, that other organizations copy."
  - theme: Onboarding & team formation
    capability: EM-13
    key_area: People Leadership & Team Health
    key_attribute: Hiring & Team Formation
    anchor: tuckman1965
    anchor_why: "teams cross forming-storming-norming-performing, and the manager's job is to shorten that arc"
    mappings:
      M1: {p: P2, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P2 ('runs a 30/60/90 onboarding...new hires ship in their first weeks') is a first-line manager running one team's forming stage to performing -- the P3 behavior (reading and intervening on formation stage across situations) is not yet expected until the manager has handled multiple team-formation events."}
      M2: {p: P3, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P3 ('reads a team's formation stage and intervenes on it') is the harder, judgment-heavy read Tuckman's model demands once a team faces real disruption (on-call, blast radius) -- GitLab's Senior EM band expects this diagnostic skill, not just a checklist."}
      M3: {p: P4, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P4 ('builds the onboarding and team-launch playbook multiple teams use...stands up whole new teams repeatedly') is Director-level: the playbook itself, reused across a domain, not one team's forming stage."}
      M4: {p: P4, sources: [tuckman1965, gitlab-em-jd], why: "M4 holds the same P4 playbook-building bar; the Senior Director differentiator is that re-forming happens through platform re-splits across a sub-org, not a deeper Tuckman behavior."}
      M5: {p: P5, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P5 ('designs how an organization absorbs step-change growth...without culture dilution') matches VP-level ownership of function-wide growth events -- acquisitions, new sites -- beyond any one team's formation."}
      M6: {p: P6, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P6 ('makes team formation an organization-wide capability...audits that the machinery still works') is the SVP register: forming teams is now infrastructure, not an event Tuckman's model describes per-team."}
    evidence:
      M1: "Gets a new platform hire shipping a real change within their first sprint."
      M2: "Reads where a forming team is stuck in storming and intervenes to move it to performing."
      M3: "Ships a reusable ramp template and 30/60/90 model that cuts time-to-first-contribution across the domain."
      M4: "Stands up a new platform team from scratch to productive without a delivery trough."
      M5: "Sets the norms that keep newly formed platform teams productive through function-wide scaling."
      M6: "Pioneers the team-formation playbook other engineering functions reuse."
  - theme: Coaching & development
    capability: LI-01
    key_area: People Leadership & Team Health
    key_attribute: Coaching & Performance
    anchor: whitmore1992-coaching
    anchor_why: "regular coaching, not status-checking, is the top driver of manager effectiveness"
    mappings:
      M1: {p: P3, sources: [whitmore1992-coaching, google-rework-oxygen], why: "LI-01 P3 ('coaches engineers with growth-oriented feedback; measurably improves a team's skill') is the GROW-model coaching Project Oxygen found separates effective from ineffective first-line managers -- P2's informal peer mentoring is not yet a manager's job-defining bar."}
      M2: {p: P3, sources: [whitmore1992-coaching, google-rework-oxygen], why: "M2 holds the same P3 coaching bar as M1; the Senior EM differentiator is coaching senior engineers through ambiguous, high-judgment work, not a deeper coaching technique."}
      M3: {p: P4, sources: [whitmore1992-coaching, google-rework-oxygen], why: "LI-01 P4 ('develops future leads across teams; shapes hiring and onboarding') is coaching applied to growing other coaches -- Project Oxygen's finding that manager-of-managers effectiveness compounds through the leaders they develop."}
      M4: {p: P4, sources: [whitmore1992-coaching, google-rework-oxygen], why: "M4 keeps the P4 bar; Senior Director scope is the leadership-development pipeline for a sub-org, not a new coaching behavior."}
      M5: {p: P5, sources: [whitmore1992-coaching, google-rework-oxygen], why: "LI-01 P5 ('develops senior engineers and leaders; builds culture deliberately') matches VP-level ownership of the function's talent-development strategy."}
      M6: {p: P6, sources: [whitmore1992-coaching, google-rework-oxygen], why: "LI-01 P6 ('develops the next generation of top talent; legacy outlasts tenure') is coaching's pioneer register -- a development model peer functions adopt, per Whitmore's own claim that coaching should outlast the coach."}
    evidence:
      M1: "Turns a specific platform-engineer weakness into a visible skill gain within a quarter."
      M2: "Develops a report into a tech lead who now runs a workstream unaided."
      M3: "Runs coaching-the-coach sessions that lift how platform leads across the domain develop their own people."
      M4: "Produces leaders others actively recruit onto their teams."
      M5: "Sets development standards leaders across the function coach against."
      M6: "Pioneers a development model peer functions adopt."
  - theme: Career development & sponsorship
    capability: EM-02
    key_area: People Leadership & Team Health
    key_attribute: Coaching & Performance
    anchor: hewlett2013
    anchor_why: "advancement comes from spending capital on people, not just mentoring them"
    mappings:
      M1: {p: P2, sources: [hewlett2013, gitlab-em-jd], why: "EM-02 P2 ('coaches direct reports on standard career growth with normal review') is mentoring, not yet Hewlett's sponsorship -- spending real capital -- which the catalog does not expect until P3."}
      M2: {p: P3, sources: [hewlett2013, gitlab-em-jd], why: "EM-02 P3 ('independently sponsors people into stretch roles and navigates complex growth paths') is exactly Hewlett's sponsorship distinction: putting your name and capital behind someone, which GitLab's Senior EM band expects for promotion-case building."}
      M3: {p: P4, sources: [hewlett2013, gitlab-em-jd], why: "EM-02 P4 ('defines career-development practices others adopt and unblocks the toughest growth cases') is sponsorship norms set for a domain, not one relationship -- Director-level per GitLab."}
      M4: {p: P4, sources: [hewlett2013, gitlab-em-jd], why: "M4 holds the same P4 bar; Senior Director scope is the succession system for a sub-org, not a deeper sponsorship behavior."}
      M5: {p: P5, sources: [hewlett2013, gitlab-em-jd], why: "EM-02 P5 ('sets the org's talent-development strategy and anticipates future capability needs') matches VP-level talent strategy, including scarce staff-plus tracks."}
      M6: {p: P6, sources: [hewlett2013, gitlab-em-jd], why: "EM-02 P6 ('defines exemplary career sponsorship for the discipline and is externally recognized for it') is Hewlett's sponsorship concept applied at industry scale."}
    evidence:
      M1: "Puts a report's name forward for a visible platform project that stretches them."
      M2: "Gets a deserving platform engineer promoted through a defensible packet."
      M3: "Advocates for talent in cross-team calibration rooms they do not own, moving outcomes for people who are not theirs."
      M4: "Spends visible capital to place emerging platform leaders into scope."
      M5: "Sets the sponsorship expectations leaders across the function are held to."
      M6: "Pioneers a sponsorship model that measurably widens the platform leadership pipeline."
  - theme: Performance management
    capability: EM-01
    key_area: People Leadership & Team Health
    key_attribute: Coaching & Performance
    anchor: grove1983-high-output-management
    anchor_why: "a manager's output is the team's output, so managing performance is the core lever"
    mappings:
      M1: {p: P3, sources: [grove1983-high-output-management, gitlab-em-jd], why: "EM-01 P3 ('independently manages underperformance and difficult cases through to clear resolution') is Grove's core claim -- a manager's job IS managing output -- landing at the first management level, not P2's normal-review cycle running."}
      M2: {p: P3, sources: [grove1983-high-output-management, gitlab-em-jd], why: "M2 holds the same P3 bar; GitLab's Senior EM differentiator is the full performance range on a higher-stakes team (top performers and defensible exits), not a new behavior."}
      M3: {p: P4, sources: [grove1983-high-output-management, gitlab-em-jd], why: "EM-01 P4 ('defines accountability practices other managers adopt and coaches them through hard cases') is Director-level: the calibration standard other managers apply, per GitLab's cross-team consistency expectation."}
      M4: {p: P4, sources: [grove1983-high-output-management, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is correcting rating drift across a sub-org's teams, not a deeper performance behavior."}
      M5: {p: P5, sources: [grove1983-high-output-management, gitlab-em-jd], why: "EM-01 P5 ('sets the org's performance philosophy and anticipates systemic accountability gaps') matches VP-level ownership of the function's performance philosophy."}
      M6: {p: P6, sources: [grove1983-high-output-management, gitlab-em-jd], why: "EM-01 P6 ('defines what fair, effective performance management means and influences the field externally') is Grove's output-management thesis applied at the industry-facing register."}
    evidence:
      M1: "Addresses an underperforming platform engineer directly with a documented plan rather than letting it drift."
      M2: "Runs a difficult exit cleanly and defensibly."
      M3: "Runs cross-team calibration that holds a fair, comparable bar across the domain."
      M4: "Corrects rating drift between teams so the bar means the same everywhere."
      M5: "Sets the standard leaders across the function calibrate to."
      M6: "Pioneers a performance model peer functions adopt."
  - theme: Psychological safety & team health
    capability: EM-03
    key_area: People Leadership & Team Health
    key_attribute: Team Health & Culture
    anchor: edmondson2018-fearless-org
    anchor_why: "safety is the top predictor of team performance and the precondition for blameless ops"
    mappings:
      M1: {p: P3, sources: [edmondson2018-fearless-org, google-rework-aristotle], why: "EM-03 P3 ('sustains safety through pressure...the team measurably speaks up') is Edmondson's harder claim -- safety survives incidents and deadlines, not just calm periods -- which the catalog places at the first management level given platform work's constant pressure, above P2's steady-state modeling."}
      M2: {p: P3, sources: [edmondson2018-fearless-org, google-rework-aristotle], why: "M2 holds the same P3 bar; the Senior EM differentiator is sustaining safety on a team where incidents are public and stressful, not a deeper safety behavior."}
      M3: {p: P4, sources: [edmondson2018-fearless-org, google-rework-aristotle], why: "EM-03 P4 ('diagnoses and fixes systemic safety failures across teams; other leaders seek their help') is Project Aristotle's finding generalized beyond one team -- Director-level per GitLab."}
      M4: {p: P4, sources: [edmondson2018-fearless-org, google-rework-aristotle], why: "M4 keeps P4; Senior Director scope is the culture mechanisms a sub-org runs on, not a new safety behavior."}
      M5: {p: P5, sources: [edmondson2018-fearless-org, google-rework-aristotle], why: "EM-03 P5 ('sets the org's team-health bar and mechanisms; safety practices they designed are adopted org-wide') matches VP-level ownership of the function's culture."}
      M6: {p: P6, sources: [edmondson2018-fearless-org, google-rework-aristotle], why: "EM-03 P6 ('shapes how the industry thinks about team health; published practices others implement') is Edmondson's research applied at the field-shaping register."}
    evidence:
      M1: "Keeps a tense incident retro blameless under real pressure so the team names the actual contributing cause instead of a scapegoat."
      M2: "Keeps a severe-outage review blameless so the real contributing causes come out."
      M3: "Instruments team-health signals across the domain and acts on a declining one before it becomes attrition."
      M4: "Turns around an unhealthy team's culture through the leader running it."
      M5: "Sets the health norms leaders across the function are measured against."
      M6: "Pioneers a culture model other engineering functions copy."
  - theme: Motivation, engagement & retention
    capability: EM-17
    key_area: People Leadership & Team Health
    key_attribute: Team Health & Culture
    anchor: deci-ryan2000-sdt
    anchor_why: "autonomy, mastery, and purpose drive durable engagement more than extrinsic rewards"
    mappings:
      M1: {p: P3, sources: [deci-ryan2000-sdt, herzberg1968], why: "EM-17 P3 ('sustains engagement through hard stretches; diagnoses systemic motivation problems') is Deci & Ryan's autonomy/mastery/purpose work applied under real strain -- the catalog places this at the first management level for platform's high-toil reliability work, above P2's per-person matching."}
      M2: {p: P3, sources: [deci-ryan2000-sdt, herzberg1968], why: "M2 holds the same P3 bar; the Senior EM differentiator is sustaining engagement on thankless reliability work specifically, not a new motivation behavior."}
      M3: {p: P4, sources: [deci-ryan2000-sdt, herzberg1968], why: "EM-17 P4 ('builds engagement mechanisms other teams adopt; reverses disengagement trends beyond their own span') is Herzberg's hygiene/motivator distinction turned into a reusable mechanism -- Director-level."}
      M4: {p: P4, sources: [deci-ryan2000-sdt, herzberg1968], why: "M4 keeps P4; Senior Director scope is the retention strategy for a sub-org's platform-specific drivers (toil, on-call, visibility), not a deeper behavior."}
      M5: {p: P5, sources: [deci-ryan2000-sdt, herzberg1968], why: "EM-17 P5 ('owns the engagement strategy for a function; conditions they designed show up in retention and survey trends') matches VP-level accountability for measured engagement outcomes."}
      M6: {p: P6, sources: [deci-ryan2000-sdt, herzberg1968], why: "EM-17 P6 ('advances the practice of engagement in the field; frameworks others cite and use') is self-determination theory applied at the field-advancing register."}
    evidence:
      M1: "Reads a dip across the whole platform team's morale during a demanding on-call stretch -- not just one person's -- and fixes the driving condition (load, visibility, toil) instead of one-off pep talks."
      M2: "Keeps regrettable attrition low on a critical platform team through a demanding period."
      M3: "Reads engagement signals across the domain and fixes a systemic driver of attrition, not just symptoms."
      M4: "Shifts a sub-org's engagement trend through the leaders who own each team."
      M5: "Sets the expectations leaders across the function own for engagement."
      M6: "Pioneers retention practice for infrastructure talent that peers adopt."
  # ---- Platform as a Product ----
  - theme: Platform vision & roadmap
    capability: PM-05
    key_area: Platform as a Product
    key_attribute: Product Strategy & Discovery
    anchor: perri2018-escapingbuildtrap
    anchor_why: "a platform is run as a product with outcomes and sized as a thinnest-viable-platform, not a feature factory"
    mappings:
      M1: {p: P2, sources: [perri2018-escapingbuildtrap, gitlab-em-jd], why: "PM-05 P2 ('builds and sequences a credible roadmap for one product with normal review') is Perri's build-trap escape applied to a single team's surface -- naming the outcome each item serves, not yet the P3 cross-constraint balancing."}
      M2: {p: P3, sources: [perri2018-escapingbuildtrap, gitlab-em-jd], why: "PM-05 P3 ('independently balances competing priorities and replans confidently under shifting constraints') matches Team Topologies' thinnest-viable-platform judgment applied without oversight on a high-stakes area."}
      M3: {p: P4, sources: [perri2018-escapingbuildtrap, skelton-pais2019], why: "PM-05 P4 ('designs the planning approach others use and resolves cross-team portfolio conflicts') is a cross-team platform vision other roadmaps align to -- Director-level."}
      M4: {p: P4, sources: [perri2018-escapingbuildtrap, skelton-pais2019], why: "M4 keeps P4; Senior Director scope is the multi-year roadmap a sub-org executes against, not a deeper planning behavior."}
      M5: {p: P5, sources: [perri2018-escapingbuildtrap, gitlab-em-jd], why: "PM-05 P5 ('sets portfolio planning strategy and foresees where investment should shift next') matches VP-level ownership of the function's platform bets."}
      M6: {p: P6, sources: [perri2018-escapingbuildtrap, gitlab-em-jd], why: "PM-05 P6 ('defines portfolio-planning best practice for the field and is recognized for it') is Perri's product-thinking applied at the industry-recognized register."}
    evidence:
      M1: "States the problem each platform capability solves and for whom."
      M2: "Kills or defers a low-value platform build others wanted, with the outcome argument to back it."
      M3: "Publishes a domain platform strategy that redirects several teams' build priorities."
      M4: "Frames the platform-as-a-product operating model the sub-org plans within."
      M5: "Sets the platform bets the function organizes around and defends them at the exec table."
      M6: "Pioneers a platform strategy the industry recognizes."
  - theme: Internal user research & discovery
    capability: PM-01
    key_area: Platform as a Product
    key_attribute: Product Strategy & Discovery
    anchor: noda2023-devex
    anchor_why: "platform value is set by developers' lived experience, which must be measured not assumed"
    mappings:
      M1: {p: P2, sources: [noda2023-devex, gitlab-em-jd], why: "PM-01 P2 ('plans and conducts standard discovery for a feature, synthesizing themes with normal review') is Noda et al.'s feedback-loop listening applied to one team's users under review, not yet the P3 unaided framing of ambiguous problems."}
      M2: {p: P3, sources: [noda2023-devex, gitlab-em-jd], why: "PM-01 P3 ('independently frames ambiguous problems, selects fitting methods, and separates signal from noise') is the structured cognitive-load and friction-log discovery Noda et al. describe, run unaided on a high-stakes area."}
      M3: {p: P4, sources: [noda2023-devex, gitlab-em-jd], why: "PM-01 P4 ('designs the team's discovery approach and untangles findings others find contradictory') is the DevEx measurement system spanning surveys and system signals that several teams steer by -- Director-level."}
      M4: {p: P4, sources: [noda2023-devex, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the continuous developer-listening system a sub-org runs on, not a deeper discovery behavior."}
      M5: {p: P5, sources: [noda2023-devex, gitlab-em-jd], why: "PM-01 P5 ('sets the org's research strategy and anticipates emerging customer needs before they surface') matches VP-level ownership of how the function represents developer productivity."}
      M6: {p: P6, sources: [noda2023-devex, gitlab-em-jd], why: "PM-01 P6 ('defines what rigorous product discovery means and shapes the discipline's practice externally') is Noda et al.'s DevEx research program applied at the field-shaping register."}
    evidence:
      M1: "Turns an observed developer pain point into a prioritized platform fix."
      M2: "Quantifies a cognitive-load or feedback-loop problem the team then designs against."
      M3: "Stands up a developer-experience measurement combining surveys and system signals that several teams now steer by."
      M4: "Makes DevEx evidence the default input to roadmap decisions across the sub-org."
      M5: "Sets the DevEx metrics the function commits to and reports upward."
      M6: "Pioneers a DevEx research program other companies reference."
  - theme: Platform value & business case
    capability: PD-06
    key_area: Platform as a Product
    key_attribute: Product Strategy & Discovery
    anchor: cagan2017-inspired
    anchor_why: "platform investment is justified in value delivered, not output shipped"
    mappings:
      M1: {p: P2, sources: [cagan2017-inspired, gitlab-em-jd], why: "PD-06 P2 ('frames own work in user/business outcomes, not just tasks') is Cagan's outcome-over-output framing applied to one team's platform work."}
      M2: {p: P3, sources: [cagan2017-inspired, gitlab-em-jd], why: "PD-06 P3 ('treats their area as a product; uses metrics to decide what to build for a domain') is the business-case discipline -- quantifying time saved, incidents avoided -- Cagan expects once value must be defended for funding."}
      M3: {p: P4, sources: [cagan2017-inspired, gitlab-em-jd], why: "PD-06 P4 ('expert at aligning technical bets with product strategy across teams') is a value-articulation standard other leads use -- Director-level."}
      M4: {p: P4, sources: [cagan2017-inspired, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the investment model a sub-org allocates by, not a deeper value-case behavior."}
      M5: {p: P5, sources: [cagan2017-inspired, gitlab-em-jd], why: "PD-06 P5 ('sets product direction for an org's technical surface') matches VP-level ownership of how the function proves and communicates business value."}
      M6: {p: P6, sources: [cagan2017-inspired, gitlab-em-jd], why: "PD-06 P6 ('shapes how the company creates value through technical products') is Cagan's product-thinking applied at the org-wide economic-strategy register."}
    evidence:
      M1: "Ties a platform initiative to a concrete productivity or cost outcome."
      M2: "Wins funding for a platform bet with a defensible value model."
      M3: "Publishes a value and ROI framework several teams justify platform work with."
      M4: "Reframes platform from cost center to leverage multiplier for the sub-org's stakeholders."
      M5: "Sets the value narrative and metrics the function is funded against."
      M6: "Pioneers a platform-value model the business plans capital around."
  - theme: Golden paths & paved roads
    capability: OPS-27
    key_area: Platform as a Product
    key_attribute: Developer Experience & Adoption
    anchor: spotify2020-goldenpaths
    anchor_why: "an opinionated, supported path makes the right way the easy way"
    mappings:
