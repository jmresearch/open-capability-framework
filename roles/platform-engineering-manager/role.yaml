      M5: "Sets the partnership approach the function relies on."
      M6: "Pioneers a stakeholder approach other functions adopt."
  - theme: Cross-org influence & alignment
    capability: LI-07
    key_area: Strategy, Communication & Influence
    key_attribute: Communication & Influence
    anchor: cohen-bradford2005
    anchor_why: "platform leaders get outcomes across teams they do not own, through reciprocity and clear intent"
    mappings:
      M1: {p: P2, sources: [cohen-bradford2005, bungay2011-art-of-action], why: "LI-07 P2 ('wins cooperation from adjacent teams by trading in their currencies -- timing help, review effort, shared credit -- rather than escalating') is Cohen & Bradford's reciprocity-based influence at first-line scope."}
      M2: {p: P3, sources: [cohen-bradford2005, bungay2011-art-of-action], why: "LI-07 P3 ('secures priority from other teams for an initiative with no borrowed authority; builds the case in the other party's terms and repays visibly') is aligning multiple teams around a critical direction under real disagreement, unaided."}
      M3: {p: P4, sources: [cohen-bradford2005, bungay2011-art-of-action], why: "LI-07 P4 ('moves a multi-team domain to a shared position with no mandate -- assembles the coalition, converts the best-argued skeptic') is Bungay's commander's-intent-style alignment across a domain -- Director-level."}
      M4: {p: P4, sources: [cohen-bradford2005, bungay2011-art-of-action], why: "M4 keeps P4; Senior Director scope is cross-org alignment a sub-org depends on, aligning peer orgs to platform direction, not a deeper influence behavior."}
      M5: {p: P5, sources: [cohen-bradford2005, bungay2011-art-of-action], why: "LI-07 P5 ('shifts organization-level outcomes through people several seams away who advocate the position as their own...holding a minority of the formal power in the room') matches VP-level alignment across the function's peer organizations."}
      M6: {p: P6, sources: [cohen-bradford2005, bungay2011-art-of-action], why: "LI-07 P6 ('shapes industry and market context in the organization's favor -- standards bodies, open ecosystems, talent narratives') is Cohen & Bradford's currencies-of-influence framework applied at the industry-shaping register."}
    evidence:
      M1: "Aligns another team to a shared platform goal without authority over them."
      M2: "Builds cross-team agreement on a contested platform standard."
      M3: "Drives alignment across a domain by clear intent, commander's-intent style, rather than escalation."
      M4: "Wins peer-org buy-in for a sub-org-wide platform initiative."
      M5: "Sets the alignment mechanisms the function relies on to move the wider org."
      M6: "Pioneers an influence model that aligns the whole company behind platform bets."
  # ---- Self & Personal Effectiveness ----
  # Borrowed verbatim from the Engineering Management canon (curves + anchors) per the 2026-07-07
  # consistency review: this territory is not platform-contingent, and a canon adapted verbatim
  # must not lack delegation, judgment, resilience, or an ethics row on the manager axis. The blind
  # PEM ensemble under-produced it (see consolidation report); it is added for cross-ladder parity.
  - theme: Managerial leverage & focus
    capability: EM-16
    key_area: Self & Personal Effectiveness
    key_attribute: Leverage & Delegation
    anchor: grove1983-high-output-management
    anchor_why: "a manager's output is the leveraged output of everyone they touch, and time is the one non-renewable resource"
    mappings:
      M1: {p: P2, sources: [grove1983-high-output-management, drucker1967-effective-executive], why: "EM-16 P2 ('runs a deliberate calendar that matches stated priorities...declines low-leverage meetings') is Drucker's self-management discipline -- knowing where time goes -- at first-line scope."}
      M2: {p: P3, sources: [grove1983-high-output-management, drucker1967-effective-executive], why: "EM-16 P3 ('prunes their own involvement ruthlessly as complexity grows -- automates, delegates, or kills recurring work every quarter') is Grove's leverage principle applied under a high-stakes team's real complexity."}
      M3: {p: P4, sources: [grove1983-high-output-management, drucker1967-effective-executive], why: "EM-16 P4 ('chooses interventions by multiplier across many teams...declining the rest by policy; audits their time and publishes the changes') is the leverage practice other leads pick up -- Director-level."}
      M4: {p: P4, sources: [grove1983-high-output-management, drucker1967-effective-executive], why: "M4 keeps P4; Senior Director scope is the operating rhythm a sub-org runs on so decisions happen at the lowest capable level, not a deeper leverage behavior."}
      M5: {p: P5, sources: [grove1983-high-output-management, drucker1967-effective-executive], why: "EM-16 P5 ('allocates attention like a portfolio at organizational scale...says which is which out loud') matches VP-level ownership of how the function protects its leaders' focus."}
      M6: {p: P6, sources: [grove1983-high-output-management, drucker1967-effective-executive], why: "EM-16 P6 ('spends presence deliberately as an organizational signal...guards the organization's focus by limiting concurrent top priorities') is Grove's leverage principle applied at the org-signal register."}
    evidence:
      M1: "Drops a low-leverage habit such as reviewing every change themselves once they see its cost."
      M2: "Restructures how they spend time so a critical platform team stops waiting on them."
      M3: "Publishes an operating cadence several leads adopt to reclaim their own high-leverage time."
      M4: "Removes themselves as a bottleneck across the sub-org by installing the mechanisms that decide without them."
      M5: "Sets the focus and leverage norms leaders across the function organize their time around."
      M6: "Pioneers a leverage model peer functions adopt."
  - theme: Delegation & empowerment
    capability: EM-14
    key_area: Self & Personal Effectiveness
    key_attribute: Leverage & Delegation
    anchor: marquet2012-turn-the-ship
    anchor_why: "leadership scales by pushing authority to where the information is, creating leaders rather than followers"
    mappings:
      M1: {p: P2, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P2 ('delegates whole outcomes with context and check-in contracts matched to each person's readiness -- and resists snatching work back when it wobbles') is Marquet's leader-leader delegation at first-line scope."}
      M2: {p: P3, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P3 ('hands ownership of critical, visible work to someone not yet proven and scaffolds them to success, letting them keep the credit') is empowering senior engineers and leads to own hard, ambiguous work and make the calls themselves."}
      M3: {p: P4, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P4 ('pushes decisions down across multiple teams -- publishes decision rights so teams stop escalating what they can decide themselves') is the delegation standard other leads adopt -- Director-level."}
      M4: {p: P4, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the decision-rights model a sub-org runs on so authority sits with the people closest to the work, not a deeper delegation behavior."}
      M5: {p: P5, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P5 ('builds organizations that run on mechanisms rather than presence -- delegated authorities with audit trails, pre-declared tripwires') matches VP-level ownership of how the function distributes authority."}
      M6: {p: P6, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P6 ('runs an organization on intent...treats every upward escalation as a design flaw to fix') is Marquet's leader-leader model applied at the org-wide register."}
    evidence:
      M1: "Hands a platform workstream to an engineer with the decision rights to run it, then holds back."
      M2: "Grows a report into someone who runs a critical workstream end to end without checking in."
      M3: "Gets outcomes across a domain by stating clear intent and letting other leaders decide how."
      M4: "Pushes a class of decisions down to team leaders across the sub-org and stops being consulted on them."
      M5: "Sets the empowerment norms leaders across the function lead by."
      M6: "Pioneers a decision-rights model other functions adopt."
  - theme: Self-awareness & learning agility
    capability: LI-09
    key_area: Self & Personal Effectiveness
    key_attribute: Growth & Resilience
    anchor: eurich2018-selfawareness
    anchor_why: "accurate self-knowledge and the ability to learn from new experience predict leadership growth"
    mappings:
      M1: {p: P2, sources: [eurich2018-selfawareness, lombardo-eichinger2000-70-20-10], why: "LI-09 P2 ('asks for feedback on their own practice and changes visibly in response...keeping a running list of their own failure patterns') is Eurich's internal-plus-external self-awareness loop at first-line scope."}
      M2: {p: P3, sources: [eurich2018-selfawareness, lombardo-eichinger2000-70-20-10], why: "LI-09 P3 ('knows their failure modes under pressure and manages them in the moment; staffs deliberately against known weaknesses') is the learning-agility Lombardo & Eichinger's 70-20-10 model expects once new, high-stakes situations recur."}
      M3: {p: P4, sources: [eurich2018-selfawareness, lombardo-eichinger2000-70-20-10], why: "LI-09 P4 ('runs structured input on themselves -- 360s, skip-level themes -- and closes the loop publicly on what changed') is the feedback mechanism several leads adopt to see their own effect on others -- Director-level."}
      M4: {p: P4, sources: [eurich2018-selfawareness, lombardo-eichinger2000-70-20-10], why: "M4 keeps P4; Senior Director scope is the leadership-feedback and development practice a sub-org relies on, not a deeper self-awareness behavior."}
      M5: {p: P5, sources: [eurich2018-selfawareness, lombardo-eichinger2000-70-20-10], why: "LI-09 P5 ('compensates deliberately for the seniority feedback vacuum -- cultivates truth-tellers, rewards bearers of unwelcome news') matches VP-level ownership of how the function grows self-aware leaders."}
      M6: {p: P6, sources: [eurich2018-selfawareness, lombardo-eichinger2000-70-20-10], why: "LI-09 P6 ('institutionalizes challenge to their own judgment -- red teams, protected dissent') is Eurich's self-awareness research applied at the org-wide, judgment-checking register."}
    evidence:
      M1: "Changes a specific behavior after hearing it lands badly, rather than defending it."
      M2: "Names a blind spot and adjusts before it costs the team, using an outside read to check their own."
      M3: "Runs feedback mechanisms several leads adopt to see their own effect on others."
      M4: "Turns a leader's blind spot around across the sub-org by making honest upward feedback safe and routine."
      M5: "Sets the learning-agility expectations leaders across the function are developed against."
      M6: "Pioneers a leadership-development model peer functions adopt."
  - theme: Resilience & sustainable pace
    capability: LI-10
    key_area: Self & Personal Effectiveness
    key_attribute: Growth & Resilience
    anchor: loehr-schwartz2003-full-engagement
    anchor_why: "performance is a function of managed energy, not time, and sustainable pace beats heroics"
    mappings:
      M1: {p: P2, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P2 ('stays effective and steady under pressure -- recovers from setbacks, manages their own energy, and models a sustainable pace others learn from watching') is Loehr & Schwartz's managed-energy discipline at first-line scope."}
      M2: {p: P3, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P3 ('holds up through prolonged pressure -- incident sieges, crunch, organizational turbulence -- helping the team stay resilient and refusing burnout-driven decisions') is sustained composure through a critical team's real operational pressure."}
      M3: {p: P4, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P4 ('builds resilience into how multiple teams operate -- on-call health, recovery after pushes, load balancing -- and repairs burnout risk at scale') is the sustainable-pace norm other leads adopt -- Director-level."}
      M4: {p: P4, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the operating norms a sub-org uses to keep pace sustainable through scaling and incidents, not a deeper resilience behavior."}
      M5: {p: P5, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P5 ('stewards organizational resilience -- capacity buffers, crisis rotation, energy management for senior leaders -- and holds the line when business pressure argues for permanent crunch') matches VP-level ownership."}
      M6: {p: P6, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P6 ('shapes a resilient, sustainable culture across an organization; the organization absorbs shocks without breaking people') is Loehr & Schwartz's energy-management thesis applied at the org-wide register."}
    evidence:
      M1: "Logs off after a brutal on-call week and says so openly instead of powering through, and the team notices and starts doing the same."
      M2: "Absorbs the stress of a severe outage period and keeps the team functioning rather than fraying."
      M3: "Acts on a burnout signal across the domain before it becomes attrition, changing the load rather than the people."
      M4: "Reshapes on-call and workload across the sub-org so resilience does not depend on individual heroics."
      M5: "Sets the sustainable-pace expectations leaders across the function are held to."
      M6: "Pioneers a sustainable-operations model peer functions adopt."
  - theme: Decision-making under uncertainty
    capability: LI-04
    key_area: Self & Personal Effectiveness
    key_attribute: Judgment & Integrity
    anchor: kahneman2011-thinking-fast-slow
    anchor_why: "sound decisions require guarding against bias and calibrating confidence to the evidence"
    mappings:
      M1: {p: P2, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P2 ('decides independently within their components; evaluates alternatives honestly') is making timely calls with incomplete information and stating assumptions -- Kahneman's System 2 check applied at first-line scope."}
      M2: {p: P3, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P3 ('makes architectural choices for a domain that hold up over months') is making high-stakes, hard-to-reverse calls on a critical platform and guarding against their own bias, unaided."}
      M3: {p: P4, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P4 ('foresees second-order consequences; sets decision frameworks for teams') is the decision-making discipline other leads adopt, with reversibility tests and recorded rationale -- Director-level."}
      M4: {p: P4, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the decision-rights and judgment norms a sub-org runs on, not a deeper decision behavior."}
      M5: {p: P5, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P5 ('sets decision-making frameworks for the org') matches VP-level ownership of how the function makes irreversible, high-ambiguity bets."}
      M6: {p: P6, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P6 ('visionary judgment; sees structural causes others miss') is Kahneman's bias-guarded reasoning applied at the org-wide, structural-insight register."}
    evidence:
      M1: "Makes a reversible platform decision quickly rather than stalling for certainty that will not come."
      M2: "Frames a one-way-door platform decision explicitly and gathers the evidence its weight warrants."
      M3: "Installs a decision framework several teams now use to make calls under ambiguity."
      M4: "Raises the quality of consequential decisions across the sub-org by making the reasoning and the owner explicit."
      M5: "Sets the decision standard leaders across the function are calibrated to."
      M6: "Pioneers a decision model peer functions adopt."
  - theme: Ethics, integrity & trust
    capability: LI-11
    key_area: Self & Personal Effectiveness
    key_attribute: Judgment & Integrity
    anchor: mayer1995-trust
    anchor_why: "trust is built on ability, benevolence, and integrity, and platform leaders hold outsized access and impact"
    mappings:
      M1: {p: P3, sources: [mayer1995-trust, acm-code-of-ethics2018], why: "LI-11 P3 ('makes the unpopular-but-right call under pressure and absorbs the cost personally; protects the person who raised the flag') is Mayer, Davis & Schoorman's integrity dimension of trust under real stakes -- the catalog places this at the first management level given platform's outsized access to others' systems and data, above P2's personal consistency."}
      M2: {p: P3, sources: [mayer1995-trust, acm-code-of-ethics2018], why: "M2 holds the same P3 bar; the Senior EM differentiator is holding the ethical line where access, data, and reliability carry real stakes on a critical platform, not a deeper integrity behavior."}
      M3: {p: P4, sources: [mayer1995-trust, acm-code-of-ethics2018], why: "LI-11 P4 ('serves as the honest broker across teams -- disputing parties accept their account of the facts -- and carries uncomfortable systemic truths to the room that can fix them') is the ethical norm other leads adopt around access, data, and honest disclosure -- Director-level."}
      M4: {p: P4, sources: [mayer1995-trust, acm-code-of-ethics2018], why: "M4 keeps P4; Senior Director scope is the trust and integrity expectations a sub-org operates by, from privileged-access ethics to honest reporting, not a deeper integrity behavior."}
      M5: {p: P5, sources: [mayer1995-trust, acm-code-of-ethics2018], why: "LI-11 P5 ('builds mechanisms that make integrity cheap at scale -- ethics review in design, safe escalation with follow-through...stops launches on ethical grounds') matches VP-level ownership of the function's ethical posture on its outsized access and impact."}
      M6: {p: P6, sources: [mayer1995-trust, acm-code-of-ethics2018], why: "LI-11 P6 ('holds an organization's line when the profitable path and the right path diverge -- the hard disclosure, the walked-away revenue') is the ACM Code of Ethics's public-good primacy applied at the org-defining register."}
    evidence:
      M1: "Makes the honest call on a platform reliability or security risk even when it is inconvenient to admit."
      M2: "Refuses a shortcut that would trade user trust or safety for speed, and says why."
      M3: "Establishes the do-the-right-thing expectations several teams now hold each other to."
      M4: "Makes candid, blameless honesty the norm across the sub-org even when the news is bad."
      M5: "Sets the integrity standard leaders across the function are trusted to uphold."
      M6: "Pioneers an ethics model peer functions and the wider field reference."
