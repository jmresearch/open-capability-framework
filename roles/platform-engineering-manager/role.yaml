      M2: "Restructures a team so its boundary matches the platform it owns."
      M3: "Redesigns team boundaries across the domain to cut cross-team cognitive load."
      M4: "Proposes and drives a sub-org reshape that improves flow."
      M5: "Sets the operating structure the function runs on."
      M6: "Pioneers an operating model other functions adopt."
  - theme: Executive & stakeholder communication
    capability: CC-06
    key_area: Strategy, Communication & Influence
    key_attribute: Communication & Influence
