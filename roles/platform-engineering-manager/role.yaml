  # ---- Reliability & Operations ----
  - theme: Reliability, SLOs & error budgets
    capability: OPS-04
    key_area: Reliability & Operations
    key_attribute: Reliability Engineering
    anchor: sre2016
    anchor_why: "SLOs and error budgets turn reliability from opinion into an explicit, negotiable target"
    mappings:
      M1: {p: P2, sources: [sre2016, sfia9], why: "OPS-04 P2 ('builds retries, timeouts and fallbacks; understands blast radius') is the resilience-engineering half of this competency at first-line scope -- containing failure so one dependency's outage doesn't cascade, SFIA9 Level 3. The catalog's OPS-04 profile names SLOs explicitly at P1 and P3 but not at P2; error-budget policy work is the P3+ behavior, not this level's bar."}
      M2: {p: P3, sources: [sre2016, sfia9], why: "OPS-04 P3 ('designs for graceful degradation; defines SLOs; accountable for a domain's reliability') is designing the SLO and error-budget model with meaningful SLIs for a critical area -- exactly the SRE book's negotiated-target practice."}
      M3: {p: P4, sources: [sre2016, sfia9], why: "OPS-04 P4 ('expert in resilience and capacity planning at scale; drives down incidents systemically') is a reliability-target framework several teams run their services against -- Director-level."}
      M4: {p: P4, sources: [sre2016, sfia9], why: "M4 keeps P4; Senior Director scope is the reliability operating model a sub-org runs on, not a deeper SLO behavior."}
      M5: {p: P5, sources: [sre2016, sfia9], why: "OPS-04 P5 ('owns org-level reliability; fixes risk in process and org design') matches VP-level ownership of the function's explicit reliability-versus-velocity trade-off."}
      M6: {p: P6, sources: [sre2016, sfia9], why: "OPS-04 P6 ('sets the company's reliability philosophy') is the SRE book's error-budget discipline applied at the company-commitment register."}
    evidence:
      M1: "Adds a retry-with-backoff and a fallback path to a flaky downstream call so that dependency's failure doesn't cascade into the team's own service."
      M2: "Negotiates and enforces an error-budget policy that pauses feature work when reliability slips."
      M3: "Defines the reliability-target framework several teams now run their services against."
      M4: "Makes error-budget policy the mechanism the sub-org's prioritization respects."
      M5: "Sets the reliability commitments the function makes to the business."
      M6: "Pioneers a reliability model other orgs adopt."
