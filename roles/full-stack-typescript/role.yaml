role: Full Stack TypeScript Engineer
slug: full-stack-typescript
variant: ic_technical
minted: 2026-07-02
scope_note: >
  E1-E6 map to scope bands task -> component -> capability/domain -> multiple teams ->
  organization -> company (approximately S1-S6 on the IC axis). E3 / Senior is the terminal level:
  sustained excellence at capability scope is a complete career; E4+ is a different job defined by
  multi-team leverage. Consolidated 2026-07 by union from five independent blind generations (158
  source competencies -> 47 canonical); proficiency targets follow the IC guide E1:P1, E2:P2,
  E3:P3, E4:P4, E5:P5, E6:P6. R3 sourced-derivation retrofit (2026-07-09): every mapping now
  carries a bibliography source and a per-competency, per-level why grounded in that capability's
  actual P1-P6 catalog text -- the earlier blanket claim ("per-competency review found the source
  cells consistently written to those bars") is superseded by this per-cell sourcing. The diagonal
  held for all 47 competencies on re-derivation: every capability's own P1-P6 profile
  independently escalates task -> component -> domain/capability -> multiple-teams -> organization
  -> company in step with E1-E6, so no mapping deviates from Ek:Pk -- see each competency's
  mappings[].why for the per-level catalog citation. Role-leveling source convention (constant
  across the ladder, not per-competency): E1-E3 pair the competency anchor with sfia9 (SFIA's
  guided/independent/proficient responsibility tiers); E4-E6 pair it with larson2021-staffeng
  (StaffEng's senior-IC archetypes for multi-team/org/company scope), except where the anchor
  itself already is one of those two keys (e.g. Stakeholder communication, Technical direction &
  influence), in which case the level's sources are not duplicated. Nine competencies carry a
  second, always-on source because the original citation named two real, distinct works, both
  genuine bibliography entries used together at the same catalog id in data/capability_levels.csv:
  Observability & monitoring (sre2016 + majors2022-observability), Incident response & postmortems
  (sre2016 + allspaw2012), Authentication/authorization & data protection (owasp-asvs +
  nist80063), Technical writing & documentation (winters2020 + procida-diataxis), Feedback &
  candor (scott2017-radicalcandor + edmondson2018-fearless-org), Cross-functional collaboration
  (cagan2017-inspired + skelton-pais2019), Mentoring & growing engineers (larson2021-staffeng +
  fournier2017), Scoping/prioritization & estimation (mcconnell2006-estimation +
  reinertsen2009-flow). Self-sourcing circularity check (systemic bug hunted per the task brief):
  five capabilities in this ladder -- SWE-08 (Type-System Domain Modeling), SWE-09 (Boundary
  Validation & End-to-End Type Integrity), OPS-30 (Progressive Delivery & Release Safety), PD-07
  (Strategic & Commercial Awareness), and EM-15 (Technical debt & risk stewardship) -- were minted
  from this exact role's own 2026-07 consolidation and accepted into the catalog directly from its
  prior ladder.md prose. Token-overlap triage (Jaccard over the mapped bar vs. the old ladder's
  harvested evidence, all 6 levels, not just P1-P3) confirmed SWE-08, SWE-09, OPS-30 and PD-07 as
  circular -- the catalog P-text is frequently a near-verbatim prefix of the old evidence clause
  it was distilled from (scores 0.32-0.92 across 24 of 24 cells) -- so all 24 cells were rewritten
  to genuinely distinct, concretely-instantiated scenarios rather than reused. EM-15 scored
  near-zero (its catalog profile reads as a different, more abstract debt-portfolio register than
  the old ladder's code-refactoring prose), so it was not circular by the token test, but its 6
  cells were rewritten anyway for tighter behavior/autonomy match to the actual catalog P-text
  (portfolio/register framing, not hands-on refactoring), since it shares the same self-sourced
  provenance. One more cell failed the instance test for a different reason (paraphrase, not
  circularity): PD-05 E6 restated its bar's own language with no concrete scenario and was
  rewritten; PD-05 E1-E5 passed. Twenty of the 47 competency anchors resolve to a close
  bibliography substitute rather than the original free-text citation, because that citation (a
  web framework's docs, a language handbook, a blog post never added to the bibliography) has no
  entry: in every case the substitute is a source the catalog's own capability_levels.csv already
  cites for that exact capability id. Examples: Styling & responsive layout's MDN CSS guides ->
  css-cascade5 (FE-09's own P3 anchor); Client state management's Redux docs -> facebook-flux2014
  (FE-05's own P3/P4/P6 anchor, since Redux directly implements Flux); Data fetching & caching's
  TanStack Query docs -> rfc9111 (FE-06's own anchor at every level -- the HTTP caching semantics
  TanStack Query implements); Runtime & async correctness's Node.js event-loop guide ->
  herlihy-shavit2008 (CS-04's own anchor); Query performance's Winand/Sadalage & Fowler ->
  selinger1979 (BE-04's own anchor, the origin of cost-based query-plan literacy); Advanced types
  & inference's TypeScript Handbook -> mcconnell2004 (SWE-01's own P1/P2 anchor); Integration &
  end-to-end confidence's Fowler ContractTest post -> robinson2006-cdc (the exact named
  Consumer-Driven Contracts pattern); Ownership & follow-through's Amazon Leadership Principles ->
  willink-babin2015-extremeownership (PD-05's own anchor at every level, same Ownership doctrine);
  full list and rationale in r3-fst-report.md.
levels:
  - {code: E1, title: Associate Full Stack Engineer, scope: task, focus: ships well-defined tasks across the stack with guidance and learns the stack}
  - {code: E2, title: Full Stack Engineer, scope: component, focus: independently delivers complete features spanning UI, API, and data layers}
  - {code: E3, title: Senior Full Stack Engineer, scope: capability / domain (terminal level), focus: owns a product capability across the stack and sets the local bar}
  - {code: E4, title: Staff Full Stack Engineer, scope: multiple teams, focus: drives technical outcomes across multiple teams and multiplies other engineers}
  - {code: E5, title: Senior Staff Full Stack Engineer, scope: organization, focus: sets technical direction and standards for the organization}
  - {code: E6, title: Principal Full Stack Engineer, scope: company, focus: shapes company-level technical strategy and represents engineering externally}
ladder_name: Full Stack TypeScript Engineer (IC Technical, E1-E6) - Canonical
ladder_description: >
  Canonical six-level IC ladder for engineers who own features end to end across UI, API, and data
  layers in a TypeScript-centered stack, consolidated by union from five independent blind
  generations; E3 Senior is the terminal level.
derived: true
competencies:
  - theme: "Component design & composition"
    capability: FE-01
    key_area: "Frontend Engineering"
    key_attribute: "UI Implementation"
    anchor: react-thinking
    anchor_why: "decomposing UI into a one-way data-flow component hierarchy is the canonical discipline for maintainable interfaces; component boundaries are where frontend complexity is either contained or leaks."
    mappings:
      E1: {p: P1, sources: [react-thinking, sfia9], why: "FE-01 P1 ('Builds simple components from existing patterns; relies on review to validate boundaries and props.') is the guided bar: an Associate builds from a design system others made, same register as 'existing patterns' plus review-validated boundaries."}
      E2: {p: P2, sources: [react-thinking, sfia9], why: "FE-01 P2 ('Composes reusable components independently, handling standard prop, state, and event wiring with normal review.') matches independent feature-level decomposition without being handed the breakdown — the component-scope bar, not yet a capability's whole UI architecture."}
      E3: {p: P3, sources: [react-thinking, sfia9], why: "FE-01 P3 ('Designs component hierarchies and clear interfaces autonomously; resolves tricky composition and reuse trade-offs.') is the capability-owning bar — designing the component APIs a capability's UI is built from is autonomous hierarchy design at domain scope. E3 is this ladder's terminal level."}
      E4: {p: P4, sources: [react-thinking, larson2021-staffeng], why: "FE-01 P4 ('Defines the component architecture and conventions teams adopt; untangles deeply coupled or overgrown trees.') is Staff-scope: establishing shared component patterns several teams build against is exactly 'conventions teams adopt.'"}
      E5: {p: P5, sources: [react-thinking, larson2021-staffeng], why: "FE-01 P5 ('Sets organization-wide component design strategy; anticipates how composition models should evolve.') matches Senior Staff's org-wide authority over frontend architecture direction."}
      E6: {p: P6, sources: [react-thinking, larson2021-staffeng], why: "FE-01 P6 ('Defines what good component architecture means industrywide; shapes practice through widely adopted patterns.') is the company/industry-scope bar — making the company-level frontend bets that are publicly contested and cited is that external-authority register."}
    evidence:
      E1: "Builds components from an existing design system to spec, following the patterns in neighboring code and asking when a mockup is ambiguous."
      E2: "Decomposes a feature into a sensible component hierarchy without being handed the breakdown, choosing props vs. composition deliberately and reusing shared components rather than forking them."
      E3: "Designs the component APIs a capability's UI is built from, catching prop-drilling, leaky abstractions, and reuse-hostile boundaries in review before they ship, and extends the design system with primitives that get reused."
      E4: "Establishes the shared component and design-system patterns several teams build against, deprecating divergent one-offs with migration paths."
      E5: "Sets the organization's frontend architecture direction — design-system governance, framework and rendering-model choices — and removes the systemic obstacles blocking it."
      E6: "Makes the company-level frontend bets (platform, framework generation, build-vs-buy for the design system) and is the named authority when they're contested."
  - theme: "Styling & responsive layout"
    capability: FE-09
    key_area: "Frontend Engineering"
    key_attribute: "UI Implementation"
    anchor: css-cascade5
    anchor_why: "cascade and specificity mechanics are the standard reference for predictable layout, substituted for MDN's guides (no bibliography entry) since it is the catalog's own FE-09 P3 anchor; layout skill is the difference between UIs that match design at one width and UIs that hold up everywhere."
    mappings:
      E1: {p: P1, sources: [css-cascade5, sfia9], why: "FE-09 P1 ('Applies existing styles and tokens to components under review.') is the guided bar — implementing designs at standard breakpoints with review catching cascade/specificity misses is applying existing tokens under review."}
      E2: {p: P2, sources: [css-cascade5, sfia9], why: "FE-09 P2 ('Implements styling independently following design systems for standard components.') matches independent layout work across viewports without per-case hacks — following the design system for standard components."}
      E3: {p: P3, sources: [css-cascade5, sfia9], why: "FE-09 P3 ('Designs scalable styling systems autonomously; resolves specificity, theming, and reuse issues.') is the capability-owning bar: untangling specificity problems others are stuck on and establishing tokens/theming conventions is autonomous scalable-system design."}
      E4: {p: P4, sources: [css-cascade5, larson2021-staffeng], why: "FE-09 P4 ('Defines styling architecture and conventions others adopt; untangles fragile, sprawling styles.') is Staff-scope: consolidating styling approaches across teams into one system with a followed migration guide is 'conventions others adopt.'"}
      E5: {p: P5, sources: [css-cascade5, larson2021-staffeng], why: "FE-09 P5 ('Sets styling-system strategy across the organization; anticipates evolving presentation approaches.') matches owning the org's theming and visual-consistency strategy."}
      E6: {p: P6, sources: [css-cascade5, larson2021-staffeng], why: "FE-09 P6 ('Defines what good styling architecture means industrywide; shapes widely adopted systems.') is company/industry scope — directing brand-scale, multi-product presentation-layer strategy is that external-authority register."}
    evidence:
      E1: "Implements designs to match mockups at standard breakpoints using the project's styling approach; fixes visual bugs with guidance on cascade and specificity issues."
      E2: "Builds layouts that hold up across viewports and content lengths without per-case hacks, choosing flexbox and grid appropriately and using design tokens consistently."
      E3: "Untangles specificity and layout problems others are stuck on and establishes styling conventions (tokens, layering, theming) that keep the capability's CSS predictable."
      E4: "Consolidates styling approaches across teams into one system, retiring duplicated patterns and writing the migration guide teams actually follow."
      E5: "Owns the org's theming and visual-consistency strategy, deciding tooling and token architecture and measuring adoption."
      E6: "Directs company-level presentation-layer strategy, including brand-scale theming, white-labeling, or multi-product visual platforms."
  - theme: "Client state management & data flow"
    capability: FE-05
    key_area: "Frontend Engineering"
    key_attribute: "State & Data Flow"
    anchor: facebook-flux2014
    anchor_why: "unidirectional data flow and single-ownership of state are the reference discipline for predictable UIs, substituted for Redux's own docs (no bibliography entry) since Redux directly implements Flux and it is the catalog's own FE-05 P3/P4/P6 anchor; most frontend defects are state-synchronization defects."
    mappings:
      E1: {p: P1, sources: [facebook-flux2014, sfia9], why: "FE-05 P1 ('Reads and updates simple shared state following established patterns under review.') is the guided bar — using the codebase's existing state patterns and tracing where state lives matches reading/updating shared state under review."}
      E2: {p: P2, sources: [facebook-flux2014, sfia9], why: "FE-05 P2 ('Manages component and shared state independently for standard flows with normal review.') matches choosing the right home for each piece of state independently, for the standard flows of features they own."}
      E3: {p: P3, sources: [facebook-flux2014, sfia9], why: "FE-05 P3 ('Designs state architecture autonomously; resolves complex synchronization and ownership issues.') is the capability-owning bar: designing cache invalidation, optimistic updates and real-time sync is autonomous complex-synchronization design."}
      E4: {p: P4, sources: [facebook-flux2014, larson2021-staffeng], why: "FE-05 P4 ('Defines state-management patterns others adopt; untangles tangled global and derived state.') is Staff-scope — converging divergent state approaches across teams into shared patterns others adopt."}
      E5: {p: P5, sources: [facebook-flux2014, larson2021-staffeng], why: "FE-05 P5 ('Sets state-management strategy across the organization; anticipates evolving paradigms.') matches setting the org's client-data architecture and arbitrating cross-team conflicts."}
      E6: {p: P6, sources: [facebook-flux2014, larson2021-staffeng], why: "FE-05 P6 ('Defines what good client state management means; shapes industry patterns and practice.') is company/industry scope — owning the long-horizon client-data model the company's products converge on."}
    evidence:
      E1: "Uses the codebase's existing state patterns correctly — local state vs. shared store vs. server cache — and traces where a given piece of state lives and why."
      E2: "Chooses the right home for each piece of state (local, lifted, global, URL, server-cache) and keeps derived state computed rather than duplicated, with loading, error, and stale states honest in the UI."
      E3: "Designs the state architecture for a capability — cache invalidation, optimistic updates, real-time sync — and spots stale-data, race-condition, and re-render-prone flows in others' code before they ship."
      E4: "Converges divergent state approaches across teams into shared patterns, writing the decision record and unwinding the worst legacy state tangles personally."
      E5: "Sets the org's client-data architecture (caching strategy, offline posture, real-time sync) and arbitrates when teams' needs conflict."
      E6: "Owns the long-horizon client-data strategy — the model the company's products converge on — and sponsors the platform work to get there."
  - theme: "Data fetching & caching"
    capability: FE-06
    key_area: "Frontend Engineering"
    key_attribute: "State & Data Flow"
    anchor: rfc9111
    anchor_why: "HTTP caching semantics (freshness, validation, invalidation) are the standard underlying what TanStack Query implements, substituted for its docs (no bibliography entry) since RFC 9111 is the catalog's own FE-06 anchor at every level; fetching discipline determines perceived speed, correctness under concurrency, and backend load."
    mappings:
      E1: {p: P1, sources: [rfc9111, sfia9], why: "FE-06 P1 ('Fetches and displays data for simple endpoints under review.') is the guided bar — fetching through the established client/hooks and rendering loading/error states for assigned screens."}
      E2: {p: P2, sources: [rfc9111, sfia9], why: "FE-06 P2 ('Implements fetching with loading and error states independently for standard cases.') matches implementing correct cache keys, invalidation and race handling independently for owned features."}
      E3: {p: P3, sources: [rfc9111, sfia9], why: "FE-06 P3 ('Designs fetching and caching strategies autonomously; handles invalidation and race conditions.') is the capability-owning bar: designing what is cached, for how long, and what invalidates it, catching waterfalls in review."}
      E4: {p: P4, sources: [rfc9111, larson2021-staffeng], why: "FE-06 P4 ('Defines fetching and caching patterns teams adopt; solves hard staleness and consistency problems.') is Staff-scope — standardizing data-access patterns across teams and deprecating ad-hoc fetching."}
      E5: {p: P5, sources: [rfc9111, larson2021-staffeng], why: "FE-06 P5 ('Sets strategy for client data access and caching; anticipates evolving data-sync models.') matches owning the org's client-server data strategy including SSR/streaming trade-offs."}
      E6: {p: P6, sources: [rfc9111, larson2021-staffeng], why: "FE-06 P6 ('Shapes industry practice for client data fetching and caching; pioneers influential approaches.') is company/industry scope — setting company-level direction for how clients consume data at scale, shaping platform and vendor bets."}
    evidence:
      E1: "Fetches data through the codebase's established client and hooks and renders loading and error states; reproduces a stale-data bug with guidance."
      E2: "Implements fetching with correct cache keys, invalidation, and race handling, and handles pagination and optimistic updates using established patterns."
      E3: "Designs the fetching and caching strategy for a capability — what is cached, for how long, and what invalidates it — and spots request waterfalls and N+1 patterns in review."
      E4: "Standardizes data-access patterns across teams, building or selecting the shared data layer and deprecating ad-hoc fetching."
      E5: "Owns the org's client-server data strategy, including SSR and streaming trade-offs and cache coherence across products."
      E6: "Sets company-level direction for how clients consume data at scale, shaping platform investments and vendor-versus-build decisions."
  - theme: "Accessibility"
    capability: FE-12
    key_area: "Frontend Engineering"
    key_attribute: "Frontend Quality"
    anchor: wcag22
    anchor_why: "the normative standard and pattern library for accessible web interfaces; accessibility is a legal and ethical floor that must be engineered in, not retrofitted."
    mappings:
      E1: {p: P1, sources: [wcag22, sfia9], why: "FE-12 P1 ('Applies basic accessibility fixes following checklists under review.') is the guided bar — using semantic HTML and running the team's accessibility checks before requesting review is checklist-following."}
      E2: {p: P2, sources: [wcag22, sfia9], why: "FE-12 P2 ('Implements accessible components independently meeting standard requirements.') matches building keyboard-navigable, screen-reader-usable features independently, verified with assistive tech before merge."}
      E3: {p: P3, sources: [wcag22, sfia9], why: "FE-12 P3 ('Designs accessible experiences autonomously; resolves complex assistive-technology and interaction cases.') is the capability-owning bar: catching regressions automated tools miss (focus traps, reading order) is resolving complex interaction cases."}
      E4: {p: P4, sources: [wcag22, larson2021-staffeng], why: "FE-12 P4 ('Defines accessibility approaches teams adopt; solves the hardest inclusive-design problems.') is Staff-scope — building accessibility into shared components and CI gates so teams inherit conformance by default."}
      E5: {p: P5, sources: [wcag22, larson2021-staffeng], why: "FE-12 P5 ('Sets accessibility strategy across the organization; anticipates evolving standards and needs.') matches owning the org's accessibility standard and audit posture, reported to leadership."}
      E6: {p: P6, sources: [wcag22, larson2021-staffeng], why: "FE-12 P6 ('Shapes industry accessibility practice; influences standards and widely referenced guidance.') is company/industry scope — setting company accessibility policy and representing it externally (compliance commitments, procurement)."}
    evidence:
      E1: "Uses semantic HTML and design-system components rather than div soup, and runs the team's accessibility checks before requesting review."
      E2: "Builds keyboard-navigable, screen-reader-usable features — focus management, labels, ARIA only where semantics fall short — verifying with assistive tech before merge."
      E3: "Catches accessibility regressions in review that automated tools miss (focus traps, reading order, announced state changes) and teaches the patterns that prevent them."
      E4: "Builds accessibility into shared components and CI gates so teams inherit conformance by default, and drives remediation across surfaces no one team owns."
      E5: "Owns the org's accessibility standard and audit posture, reporting conformance to leadership and prioritizing systemic fixes."
      E6: "Sets company accessibility policy and represents it externally (compliance commitments, procurement, public conformance statements)."
  - theme: "Web performance"
    capability: FE-13
    key_area: "Frontend Engineering"
    key_attribute: "Frontend Quality"
    anchor: web-vitals
    anchor_why: "the industry-standard user-centric performance metrics tied to real business outcomes; frontend performance is a measured product property with direct conversion and retention impact, not a polish pass."
    mappings:
      E1: {p: P1, sources: [web-vitals, sfia9], why: "FE-13 P1 ('Applies known performance fixes to simple cases under guidance.') is the guided bar — reading a Lighthouse report and fixing flagged issues (oversized images, blocking scripts) with guidance on trade-offs."}
      E2: {p: P2, sources: [web-vitals, sfia9], why: "FE-13 P2 ('Profiles and improves standard performance issues independently.') matches keeping shipped features within budget, profiling render/bundle cost before merge independently."}
      E3: {p: P3, sources: [web-vitals, sfia9], why: "FE-13 P3 ('Diagnoses and optimizes performance autonomously across rendering, loading, and runtime.') is the capability-owning bar: owning Core Web Vitals and diagnosing field regressions from RUM data to root cause is autonomous cross-layer diagnosis."}
      E4: {p: P4, sources: [web-vitals, larson2021-staffeng], why: "FE-13 P4 ('Defines performance approaches teams adopt; solves the most stubborn bottlenecks.') is Staff-scope — building the performance budgets and CI gates several teams run on."}
      E5: {p: P5, sources: [web-vitals, larson2021-staffeng], why: "FE-13 P5 ('Sets frontend performance strategy and budgets; anticipates emerging performance concerns.') matches setting org-wide performance targets tied to business metrics leadership acts on."}
      E6: {p: P6, sources: [web-vitals, larson2021-staffeng], why: "FE-13 P6 ('Defines what good frontend performance means industrywide; pioneers influential techniques.') is company/industry scope — making company-level performance-architecture bets and being accountable for UX speed as a competitive property."}
    evidence:
      E1: "Reads a Lighthouse or devtools performance report and fixes the flagged issues in their task — oversized images, blocking scripts, unnecessary re-renders — with guidance on trade-offs."
      E2: "Keeps the features they ship within the team's performance budget, profiling render and bundle cost before merge and lazy-loading what the critical path doesn't need."
      E3: "Owns Core Web Vitals for a capability, diagnosing field regressions from RUM data to root cause — hydration cost, main-thread contention, layout shift — and rejecting designs that can't hit budget."
      E4: "Builds the performance budgets, CI gates, and monitoring several teams run on, and leads the cross-team efforts that move p75 metrics."
      E5: "Sets org-wide performance targets and the platform investments to hit them — rendering architecture, edge/CDN posture — tied to business metrics leadership acts on."
      E6: "Makes the company-level performance-architecture bets and is accountable for user-experience speed as a competitive property of the product."
  - theme: "Service design & boundaries"
    capability: ARC-02
    key_area: "Backend & API Engineering"
    key_attribute: "Services & Runtime"
    anchor: newman2021-microservices
    anchor_why: "service boundaries follow domain seams, and coupling/cohesion trade-offs dominate distributed-system cost; where the boundaries sit determines whether the backend evolves or ossifies."
    mappings:
      E1: {p: P1, sources: [newman2021-microservices, sfia9], why: "ARC-02 P1 ('Splits a service along boundaries already defined, with decomposition reviewed.') is the guided bar — adding endpoints/handlers to an existing service following its conventions is working within boundaries already defined."}
      E2: {p: P2, sources: [newman2021-microservices, sfia9], why: "ARC-02 P2 ('Decomposes routine systems into services using established boundary heuristics independently.') matches designing and shipping a well-factored module or small service independently using established heuristics."}
      E3: {p: P3, sources: [newman2021-microservices, sfia9], why: "ARC-02 P3 ('Designs boundaries for complex domains, resolving overlap and ownership ambiguity autonomously.') is the capability-owning bar: drawing service boundaries by trade-off in design docs and catching hidden-dependency problems is resolving ownership ambiguity autonomously."}
      E4: {p: P4, sources: [newman2021-microservices, larson2021-staffeng], why: "ARC-02 P4 ('Defines decomposition methods and boundary heuristics teams reuse across products.') is Staff-scope — restructuring the service landscape across teams with migration plans others follow."}
      E5: {p: P5, sources: [newman2021-microservices, larson2021-staffeng], why: "ARC-02 P5 ('Sets enterprise-wide boundary and ownership strategy, anticipating decomposition pressures.') matches setting the org's service architecture direction and retiring patterns that no longer serve it."}
      E6: {p: P6, sources: [newman2021-microservices, larson2021-staffeng], why: "ARC-02 P6 ('Shapes how the industry reasons about service boundaries and decomposition.') is company/industry scope — making company-level backend platform bets with decade-scale consequences."}
    evidence:
      E1: "Adds endpoints and handlers to an existing Node/TypeScript service following its layering, error-handling, and config conventions; explains the request path through the service in their own words."
      E2: "Designs and ships a well-factored module or small service independently, separating transport, domain logic, and persistence, and handling errors, timeouts, and idempotency deliberately."
      E3: "Draws service boundaries by trade-off in design docs that name the alternatives considered, designing for failure (retries, idempotency, backpressure) and catching coupling and hidden-dependency problems in others' designs before build."
      E4: "Restructures the service landscape across teams — splitting, merging, or extracting services with migration plans that ship incrementally — without stopping delivery."
      E5: "Sets the org's service architecture direction (runtime choices, communication patterns, platform primitives) and retires the patterns that no longer serve it."
      E6: "Makes company-level backend platform bets and is the tie-breaking authority on architecture decisions with decade-scale consequences."
  - theme: "Runtime & async correctness"
    capability: CS-04
    key_area: "Backend & API Engineering"
    key_attribute: "Services & Runtime"
    anchor: herlihy-shavit2008
    anchor_why: "principled treatment of shared-state and synchronization correctness, substituted for Node's own event-loop guide (no bibliography entry) since it is the catalog's own CS-04 anchor at P3/P4/P6; full stack engineers ship Node services whose failure modes are concurrency failure modes."
    mappings:
      E1: {p: P1, sources: [herlihy-shavit2008, sfia9], why: "CS-04 P1 ('Writes concurrent code using given primitives under review.') is the guided bar — using async/await correctly with review catching the misses is writing concurrent code with given primitives, under review."}
      E2: {p: P2, sources: [herlihy-shavit2008, sfia9], why: "CS-04 P2 ('Implements standard concurrent patterns independently for routine workloads.') matches keeping the event loop healthy in owned code, bounding concurrency and adding timeouts independently."}
      E3: {p: P3, sources: [herlihy-shavit2008, sfia9], why: "CS-04 P3 ('Designs correct, efficient concurrency for complex shared-state problems autonomously.') is the capability-owning bar: diagnosing production event-loop stalls and race conditions from traces, and designing backpressure, is autonomous complex-concurrency design."}
      E4: {p: P4, sources: [herlihy-shavit2008, larson2021-staffeng], why: "CS-04 P4 ('Defines concurrency patterns and reasoning others adopt to avoid subtle defects.') is Staff-scope — setting the concurrency, timeout, and resilience defaults multiple teams inherit through shared libraries."}
      E5: {p: P5, sources: [herlihy-shavit2008, larson2021-staffeng], why: "CS-04 P5 ('Sets concurrency strategy organization-wide, anticipating parallelism challenges.') matches driving org-wide runtime strategy (Node versions, worker models) from fleet-level data."}
      E6: {p: P6, sources: [herlihy-shavit2008, larson2021-staffeng], why: "CS-04 P6 ('Shapes industry understanding of concurrency and parallelism.') is company/industry scope — owning company-level runtime bets and being the escalation point for the hardest production mysteries."}
    evidence:
      E1: "Uses async/await correctly — awaits promises, handles rejections, avoids sequential awaits where work is parallel — with review catching the misses."
