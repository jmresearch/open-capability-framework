      E2: {p: P2, sources: [winters2020, procida-diataxis, sfia9], why: "CC-02 P2 ('Documents their area well; proactively shares techniques with the team.') matches documenting their features so the next engineer needs no meeting (READMEs, ADR-style notes), proactively."}
      E3: {p: P3, sources: [winters2020, procida-diataxis, sfia9], why: "CC-02 P3 ('Creates documentation and forums that raise a whole domain's understanding.') is the capability-owning bar: writing design docs that anchor a capability's decisions, cited months later, is raising a whole domain's understanding."}
      E4: {p: P4, sources: [winters2020, procida-diataxis, larson2021-staffeng], why: "CC-02 P4 ('Builds knowledge-sharing systems adopted across teams.') is Staff-scope — writing the RFCs and strategy docs that align multiple teams on contested decisions."}
      E5: {p: P5, sources: [winters2020, procida-diataxis, larson2021-staffeng], why: "CC-02 P5 ('Defines how the org captures and spreads knowledge.') matches writing the strategy and standards documents the organization executes against, raising the org's documentation bar by example."}
      E6: {p: P6, sources: [winters2020, procida-diataxis, larson2021-staffeng], why: "CC-02 P6 ('Shapes industry-facing knowledge practice.') is company/industry scope — writing the company-defining technical narratives (public posts, board-level briefs) that survive external scrutiny."}
    evidence:
      E1: "Writes PR descriptions, bug reports, and status updates a reviewer can act on without asking questions, and updates the docs their change makes stale."
      E2: "Documents their features so the next engineer needs no meeting — READMEs, runbooks, ADR-style decision notes stating problem, options, and choice — matched to the reader, not the writer."
      E3: "Writes design docs that anchor a capability's decisions — conclusion first, alternatives named, trade-offs argued, open questions explicit — that get cited months later, and edits others' docs to sharpen the argument, not the grammar."
      E4: "Writes the RFCs and strategy docs that align multiple teams on contested decisions, framing trade-offs so disagreement is about substance, not confusion, structured so busy readers reach the decision point fast."
      E5: "Writes the strategy and standards documents the organization executes against, legible to both engineers and executives, and raises the org's documentation bar by example."
      E6: "Writes the company-defining technical narratives — public engineering posts, architecture visions, board-level briefs — that survive scrutiny from the board, customers, and the industry."
  - theme: "Stakeholder communication"
    capability: CC-01
