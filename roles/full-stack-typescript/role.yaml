      E2: "Raises abuse cases in design discussions unprompted — enumeration, replay, object-level access mistakes — for features they own."
      E3: "Runs lightweight threat models for a capability's significant designs, records the accepted risks, and makes security review a standing part of its design process."
      E4: "Facilitates threat modeling across teams and trains engineers to run their own, focusing effort on the highest-value targets."
      E5: "Owns the org's security-review program and risk register, deciding where scrutiny concentrates."
      E6: "Shapes company security posture with threat-informed strategy presented at the executive level."
  - theme: "Dependency & supply-chain hygiene"
    capability: SEC-09
    key_area: "Security"
    key_attribute: "Supply Chain & Data Protection"
    anchor: slsa
