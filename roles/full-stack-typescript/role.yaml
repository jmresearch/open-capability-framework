    mappings:
      E1: {p: P1, sources: [larson2021-staffeng, sfia9], why: "CC-01 P1 ('Communicates status clearly; documentation is accurate.') is the guided bar — giving accurate, honest status in standups and tickets, naming what's blocked, is literally that text."}
      E2: {p: P2, sources: [larson2021-staffeng, sfia9], why: "CC-01 P2 ('Writes clear design notes, runbooks and PRs; explains trade-offs without overselling.') matches explaining their technical work to non-engineers in outcome terms and warning of slips with a revised plan."}
      E3: {p: P3, sources: [larson2021-staffeng, sfia9], why: "CC-01 P3 ('Writes design docs that drive decisions; translates technical risk for non-technical stakeholders.') is the capability-owning bar: translating a capability's technical state for any audience and running the meetings where they decide is translating risk at domain scope."}
      E4: {p: P4, sources: [larson2021-staffeng], why: "CC-01 P4 ('Expert at making complex capability/risk legible to executives without dumbing it down; RFCs align orgs.') is Staff-scope by its own text — keeping multiple teams' stakeholders aligned through change is the RFC-scale register."}
      E5: {p: P5, sources: [larson2021-staffeng], why: "CC-01 P5 ('Strategy memos leadership acts on; org-wide and external reach.') matches representing engineering reality to org leadership in planning and crisis alike, trusted to do so unfiltered."}
      E6: {p: P6, sources: [larson2021-staffeng], why: "CC-01 P6 ('A clarifying voice at company scale; externally recognized.') is company/industry scope — representing the company's technology externally (customers, partners, boards) without overclaiming."}
