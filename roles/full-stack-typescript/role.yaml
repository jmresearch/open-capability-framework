      E2: {p: P2, sources: [parnas1972, sfia9], why: "SWE-05 P2 ('Designs sound components; understands coupling, cohesion, interface design.') matches designing their features within the existing architecture with clear module boundaries, writing a short design note."}
      E3: {p: P3, sources: [parnas1972, sfia9], why: "SWE-05 P3 ('Designs systems for evolution: clean seams, versioned interfaces, replaceable parts.') is the capability-owning bar: selecting patterns by trade-off in design docs and designing for evolution across a capability is domain-scope evolution design."}
      E4: {p: P4, sources: [parnas1972, larson2021-staffeng], why: "SWE-05 P4 ('Mastery of architecture for complex systems; sets patterns and prevents drift.') is Staff-scope — producing the designs that resolve problems spanning multiple teams and getting them adopted through persuasion."}
      E5: {p: P5, sources: [parnas1972, larson2021-staffeng], why: "SWE-05 P5 ('Sets multi-year architecture direction across the org.') matches setting the architectural direction multiple teams build against and removing systemic obstacles."}
      E6: {p: P6, sources: [parnas1972, larson2021-staffeng], why: "SWE-05 P6 ('Authoritative and externally credible; defines architectural approach others follow.') is company/industry scope — owning the company's technical architecture narrative and being publicly accountable for irreversible calls."}
    evidence:
      E1: "Explains the system's architecture in their own words and navigates its diagrams to find where a change belongs, implementing designs specified by others."
      E2: "Designs their features within the existing architecture with clear module boundaries and hidden internals, writing a short design note for anything non-obvious and naming at least one alternative."
      E3: "Selects patterns by trade-off in design docs that name the alternatives considered, designs for evolution, and catches coupling and scaling problems in others' designs before build."
      E4: "Produces the designs that resolve problems spanning multiple teams, and gets them adopted through review and persuasion rather than mandate."
      E5: "Sets the architectural direction multiple teams build against and removes the systemic obstacles that block it."
      E6: "Owns the company's technical architecture narrative — where the platform is going and why — making the irreversible calls and being publicly accountable for them."
  - theme: "Readable, maintainable code"
    capability: SWE-02
    key_area: "TypeScript & Software Design"
    key_attribute: "Architecture & Code Health"
    anchor: fowler2018
    anchor_why: "code smells and behavior-preserving transformation are the working definition of maintainability; code is read far more than written, and full stack code is read by people who don't live in that half of the stack."
    mappings:
      E1: {p: P1, sources: [fowler2018, sfia9], why: "SWE-02 P1 ('Writes functional, readable code; uses version control correctly; responds well to review.') is the guided bar — writing small, clearly named functions matching conventions, and incorporating review feedback without repeating issues, is literally that text."}
      E2: {p: P2, sources: [fowler2018, sfia9], why: "SWE-02 P2 ('Writes clean, documented, modular code; gives useful review feedback.') matches leaving code simpler than found as a matter of course, writing comments that explain why, independently."}
      E3: {p: P3, sources: [fowler2018, sfia9], why: "SWE-02 P3 ('Designs for maintainability; leads refactors of problem areas; review feedback teaches.') is the capability-owning bar: setting the maintainability bar for a capability through review — naming the smell, not just the fix — is review feedback that teaches."}
      E4: {p: P4, sources: [fowler2018, larson2021-staffeng], why: "SWE-02 P4 ('Expert in code health at scale (shared libraries, deprecations, large migrations).') is Staff-scope — driving code-health initiatives across teams (dead-code deletion, restructuring) with before/after evidence."}
      E5: {p: P5, sources: [fowler2018, larson2021-staffeng], why: "SWE-02 P5 ('Shapes org-wide engineering standards for long-lived codebases.') matches owning org-level code-health strategy, making maintainability a funded, tracked property legible to leadership."}
      E6: {p: P6, sources: [fowler2018, larson2021-staffeng], why: "SWE-02 P6 ('Defines what good engineering looks like company-wide; externally recognized.') is company/industry scope — setting company engineering-quality standards and modeling them in code still personally written."}
    evidence:
      E1: "Writes small, clearly named functions that match the codebase's conventions, and incorporates review feedback without repeating the same class of issue."
      E2: "Leaves code simpler than found as a matter of course — refactors as part of feature work, keeps modules cohesive, writes comments that explain why, not what; review comments on their PRs trend toward design, not cleanup."
      E3: "Sets the maintainability bar for a capability through review — names the smell and the refactoring, suggests the simplification rather than the workaround, and articulates why a design is too complicated, not just that it is."
      E4: "Drives code-health initiatives across teams — dead-code deletion, module restructuring, convention alignment — with before/after evidence."
      E5: "Owns org-level code-health strategy, making maintainability a funded, tracked property rather than a virtue, legible to leadership as risk and velocity."
      E6: "Sets company engineering-quality standards and models them in the code they still write."
  - theme: "Refactoring & technical debt"
    capability: EM-15
    key_area: "TypeScript & Software Design"
    key_attribute: "Architecture & Code Health"
    anchor: cunningham1992
    anchor_why: "debt as a deliberate, tracked, economic trade-off rather than a moral failing is the origin framing this capability is built on; codebases rot by default, and pricing debt honestly is what keeps change cheap."
    mappings:
      E1: {p: P1, sources: [cunningham1992, sfia9], why: "EM-15 P1 ('Records known shortcuts and defects when directed; raises debt concerns in planning.') is the guided bar: recording debt when directed and raising it in planning is a passive, prompted register, not self-initiated tracking."}
      E2: {p: P2, sources: [cunningham1992, sfia9], why: "EM-15 P2 ('Keeps a visible debt register with the cost of carry noted and defends a steady paydown allocation in planning rather than begging quarter by quarter.') matches independently structuring larger changes into reviewable steps and recording the debt taken on with its reason and exit path — a self-initiated register, unprompted."}
      E3: {p: P3, sources: [cunningham1992, sfia9], why: "EM-15 P3 ('Distinguishes debt worth carrying from debt that will detonate, sequences remediation by risk, and prices debt in incident and velocity terms stakeholders accept.') is the capability-owning bar — pricing debt in terms stakeholders accept and sequencing remediation by risk across a capability is domain-scope portfolio judgment, not just tracking."}
      E4: {p: P4, sources: [cunningham1992, larson2021-staffeng], why: "EM-15 P4 ('Makes debt legible across multiple teams — shared taxonomy, reporting rhythm — and gets cross-team risk ... owned and funded.') is Staff-scope by its own text — a shared taxonomy 'across multiple teams' and getting the orphaned shared library funded is the multi-team register."}
      E5: {p: P5, sources: [cunningham1992, larson2021-staffeng], why: "EM-15 P5 ('Carries technical risk onto the executive risk register — top exposures known, sized, owned, trending — and lands multi-quarter remediation programs against feature pressure.') is the org-authority bar: an executive risk register and multi-quarter programs are Senior Staff's org-wide accountability."}
      E6: {p: P6, sources: [cunningham1992, larson2021-staffeng], why: "EM-15 P6 ('Sets an organization's speed-versus-soundness posture explicitly ... and holds it under growth pressure.') is company/industry scope — the explicit, held-under-pressure posture for where debt is accepted at all is the P6 policy-setting register."}
    evidence:
      E1: "Adds a `// TODO(debt): hardcoded 30-day window, revisit before Q3 launch` comment on a shortcut they took, and brings it up unprompted when their tech lead asks what got cut in the sprint."
      E2: "Keeps a running doc of the debt their component has taken on this quarter — what, why, and the exit condition — and defends a fixed 15% paydown slice in planning instead of re-arguing for it every sprint."
      E3: "Tells the roadmap owner that the auth-service's dual-write shim is debt that will detonate at their next 2x traffic milestone, not debt that can sit, and gets a two-sprint remediation slotted in with the incident-cost math that made the case."
      E4: "Builds the shared debt taxonomy (security/perf/velocity/correctness) three teams now tag their tickets with, and gets the shared auth library nobody owned assigned a team and a paydown budget."
      E5: "Presents the org's top five debt exposures — sized in incident-dollars and velocity-days — on the quarterly executive risk register, and gets two multi-quarter remediation programs funded against competing feature asks."
      E6: "Sets the explicit rule that new-market launches may carry data-model debt for one quarter but never carry auth debt past code review, and holds that line when a VP pushes to ship a launch with an auth shortcut."
  - theme: "Code review practice"
    capability: SWE-04
    key_area: "TypeScript & Software Design"
    key_attribute: "Architecture & Code Health"
    anchor: winters2020
    anchor_why: "review as the primary mechanism for knowledge transfer and a shared quality bar; review is where a team's actual standards live, whatever the wiki says."
    mappings:
      E1: {p: P1, sources: [winters2020, sfia9], why: "SWE-04 P1 ('Navigates the codebase and understands code shown; reviews small changes.') is the guided bar — responding to feedback without defensiveness and reviewing small changes for readability/tests is literally that text."}
      E2: {p: P2, sources: [winters2020, sfia9], why: "SWE-04 P2 ('Independently understands unfamiliar code; gives timely, specific review feedback.') matches giving reviews that catch real defects (edge cases, type holes) and distinguishing blocking issues from preferences, independently."}
      E3: {p: P3, sources: [winters2020, sfia9], why: "SWE-04 P3 ('Quickly grasps complex/legacy systems; reviews raise the bar across a domain.') is the capability-owning bar: reviewing for design and long-term cost, and teaching through comments others save and share, is 'reviews raise the bar across a domain.'"}
      E4: {p: P4, sources: [winters2020, larson2021-staffeng], why: "SWE-04 P4 ('Expert at reviewing high-risk changes; review standards spread across teams.') is Staff-scope by its own text — calibrating review standards across teams, personally reviewing the cross-cutting changes nobody else can judge, is that exact register."}
      E5: {p: P5, sources: [winters2020, larson2021-staffeng], why: "SWE-04 P5 ('Authority on review practice org-wide.') matches designing the org's review system itself (ownership rules, SLAs, automation), measured by defect-escape metrics."}
      E6: {p: P6, sources: [winters2020, larson2021-staffeng], why: "SWE-04 P6 ('Defines what good review looks like; shapes industry-facing practice.') is company/industry scope — setting the company's engineering-rigor expectations, personally reviewing company-blast-radius changes."}
    evidence:
      E1: "Responds to review feedback promptly and without defensiveness, applies it beyond the flagged line, and reviews small changes for readability and test presence."
      E2: "Gives reviews that catch real defects, not just style — edge cases, type holes, missing tests — distinguishing blocking issues from preferences and phrasing comments about the code, not the coder."
      E3: "Reviews for design, failure modes, and long-term cost — and teaches through review comments others save and share. Turns recurring review comments into lint rules or docs, and calibrates comment severity so authors know what blocks."
      E4: "Calibrates review standards across teams so the bar is consistent, reviewing the cross-cutting changes nobody else can judge and coaching senior engineers on how they review."
      E5: "Designs the org's review system itself — ownership rules, required checks, review SLAs, automation — measured by defect escape and flow metrics."
      E6: "Sets the company's engineering-rigor expectations, personally reviewing the changes with company-level blast radius."
  - theme: "Test strategy & the pyramid"
    capability: QA-01
    key_area: "Quality & Testing"
    key_attribute: "Testing Across the Stack"
    anchor: cohn2009
    anchor_why: "the test pyramid — push tests to the cheapest layer that gives needed confidence — is the origin discipline test-suite shape is measured against; full stack code fails at the seams, and suite shape decides whether the suite is a safety net or a tax."
    mappings:
      E1: {p: P1, sources: [cohn2009, sfia9], why: "QA-01 P1 ('Drafts test plans from templates for defined features, reviewed before execution.') is the guided bar — writing unit tests following the team's patterns and explaining the pyramid's purpose in their own words is template-following, reviewed."}
      E2: {p: P2, sources: [cohn2009, sfia9], why: "QA-01 P2 ('Produces complete test strategies for standard projects independently, scoping coverage and risk.') matches choosing the right test layer per risk across frontend, API, and data layers, independently."}
      E3: {p: P3, sources: [cohn2009, sfia9], why: "QA-01 P3 ('Devises test strategies for ambiguous, high-risk programs balancing coverage, time, and cost.') is the capability-owning bar: owning the test strategy for a capability, killing tests that cost more than they catch, is devising strategy for ambiguous, high-risk scope."}
      E4: {p: P4, sources: [cohn2009, larson2021-staffeng], why: "QA-01 P4 ('Defines the test-strategy approach and planning patterns other teams adopt.') is Staff-scope — aligning test strategy across teams that share seams (contract tests, shared fixtures, flake budgets)."}
      E5: {p: P5, sources: [cohn2009, larson2021-staffeng], why: "QA-01 P5 ('Sets organizational quality strategy and anticipates how testing must evolve with delivery.') matches setting the organization's testing standards and investment level, backed by escape-rate data."}
      E6: {p: P6, sources: [cohn2009, larson2021-staffeng], why: "QA-01 P6 ('Defines what effective test strategy means for the discipline and influences its practice.') is company/industry scope — owning the company's release-confidence posture and answering for it when it fails."}
    evidence:
      E1: "Writes unit tests for every change following the team's patterns, and explains what each layer of the pyramid is for in their own words."
      E2: "Chooses the right test layer per risk — unit for logic, integration for seams, few end-to-end — covering the frontend, API, and data layers rather than just the easiest one."
      E3: "Owns the test strategy for a capability and kills tests that cost more than they catch, rebalancing an inverted pyramid, deciding coverage targets by risk, and defining which user journeys warrant end-to-end coverage — with the data to justify it."
      E4: "Aligns test strategy across teams that share seams — contract tests where E2E suites were the crutch, shared fixtures, flake budgets — so cross-team changes are safe to make."
      E5: "Sets the organization's testing standards and investment level, backed by data on escape rates and suite cost."
      E6: "Owns the company's release-confidence posture, deciding the quality bar that ships and answering for it when it fails."
  - theme: "Test authoring & implementation quality"
    capability: SWE-03
    key_area: "Quality & Testing"
    key_attribute: "Testing Across the Stack"
    anchor: meszaros2007
    anchor_why: "test code as designed code, tested through the interface the user sees rather than internals; tests coupled to implementation punish refactoring, tests coupled to behavior enable it."
    mappings:
      E1: {p: P1, sources: [meszaros2007, sfia9], why: "SWE-03 P1 ('Writes unit tests with guidance; tests own changes before merging.') is the guided bar — writing readable arrange-act-assert tests using the team's harnesses correctly is literally that text."}
      E2: {p: P2, sources: [meszaros2007, sfia9], why: "SWE-03 P2 ('Applies the testing pyramid; everything shipped arrives tested; mocks dependencies sensibly.') matches writing tests that survive refactoring, isolating external systems with typed fakes at the right boundary."}
      E3: {p: P3, sources: [meszaros2007, sfia9], why: "SWE-03 P3 ('Designs testable systems (contract, property-based, replay from prod); owns a test strategy.') is the capability-owning bar: building the test infrastructure others write tests with (factories, fixtures) and diagnosing deep flake causes is owning testability at domain scope."}
      E4: {p: P4, sources: [meszaros2007, larson2021-staffeng], why: "SWE-03 P4 ('Expert in test strategy at scale (test data, environments, deployment safety).') is Staff-scope — fixing systemic testing problems across teams (flake sources, mock sprawl) with shared harnesses."}
      E5: {p: P5, sources: [meszaros2007, larson2021-staffeng], why: "SWE-03 P5 ('Sets testing/verification discipline across the org.') matches setting org-wide test-authoring standards and keeping suite runtime/reliability inside explicit budgets."}
      E6: {p: P6, sources: [meszaros2007, larson2021-staffeng], why: "SWE-03 P6 ('Shapes the company-wide quality culture; advances verification practice.') is company/industry scope — directing company-level test-infrastructure investment as a productivity multiplier."}
    evidence:
      E1: "Writes readable arrange-act-assert tests that assert behavior, not implementation, using the team's harnesses correctly and fixing a failing test by understanding it rather than snapshot-updating past it."
      E2: "Writes tests that survive refactoring — queries UI the way a user would, isolates external systems with typed fakes at the right boundary, covers error paths and keeps tests deterministic."
      E3: "Builds the test infrastructure others write tests with — factories, fixtures, network mocking — making good tests the path of least resistance, and diagnoses the deep flake causes (async races, shared state, clock) to root cause."
      E4: "Fixes the systemic testing problems across teams — flake sources, slow suites, mock sprawl — providing shared harnesses and coaching teams out of brittle-test patterns."
      E5: "Sets org-wide test-authoring standards and the tooling that enforces them, keeping suite runtime and reliability inside explicit budgets."
      E6: "Directs company-level test-infrastructure investment as a productivity multiplier, with authored practice visible in the highest-stakes systems."
  - theme: "Integration & end-to-end confidence"
    capability: QA-06
    key_area: "Quality & Testing"
    key_attribute: "Testing Across the Stack"
    anchor: robinson2006-cdc
    anchor_why: "consumer-driven contracts verify integrations at the contract and reserve end-to-end coverage for critical journeys, substituted for Fowler's ContractTest article (no direct bibliography entry) since it is the exact named pattern; the highest-value bugs live at the seams between frontend and backend."
    mappings:
      E1: {p: P1, sources: [robinson2006-cdc, sfia9], why: "QA-06 P1 ('Automates defined UI flows using existing patterns, with scripts reviewed for reliability.') is the guided bar — running the end-to-end suite locally and updating existing journey tests with guidance is using existing patterns, reviewed."}
      E2: {p: P2, sources: [robinson2006-cdc, sfia9], why: "QA-06 P2 ('Builds and maintains stable end-to-end UI tests independently for standard journeys.') matches writing stable integration/end-to-end tests for their features' critical paths independently, with controlled test data and no arbitrary sleeps."}
      E3: {p: P3, sources: [robinson2006-cdc, sfia9], why: "QA-06 P3 ('Stabilizes flaky, complex end-to-end flows and designs resilient locator and wait strategies.') is the capability-owning bar: deciding what a capability verifies at which layer (contract tests vs. a thin E2E set) and keeping runtime/flake rate in budget is designing the resilient strategy at domain scope."}
      E4: {p: P4, sources: [robinson2006-cdc, larson2021-staffeng], why: "QA-06 P4 ('Defines UI and end-to-end automation patterns others adopt for reliability at scale.') is Staff-scope — establishing contract-testing infrastructure across team boundaries so teams deploy independently."}
      E5: {p: P5, sources: [robinson2006-cdc, larson2021-staffeng], why: "QA-06 P5 ('Sets end-to-end automation strategy and anticipates challenges from evolving interfaces.') matches owning the org's pre-production confidence strategy, deciding environment topology."}
      E6: {p: P6, sources: [robinson2006-cdc, larson2021-staffeng], why: "QA-06 P6 ('Defines authoritative end-to-end automation practice that shapes the discipline.') is company/industry scope — being accountable for company-level release-confidence architecture, including environment economics."}
    evidence:
      E1: "Runs the end-to-end suite locally and reads its failures to the failing step, updating existing journey tests when their change breaks one, with guidance."
      E2: "Writes stable integration and end-to-end tests for their features' critical paths — user-facing selectors, controlled test data, no arbitrary sleeps — and quarantines flake rather than retrying it blind."
      E3: "Decides what a capability verifies at which layer — contract tests at API seams, a thin E2E set for revenue paths — keeping the suite's runtime and flake rate inside budget."
      E4: "Establishes contract-testing and integration infrastructure across team boundaries — environments, seeded data, contract-test governance — so teams deploy independently without integration freezes."
      E5: "Owns the org's pre-production confidence strategy, deciding the environment topology and what may only be verified in production behind flags."
      E6: "Accountable for company-level release-confidence architecture, including the economics of environments versus production-testing investment."
  - theme: "Debugging & root-cause analysis"
    capability: SWE-06
    key_area: "Quality & Testing"
    key_attribute: "Defect Response & Prevention"
    anchor: zeller2009
    anchor_why: "debugging as hypothesis-driven search, not guesswork; full stack defects cross two runtimes and every process boundary, and systematic isolation is what keeps them tractable."
    mappings:
      E1: {p: P1, sources: [zeller2009, sfia9], why: "SWE-06 P1 ('Debugs issues in own code with support; uses basic tooling.') is the guided bar — reproducing a bug reliably and asking for help with a written summary of what's ruled out is debugging with support."}
      E2: {p: P2, sources: [zeller2009, sfia9], why: "SWE-06 P2 ('Independently diagnoses defects in own area systematically.') matches tracing defects across the stack unaided, stating a hypothesis before each experiment."}
      E3: {p: P3, sources: [zeller2009, sfia9], why: "SWE-06 P3 ('Leads diagnosis of hard, cross-cutting failures; root cause not symptoms.') is the capability-owning bar: being the debugger of last resort for a capability's heisenbug class, from heap snapshots to root cause, is leading hard cross-cutting diagnosis at domain scope."}
      E4: {p: P4, sources: [zeller2009, larson2021-staffeng], why: "SWE-06 P4 ('Expert at the rare/systemic failures; builds tooling that makes them visible.') is Staff-scope — leading cross-team investigations where no single team can see the whole failure, building diagnostic tooling."}
      E5: {p: P5, sources: [zeller2009, larson2021-staffeng], why: "SWE-06 P5 ('The person called for the worst failures; sets diagnostic practice org-wide.') matches raising the organization's debugging capability (runbooks, tooling, teaching) so hard problems stop requiring them personally."}
      E6: {p: P6, sources: [zeller2009, larson2021-staffeng], why: "SWE-06 P6 ('Authority on diagnosis; advances the discipline.') is company/industry scope — handling company-critical unknowns and growing the org's capacity to handle the next one without them."}
    evidence:
      E1: "Reproduces a bug reliably before changing code, isolating with logs, breakpoints, and browser devtools in either runtime, and asks for help with a written summary of what's ruled out."
      E2: "Traces defects across the stack unaided — UI symptom to network to service to query — stating a hypothesis before each experiment and using profilers to find hot paths instead of guessing."
      E3: "Is the debugger of last resort for a capability, cracking the intermittent, race-condition, and heisenbug class from heap snapshots, CPU profiles, and traces, and turns each root cause into a regression test and a prevention."
      E4: "Leads cross-team investigations where no single team can see the whole failure, building or standardizing the diagnostic tooling that shortens everyone's time-to-cause, and teaches the method while doing it."
      E5: "Raises the organization's debugging capability — runbooks, tooling, teaching — so hard problems stop requiring them personally."
      E6: "Handles the company-critical unknowns — the defects with existential stakes — and grows the org's capacity to handle the next one without them."
  - theme: "Quality ownership & prevention"
    capability: QA-14
    key_area: "Quality & Testing"
    key_attribute: "Defect Response & Prevention"
    anchor: forsgren2018
    anchor_why: "change failure rate and MTTR are outcomes of engineering practice, not QA headcount; in a full stack team, quality is built in by the people who ship, or not at all."
    mappings:
      E1: {p: P1, sources: [forsgren2018, sfia9], why: "QA-14 P1 ('Compiles defined quality metrics into standard reports under review.') is the guided bar — verifying their own work before review (testing unhappy paths, checking acceptance criteria) is compiling against a defined checklist."}
      E2: {p: P2, sources: [forsgren2018, sfia9], why: "QA-14 P2 ('Produces meaningful quality reports independently, selecting relevant metrics for routine needs.') matches monitoring their changes after deploy and fixing what they broke without being asked, independently."}
      E3: {p: P3, sources: [forsgren2018, sfia9], why: "QA-14 P3 ('Designs metrics that reveal real quality signals in ambiguous, contested contexts.') is the capability-owning bar: owning a capability's quality metrics and changing the process, not just the code, when they slip is designing real signals at domain scope."}
      E4: {p: P4, sources: [forsgren2018, larson2021-staffeng], why: "QA-14 P4 ('Defines the quality-metrics framework and reporting patterns others adopt.') is Staff-scope — building the quality gates several teams operate and intervening with data when a team's failure rate drifts."}
      E5: {p: P5, sources: [forsgren2018, larson2021-staffeng], why: "QA-14 P5 ('Sets quality-measurement strategy and anticipates which signals will matter as delivery evolves.') matches owning org-level quality outcomes, reporting DORA-style metrics to leadership."}
      E6: {p: P6, sources: [forsgren2018, larson2021-staffeng], why: "QA-14 P6 ('Defines what meaningful quality measurement means for the field and influences its practice.') is company/industry scope — setting the company's quality-vs-speed posture, answerable to customers."}
    evidence:
      E1: "Verifies their own work before review — runs it, tests the unhappy paths, checks the acceptance criteria — rather than relying on reviewers to catch problems."
      E2: "Monitors their changes after deploy and fixes what they broke without being asked, tracking their defects to closure."
      E3: "Owns a capability's quality metrics — escaped defects, change failure rate — and changes the process, not just the code, when they slip."
      E4: "Builds the quality gates and review standards several teams operate, and intervenes with data when a team's failure rate drifts."
      E5: "Owns org-level quality outcomes, reporting DORA-style metrics to leadership and directing the practice changes they imply."
      E6: "Sets the company's quality-vs-speed posture and is answerable for it in front of customers."
  - theme: "Build & CI pipelines"
    capability: OPS-02
    key_area: "Delivery & Operations"
    key_attribute: "Delivery Pipeline"
    anchor: forsgren2018
    anchor_why: "continuous integration and trunk-based practices predict both throughput and stability; the pipeline is the rate limiter on everything else an engineering team does."
    mappings:
      E1: {p: P1, sources: [forsgren2018, sfia9], why: "OPS-02 P1 ('Uses and makes guided fixes to existing pipelines.') is the guided bar — keeping their branch green, reading CI failures to root cause before asking for review, is a guided fix to an existing pipeline."}
      E2: {p: P2, sources: [forsgren2018, sfia9], why: "OPS-02 P2 ('Independently builds and improves pipelines for their area.') matches integrating small and often and fixing pipeline config for their area independently."}
      E3: {p: P3, sources: [forsgren2018, sfia9], why: "OPS-02 P3 ('Designs deployment safety (progressive delivery, rollback) for a domain.') is the capability-owning bar: owning pipeline health for a capability, gating on the checks that matter, is designing deployment safety at domain scope."}
      E4: {p: P4, sources: [forsgren2018, larson2021-staffeng], why: "OPS-02 P4 ('Expert in delivery engineering at scale; sets standards across teams.') is Staff-scope — building the shared build platform (remote caching, merge queues) that keeps CI fast for many teams at once."}
      E5: {p: P5, sources: [forsgren2018, larson2021-staffeng], why: "OPS-02 P5 ('Defines the org's delivery/release philosophy.') matches owning the org's delivery metrics and pipeline strategy, directing investment at the biggest bottleneck."}
      E6: {p: P6, sources: [forsgren2018, larson2021-staffeng], why: "OPS-02 P6 ('Advances release engineering practice company-wide.') is company/industry scope — setting company delivery strategy (build-vs-buy on CI) with the business case attached."}
    evidence:
      E1: "Keeps their branch green — reads CI failures to the root cause, reproduces them locally, and fixes them before asking for review; never merges on red."
      E2: "Integrates small and often and fixes pipeline config for their area — adds checks, caches dependencies, parallelizes slow stages — treating a broken main build as their interrupt."
      E3: "Owns pipeline health for a capability and keeps it fast — build times within budget, flakes quarantined with follow-through, gating on the checks that matter (types, lint, tests, bundle size) — treating a slow pipeline as an incident, not a fact of life."
      E4: "Builds or overhauls the shared build platform (monorepo task graphs, remote caching, merge queues, affected-only builds) that keeps CI fast for many teams at once, measurably improving their lead time."
      E5: "Owns the org's delivery metrics and pipeline strategy, reporting DORA-style measures to leadership and directing investment at the biggest bottleneck."
      E6: "Sets company delivery strategy — build-vs-buy on CI, engineering-productivity investment — with the business case attached."
  - theme: "Release & deployment practices"
    capability: OPS-30
    key_area: "Delivery & Operations"
    key_attribute: "Delivery Pipeline"
    anchor: humble-farley2010
    anchor_why: "small, frequent, automated, reversible releases, decoupling deploy from release; how software reaches production determines the blast radius of every mistake."
    mappings:
      E1: {p: P1, sources: [humble-farley2010, sfia9], why: "OPS-30 P1 ('Follows the release process exactly — flags, staged rollout steps, verification checklists — verifies their change in production, and rolls back with guidance.') is the guided bar by its own text: following the process exactly and rolling back 'with guidance' is the Associate register."}
      E2: {p: P2, sources: [humble-farley2010, sfia9], why: "OPS-30 P2 ('Ships behind flags with a rollback plan by default, monitors rollouts and reverts on their own judgment when signals degrade ...') is the independent-component bar: 'on their own judgment' is independent decision-making at component scope, one step past following a checklist."}
      E3: {p: P3, sources: [humble-farley2010, sfia9], why: "OPS-30 P3 ('Designs the rollout for risky changes — canary criteria, migration sequencing, flag lifecycle, kill switches — and reviews others' rollout plans for blast radius; the person teams ask how to ship something safely.') is the capability-owning bar: designing rollout criteria and being the person teams consult is domain-scope authorship, not just executing one's own rollout."}
      E4: {p: P4, sources: [humble-farley2010, larson2021-staffeng], why: "OPS-30 P4 ('Builds progressive-delivery machinery multiple teams release through ... retiring deploy patterns that cause repeat incidents and measurably raising deploy frequency.') is Staff-scope by its own text — machinery 'multiple teams release through' is the multi-team register."}
      E5: {p: P5, sources: [humble-farley2010, larson2021-staffeng], why: "OPS-30 P5 ('Owns release policy for an organization and its delivery metrics — rollout standards, freeze rules, environment strategy — dismantling ceremony that adds no safety.') is the org-authority bar: owning policy 'for an organization' and its metrics is Senior Staff's org-wide accountability."}
      E6: {p: P6, sources: [humble-farley2010, larson2021-staffeng], why: "OPS-30 P6 ('Sets how an entire company's software reaches customers ... and defends it to executives, auditors, and regulators.') is company/industry scope — defending the risk posture to executives and regulators is the P6 external-accountability register."}
    evidence:
      E1: "Runs their first production deploy behind a feature flag exactly as the release runbook specifies, watches the rollout dashboard until it's clean, and asks their buddy to confirm before closing out the checklist."
      E2: "Ships a pricing-page change behind a flag, notices the conversion-rate panel dip 20 minutes into a 10% rollout, and rolls it back themselves without waiting for anyone's sign-off — then writes the one-line rollback note in the channel."
      E3: "Writes the rollout plan for a payments-schema migration — canary percentage, the exact metric that triggers an automatic halt, and a kill switch that reverts to the old code path in under a minute — and is the reviewer three other engineers send their own risky rollout plans to before shipping."
      E4: "Builds the automated-canary-analysis service that now gates every deploy across four teams, replacing the ad hoc 'watch the dashboard for ten minutes' ritual that had caused two repeat incidents that quarter."
      E5: "Sets the org-wide rule that no service may deploy without an automated rollback path, retires the manual change-approval-board process that added a day of ceremony without catching a single bad deploy in a year, and reports both changes' effect on deploy frequency to leadership."
      E6: "Defends the company's canary-rollout policy to a regulator during an audit after a customer-facing incident, and is the one who signs off on the policy staying as-is rather than reverting to slower, more ceremonial releases."
