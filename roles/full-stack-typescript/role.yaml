    mappings:
      E1: {p: P1, sources: [slsa, sfia9], why: "SEC-09 P1 ('Verifies artifact provenance and signatures following documented checks, escalating anomalies for review.') is the guided bar — adding dependencies only through the team's vetting process and acting on automated vulnerability alerts is following documented checks."}
      E2: {p: P2, sources: [slsa, sfia9], why: "SEC-09 P2 ('Configures signing, dependency scanning, and provenance controls independently for standard pipelines.') matches evaluating a package before adopting it (maintenance health, license, transitive surface) independently."}
      E3: {p: P3, sources: [slsa, sfia9], why: "SEC-09 P3 ('Designs artifact-integrity and dependency-trust controls for complex, ambiguous supply chains.') is the capability-owning bar: owning the dependency posture of a capability (upgrade cadence, CVE triage by exploitability) is designing trust controls at domain scope."}
      E4: {p: P4, sources: [slsa, larson2021-staffeng], why: "SEC-09 P4 ('Defines the supply-chain security architecture and verification patterns others adopt.') is Staff-scope — building supply-chain tooling and policy multiple teams follow (allowlists, provenance checks)."}
      E5: {p: P5, sources: [slsa, larson2021-staffeng], why: "SEC-09 P5 ('Sets supply-chain assurance strategy and anticipates emerging artifact and dependency threats.') matches setting org supply-chain security posture (SBOM practice, artifact signing) with compliance and security functions."}
      E6: {p: P6, sources: [slsa, larson2021-staffeng], why: "SEC-09 P6 ('Defines authoritative supply-chain security practice that shapes industry expectations.') is company/industry scope — owning company software supply-chain strategy and representing it to customers and auditors."}
    evidence:
