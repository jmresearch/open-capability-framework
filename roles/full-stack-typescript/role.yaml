  - theme: "Type-driven domain modeling"
    capability: SWE-08
    key_area: "TypeScript & Software Design"
    key_attribute: "Type System as a Design Tool"
    anchor: wlaschin2018
    anchor_why: "making illegal states unrepresentable via types is the design discipline the type system exists to enforce; in a TypeScript-centered stack the type system is the cheapest place to delete whole defect classes before runtime."
    mappings:
      E1: {p: P1, sources: [wlaschin2018, sfia9], why: "SWE-08 P1 ('Writes correctly typed code without escape hatches (`any`-equivalents), uses the codebase's existing types and generics correctly, and reads compiler errors to the actual cause with guidance.') is the guided bar: the 'with guidance' clause is the Associate register — correct typed code within someone else's type design, escalated only when reading errors is not enough."}
      E2: {p: P2, sources: [wlaschin2018, sfia9], why: "SWE-08 P2 ('Models feature domains so invalid states fail to compile ... preferring type-level constraints where the compiler can carry the load.') is the independent-component bar: modeling one feature's domain with discriminated unions, unaided, is independent practice at component scope, not yet a capability's shared type architecture."}
      E3: {p: P3, sources: [wlaschin2018, sfia9], why: "SWE-08 P3 ('Designs the shared domain types a capability is built on ... judges when type-level sophistication pays and when it obscures, and unwinds accumulated type erosion in others' code.') is the capability-owning bar — shared domain types spanning a capability, plus cleaning up others' accumulated erosion, is domain-scope autonomous design, not one feature's models."}
      E4: {p: P4, sources: [wlaschin2018, larson2021-staffeng], why: "SWE-08 P4 ('Sets type-design conventions multiple teams adopt ... and leads migrations that raise strictness without halting delivery.') is Staff-scope by its own text: conventions 'multiple teams adopt' and migrations led across teams are the multi-team register, not one capability's types."}
      E5: {p: P5, sources: [wlaschin2018, larson2021-staffeng], why: "SWE-08 P5 ('Owns an organization's type-system posture ... measured by defect and velocity outcomes.') is the org-authority bar — 'an organization's' posture, measured in outcomes reported to leadership, is Senior Staff's org-wide accountability, not a shared-library owner's."}
      E6: {p: P6, sources: [wlaschin2018, larson2021-staffeng], why: "SWE-08 P6 ('Makes company-level language and type-platform bets and represents the practice externally.') is the company/industry bar — betting on the company's language platform and representing it externally is the P6 pioneer register, distinct from P5's internal org ownership."}
    evidence:
      E1: "Gets a compiler error on a discriminated-union narrowing case they haven't seen before, reads the message past the top line to find the actual mismatched member, and fixes the type rather than reaching for `as`."
      E2: "Turns a boolean-flag-soup form state (`isLoading`/`isError`/`hasData` that can all be true at once) into a discriminated union so the impossible combinations don't compile, without being told to."
      E3: "Reviews a teammate's PR that adds a fourth optional field to an already-sprawling props type, and instead proposes (and lands) the discriminated-union refactor that makes the three valid variants explicit and the invalid ones uncompilable."
      E4: "Publishes the branded-ID and Result-type conventions as the team's internal type-utilities package, with a codemod that migrated three existing services onto it without a delivery freeze."
      E5: "Sets the org's `strict`-mode and `noUncheckedIndexedAccess` baseline for all new repos, tracked against a quarterly defect-rate dashboard leadership reviews."
      E6: "Is the internal reviewer of record when the company adopts a new TypeScript major version, and publishes the migration's lessons as a conference talk that other companies cite."
  - theme: "Type safety at boundaries"
    capability: SWE-09
    key_area: "TypeScript & Software Design"
    key_attribute: "Type System as a Design Tool"
    anchor: king2019
    anchor_why: "validate untrusted data into precise types at the boundary once, then rely on the types; full stack TypeScript's distinctive promise — one type system spanning client, server, and wire — is only real if boundaries are actually validated."
    mappings:
      E1: {p: P1, sources: [king2019, sfia9], why: "SWE-09 P1 ('Uses the codebase's shared contract types and schema validators at boundaries rather than hand-casting external data, and can point to where a type is checked at runtime.') is the guided bar: using existing validators and being able to point to the runtime check is applying the codebase's own boundary discipline, not designing it."}
      E2: {p: P2, sources: [king2019, sfia9], why: "SWE-09 P2 ('Puts runtime validation at every I/O boundary they touch ... deriving static types from the runtime schemas so compile-time and runtime cannot drift.') is the independent-component bar: validating every boundary they personally touch, unaided, is component-scope practice."}
      E3: {p: P3, sources: [king2019, sfia9], why: "SWE-09 P3 ('Designs end-to-end type integrity for a capability ... and blocks unsound casts and unvalidated edges in review.') is the capability-owning bar — schema-first contracts and CI-caught drift 'for a capability' is domain-scope design, and blocking in review is the ownership signal E2 lacks."}
      E4: {p: P4, sources: [king2019, larson2021-staffeng], why: "SWE-09 P4 ('Builds the code-generation and contract-typing infrastructure multiple teams inherit ... and resolves cross-team type drift at its source.') is Staff-scope by its own text — infrastructure 'multiple teams inherit' is the multi-team register."}
      E5: {p: P5, sources: [king2019, larson2021-staffeng], why: "SWE-09 P5 ('Sets the organization's boundary-safety standard and the platform tooling that enforces it, with incident evidence showing the failure classes it removed.') is the org-authority bar: setting the standard for the organization, backed by incident data reported outward, is Senior Staff's accountability."}
      E6: {p: P6, sources: [king2019, larson2021-staffeng], why: "SWE-09 P6 ('Owns contract-integrity strategy across products and external interfaces where a broken contract is a business event, and advances the state of practice publicly.') is company/industry scope — external interfaces as business events, argued publicly, is the P6 pioneer register."}
    evidence:
      E1: "Wraps a third-party webhook payload with the team's existing Zod schema before touching its fields, and when asked why, points to the exact line where the shape is checked at runtime."
      E2: "Adds request validation to a new internal endpoint using the same schema that generates its TypeScript types, so a malformed body 400s before it ever reaches the handler's typed logic."
      E3: "Wires a capability's client and server to share one schema-derived contract type checked in CI, so that changing a field name on the server fails the client's typecheck in the same pull request instead of failing in production."
      E4: "Builds the internal codegen pipeline that turns each service's OpenAPI schema into a typed client automatically, adopted by four other teams who stopped hand-writing fetch wrappers."
      E5: "Ships an org-wide boundary-validation lint rule after tracing three consecutive quarters' worst production incidents back to unvalidated third-party responses, and reports the incident-rate drop to engineering leadership."
      E6: "Owns the contract-integrity review for the company's public partner API, where a silently-dropped field would break a paying customer's integration, and writes up the safeguards at an external engineering conference."
