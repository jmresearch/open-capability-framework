  - theme: "Observability & monitoring"
    capability: OPS-05
    key_area: "Delivery & Operations"
    key_attribute: "Production Operations"
    anchor: sre2016
    anchor_why: "golden signals and SLO-based, symptom-driven alerting, with Majors et al.'s high-cardinality tracing as the modern extension; you can only operate what you can see, across browser and server alike, and the instrumentation is written by the engineers who ship the code."
    mappings:
      E1: {p: P1, sources: [sre2016, majors2022-observability, sfia9], why: "OPS-05 P1 ('Understands logs/metrics/traces; reads existing dashboards.') is the guided bar — finding their change's logs and traces in the standard dashboards, and adding structured log lines per team conventions, is literally that text."}
      E2: {p: P2, sources: [sre2016, majors2022-observability, sfia9], why: "OPS-05 P2 ('Instruments their services; builds dashboards; tunes alerts to limit noise.') matches instrumenting their features across the stack before shipping and answering 'is it working?' from telemetry, independently."}
      E3: {p: P3, sources: [sre2016, majors2022-observability, sfia9], why: "OPS-05 P3 ('Designs observability for complex systems (end-to-end traces, quality signals, cost attribution).') is the capability-owning bar: defining SLIs/SLOs for a capability and building alerts on symptoms not causes is designing observability at domain scope."}
      E4: {p: P4, sources: [sre2016, majors2022-observability, larson2021-staffeng], why: "OPS-05 P4 ('Expert in instrumentation trade-offs at scale, incl. privacy-safe logging.') is Staff-scope — standardizing observability across teams (shared instrumentation libraries, trace propagation) with measured pager-load reductions."}
      E5: {p: P5, sources: [sre2016, majors2022-observability, larson2021-staffeng], why: "OPS-05 P5 ('Defines org observability strategy.') matches owning the org's observability strategy and SLO program, including its cost curve, legible to leadership."}
      E6: {p: P6, sources: [sre2016, majors2022-observability, larson2021-staffeng], why: "OPS-05 P6 ('Shapes company-wide operational visibility; advances practice.') is company/industry scope — setting company reliability-measurement standards and the external SLA commitments grounded in them."}
    evidence:
      E1: "Finds their change's logs, metrics, traces, and browser error reports in the standard dashboards, and adds structured log lines with useful context per team conventions."
      E2: "Instruments their features across the stack before shipping — structured logs, metrics, trace spans that cross the client/server boundary — and answers \"is it working?\" from telemetry, not vibes."
      E3: "Defines the SLIs/SLOs for a capability and builds alerts on symptoms, not causes — dashboards on-call actually uses — deleting noisy alerts as deliberately as adding signal, and rejects unobservable designs in review."
      E4: "Standardizes observability across teams — shared instrumentation libraries, trace propagation, log schema, alert-quality reviews — so cross-team incidents are traceable end to end, with measured pager-load reductions."
      E5: "Owns the org's observability strategy and SLO program, including its cost curve, making reliability legible to leadership."
      E6: "Sets company reliability-measurement standards and the external commitments (SLAs) grounded in them, answering for the telemetry bill and its value."
  - theme: "Incident response & postmortems"
    capability: OPS-06
    key_area: "Delivery & Operations"
    key_attribute: "Production Operations"
    anchor: sre2016
    anchor_why: "incident-management and blameless-postmortem practice, with Allspaw's Etsy formulation as the concrete method; incident behavior under pressure and honest learning afterward are where operational maturity is visible."
    mappings:
      E1: {p: P1, sources: [sre2016, allspaw2012, sfia9], why: "OPS-06 P1 ('Responds to alerts with support; follows runbooks; escalates appropriately.') is the guided bar — following the runbook, escalating early with a clear symptom report while shadowing on-call, is literally that text."}
      E2: {p: P2, sources: [sre2016, allspaw2012, sfia9], why: "OPS-06 P2 ('Triages and resolves routine incidents; clear notes; takes on-call.') matches taking on-call for their component and mitigating common failures unaided, writing postmortems that name contributing causes."}
      E3: {p: P3, sources: [sre2016, allspaw2012, sfia9], why: "OPS-06 P3 ('Leads response to complex failures; blameless postmortems; same failure never recurs.') is the capability-owning bar: running incident command for a capability's severe incidents and driving postmortem actions to completion is leading complex-failure response at domain scope."}
      E4: {p: P4, sources: [sre2016, allspaw2012, larson2021-staffeng], why: "OPS-06 P4 ('Expert in incident-management design (rotations, severity, escalation).') is Staff-scope — commanding incidents that cross team boundaries and upgrading the practice itself (severity taxonomy, on-call health)."}
      E5: {p: P5, sources: [sre2016, allspaw2012, larson2021-staffeng], why: "OPS-06 P5 ('Commands the highest-severity incidents; sets incident process org-wide.') matches owning the org's incident program and learning loop, reviewing severity trends with leadership."}
      E6: {p: P6, sources: [sre2016, allspaw2012, larson2021-staffeng], why: "OPS-06 P6 ('Sets the company's incident philosophy; calm authority in the worst moments.') is company/industry scope — being accountable for company-level major-incident handling, including executive and customer communication."}
    evidence:
      E1: "Follows the runbook during incidents, escalates early with a clear symptom report, and narrates what they see in the incident channel rather than debugging silently; contributes accurate timelines to postmortems while shadowing on-call."
      E2: "Takes on-call for their component and mitigates common failures unaided, prioritizing user impact over root cause in the moment, communicating status on the expected cadence, and writing postmortems that name contributing causes, not culprits."
      E3: "Runs incident command for a capability's severe incidents — coordinates responders, makes the mitigate-vs-diagnose call under pressure, communicates to stakeholders in their language — and drives postmortem actions to actual completion, not just filed."
      E4: "Commands incidents that cross team boundaries and fixes the systemic reliability problems recurring across teams' postmortems, coaching new incident commanders and upgrading the practice itself (severity taxonomy, review quality, on-call health)."
      E5: "Owns the org's incident program and learning loop — readiness, postmortem culture, error-budget policy — reviewing severity trends with leadership and directing reliability investment."
      E6: "Is accountable for company-level major-incident handling, including executive and customer communication and the credibility of the postmortem process after the worst days."
  - theme: "Secure coding & vulnerability prevention"
    capability: OPS-08
    key_area: "Security"
    key_attribute: "Application Security"
    anchor: owasp-top10
    anchor_why: "the consensus taxonomy of web application risk and its concrete countermeasures; a full stack engineer owns the two most attacked surfaces — the browser and the API — and every layer between."
    mappings:
      E1: {p: P1, sources: [owasp-top10, sfia9], why: "OPS-08 P1 ('Understands core appsec; follows practices and flags concerns.') is the guided bar — using the framework's safe defaults and naming the OWASP Top 10 risks their change touches is following practices and flagging concerns."}
      E2: {p: P2, sources: [owasp-top10, sfia9], why: "OPS-08 P2 ('Applies least privilege; validates/sanitizes inputs; knows common attacks.') matches preventing common vulnerability classes by construction (XSS, injection, CSRF), independently."}
      E3: {p: P3, sources: [owasp-top10, sfia9], why: "OPS-08 P3 ('Designs defense in depth; thinks in abuse cases; owns a domain's posture.') is the capability-owning bar: catching vulnerabilities scanners miss and owning a capability's browser-side posture is 'owns a domain's posture' verbatim."}
      E4: {p: P4, sources: [owasp-top10, larson2021-staffeng], why: "OPS-08 P4 ('Expert in securing systems at scale; leads red-teaming and remediation.') is Staff-scope — building secure-by-default platform pieces multiple teams inherit and driving remediation campaigns across codebases."}
      E5: {p: P5, sources: [owasp-top10, larson2021-staffeng], why: "OPS-08 P5 ('Defines security strategy for the org's surface area.') matches setting the org's secure-development standard with the security function, reporting risk posture to leadership."}
      E6: {p: P6, sources: [owasp-top10, larson2021-staffeng], why: "OPS-08 P6 ('Company-level accountability; authority on the field.') is company/industry scope — owning company product-security strategy, accountable in audits and board-level risk conversations."}
    evidence:
      E1: "Uses the framework's safe defaults and never bypasses them — parameterized queries, escaping-by-default templates, no unreviewed `dangerouslySetInnerHTML`, no secrets in code, logs, or client bundles — and names the OWASP Top 10 risks their change touches."
      E2: "Prevents the common vulnerability classes by construction — XSS, injection, CSRF, SSRF — validating input at trust boundaries with schemas, handling tokens and cookies correctly (HttpOnly/SameSite), and fixing scanner findings without being chased."
      E3: "Catches vulnerabilities in review that scanners miss — authz gaps, unsafe deserialization, SSRF paths, XSS-shaped patterns — turning each finding into a guardrail (lint rule, safe wrapper, doc), and owns the capability's browser-side posture (CSP, third-party script trust, session architecture)."
      E4: "Builds secure-by-default platform pieces multiple teams inherit (auth libraries, CSP baselines, input-validation layers, paved-path middleware) and drives remediation campaigns across codebases when pentests find systemic issues."
      E5: "Sets the org's secure-development standard with the security function — standards, training, tooling, review gates — reporting measurable risk posture to leadership."
      E6: "Owns company product-security strategy from the engineering side, accountable in audits, incidents, and board-level risk conversations."
  - theme: "Authentication, authorization & data protection"
    capability: BE-15
    key_area: "Security"
    key_attribute: "Application Security"
    anchor: owasp-asvs
    anchor_why: "verifiable requirements for session, identity, and access control, paired with NIST's digital-identity guidelines; broken access control is OWASP's #1 category, designed in rather than patched in, and the authorization logic is written by product engineers."
    mappings:
      E1: {p: P1, sources: [owasp-asvs, nist80063, sfia9], why: "BE-15 P1 ('Applies existing auth mechanisms to simple endpoints under review.') is the guided bar — using the existing auth middleware correctly and never rolling their own crypto is applying existing mechanisms, under review."}
      E2: {p: P2, sources: [owasp-asvs, nist80063, sfia9], why: "BE-15 P2 ('Implements standard authentication and authorization flows independently.') matches implementing authorization server-side on every path the UI hides, testing negative cases, independently."}
      E3: {p: P3, sources: [owasp-asvs, nist80063, sfia9], why: "BE-15 P3 ('Designs auth models autonomously; resolves complex identity, token, and permission cases.') is the capability-owning bar: designing the access-control model for a capability (roles, tenant isolation, audit trails) is autonomous complex-permission design."}
      E4: {p: P4, sources: [owasp-asvs, nist80063, larson2021-staffeng], why: "BE-15 P4 ('Defines auth approaches teams adopt; solves the hardest access-control and trust problems.') is Staff-scope — owning shared identity infrastructure multiple teams build on and leading migrations off legacy schemes."}
      E5: {p: P5, sources: [owasp-asvs, nist80063, larson2021-staffeng], why: "BE-15 P5 ('Sets authentication and authorization strategy across systems; anticipates evolving threats.') matches setting the org's identity, access, and data-protection architecture."}
      E6: {p: P6, sources: [owasp-asvs, nist80063, larson2021-staffeng], why: "BE-15 P6 ('Defines authoritative practice for auth; shapes industry standards and security understanding.') is company/industry scope — making company-level trust-architecture bets and standing behind them with regulators and enterprise customers."}
    evidence:
      E1: "Uses the existing auth middleware and permission checks correctly, never rolling their own crypto or token handling, and checks authorization on the server, never only in the UI."
      E2: "Implements authorization server-side on every path the UI hides — object-level, not just route-level — tests the negative cases (wrong user, expired session, escalation attempts), and handles tokens, sessions, secrets, and PII per policy without reminders."
      E3: "Designs the access-control model for a capability — roles, resource ownership, tenant isolation, audit trails — documents it, and probes designs for privilege-escalation and data-exposure paths before build; others bring their authorization edge cases to this person."
      E4: "Owns shared identity and authorization infrastructure multiple teams build on (session services, permission frameworks, SSO integration) and leads migrations off legacy schemes without lockouts."
      E5: "Sets the org's identity, access, and data-protection architecture, treating compliance regimes as engineering requirements and verifying enforcement holds in practice."
      E6: "Makes company-level trust-architecture bets (identity platform, encryption posture, data-residency design) and stands behind them with regulators and enterprise customers."
