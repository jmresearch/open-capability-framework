      E2: {p: P2, sources: [shostack2014, sfia9], why: "SEC-05 P2 ('Produces complete threat models for standard systems independently, identifying realistic threats and mitigations.') matches raising abuse cases in design discussions unprompted for features they own, independently."}
      E3: {p: P3, sources: [shostack2014, sfia9], why: "SEC-05 P3 ('Models complex, ambiguous architectures and prioritizes subtle, chained threats others miss.') is the capability-owning bar: running lightweight threat models for a capability's significant designs and recording accepted risks is modeling at domain scope."}
      E4: {p: P4, sources: [shostack2014, larson2021-staffeng], why: "SEC-05 P4 ('Defines the threat-modeling methodology and reusable patterns others adopt across teams.') is Staff-scope — facilitating threat modeling across teams and training engineers to run their own."}
      E5: {p: P5, sources: [shostack2014, larson2021-staffeng], why: "SEC-05 P5 ('Sets threat-modeling strategy and anticipates classes of threats before they become prevalent.') matches owning the org's security-review program and risk register."}
      E6: {p: P6, sources: [shostack2014, larson2021-staffeng], why: "SEC-05 P6 ('Defines authoritative threat-modeling practice that shapes how the discipline reasons about risk.') is company/industry scope — shaping company security posture with threat-informed strategy presented at the executive level."}
    evidence:
