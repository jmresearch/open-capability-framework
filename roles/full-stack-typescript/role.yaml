      E3: "Designs the resilience posture for a capability — circuit breakers, bulkheads, dependency criticality tiers, load-testing before launches and sizing for projected growth — and rejects designs in review that fail closed on non-critical dependencies."
      E4: "Hardens the seams between teams' systems — shared dependencies, cascading-failure paths — running failure-injection and game-day exercises and fixing the systemic weak points they expose."
