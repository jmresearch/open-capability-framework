      E4: {p: P4, sources: [nygard2018, larson2021-staffeng], why: "BE-18 P4 ('Defines fault-tolerance approaches teams adopt; solves the hardest isolation and recovery problems.') is Staff-scope — hardening the seams between teams' systems via failure-injection and game-day exercises."}
      E5: {p: P5, sources: [nygard2018, larson2021-staffeng], why: "BE-18 P5 ('Sets resilience strategy across systems; anticipates emerging failure modes and risks.') matches setting org resilience standards and capacity strategy, including vendor tiers and DR posture."}
