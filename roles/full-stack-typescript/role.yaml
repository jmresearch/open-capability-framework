      E2: "Explains their technical work to non-engineers in outcome terms and warns stakeholders of slips as soon as they know, with a revised plan attached."
      E3: "Translates a capability's technical state for any audience — risk for product, cost for finance-minded leaders, options for executives — and runs the meetings where those audiences decide."
      E4: "Keeps multiple teams' stakeholders aligned through change — reorganizations, migrations, slipped bets — with communication others cite as the reason it went smoothly."
      E5: "Represents engineering reality to org leadership in planning and crisis alike, and is trusted to do so unfiltered."
      E6: "Represents the company's technology externally — customers, partners, boards — without overclaiming."
  - theme: "Technical discussion & decision-making"
    capability: CC-05
    key_area: "Collaboration & Communication"
    key_attribute: "Communication"
    anchor: nygard2011-adr
    anchor_why: "decisions argued openly, recorded with context, and then committed to; teams stall on relitigated or invisible decisions, and how disagreement is handled is an observable skill."
    mappings:
      E1: {p: P1, sources: [nygard2011-adr, sfia9], why: "CC-05 P1 ('Voices disagreement respectfully; disagrees-and-commits.') is the guided bar — asking clarifying questions in design discussions and stating their own view with reasoning when asked is respectful voicing."}
      E2: {p: P2, sources: [nygard2011-adr, sfia9], why: "CC-05 P2 ('Works through disagreement to a decision without damaging relationships.') matches arguing positions from evidence and dropping them gracefully when out-argued, committing visibly."}
      E3: {p: P3, sources: [nygard2011-adr, sfia9], why: "CC-05 P3 ('Mediates technical disputes in their domain; finds the path that holds up.') is the capability-owning bar: facilitating decisions rather than winning them, surfacing quiet dissent and recording the rationale, is mediating disputes at domain scope."}
      E4: {p: P4, sources: [nygard2011-adr, larson2021-staffeng], why: "CC-05 P4 ('Resolves high-stakes disagreements between senior stakeholders across orgs.') is Staff-scope — brokering technical decisions between teams with conflicting interests, getting explicit commitment from each."}
      E5: {p: P5, sources: [nygard2011-adr, larson2021-staffeng], why: "CC-05 P5 ('Designs the decision processes the org uses to resolve conflict.') matches designing the org's technical decision-making mechanisms (review boards, RFC processes)."}
      E6: {p: P6, sources: [nygard2011-adr, larson2021-staffeng], why: "CC-05 P6 ('Sets the company norm for principled disagreement.') is company/industry scope — carrying the company's hardest technical calls to conclusion, aligning executives and engineering when they disagree."}
    evidence:
      E1: "Asks questions in design discussions that clarify rather than derail, and states their own view with its reasoning when asked."
      E2: "Argues positions from evidence and drops them gracefully when out-argued, committing visibly to decisions they disagreed with."
      E3: "Facilitates decisions rather than winning them — surfacing the quiet dissent, timeboxing the debate, recording the outcome and its rationale where the next person will find it."
      E4: "Brokers technical decisions between teams with conflicting interests, finding the option that unblocks both and getting explicit commitment from each."
      E5: "Designs the org's technical decision-making mechanisms (review boards, RFC processes) so decisions are fast, owned, and durable."
      E6: "Carries the company's hardest technical calls to conclusion, aligning executives and engineering when they disagree."
  - theme: "Feedback & candor"
    capability: CC-04
    key_area: "Collaboration & Communication"
    key_attribute: "Teamwork"
    anchor: scott2017-radicalcandor
    anchor_why: "direct, caring feedback in a psychologically safe climate is what makes teams learn; teams that cannot exchange honest feedback ship the disagreement into the codebase instead."
    mappings:
      E1: {p: P1, sources: [scott2017-radicalcandor, edmondson2018-fearless-org, sfia9], why: "CC-04 P1 ('Accepts feedback non-defensively; acts on it.') is the guided bar — thanking reviewers for hard comments and asking clarifying questions instead of relitigating is literally that text."}
      E2: {p: P2, sources: [scott2017-radicalcandor, edmondson2018-fearless-org, sfia9], why: "CC-04 P2 ('Gives timely, specific, kind feedback to peers.') matches giving peers direct, specific feedback in review, retros, and one-on-ones, then following up on whether it landed."}
      E3: {p: P3, sources: [scott2017-radicalcandor, edmondson2018-fearless-org, sfia9], why: "CC-04 P3 ('Gives growth-oriented feedback that changes behavior; coaches through feedback.') is the capability-owning bar: naming the uncomfortable thing in the room (a slipping standard, a struggling teammate) and modeling receiving hard feedback publicly is coaching at team scope."}
      E4: {p: P4, sources: [scott2017-radicalcandor, edmondson2018-fearless-org, larson2021-staffeng], why: "CC-04 P4 ('Builds feedback norms that raise the bar across teams.') is Staff-scope — giving feedback across team and level boundaries, including upward, repairing cross-team frictions."}
      E5: {p: P5, sources: [scott2017-radicalcandor, edmondson2018-fearless-org, larson2021-staffeng], why: "CC-04 P5 ('Sets the org's culture of candor and growth.') matches building feedback culture deliberately across the org, coaching senior engineers on candor, challenging org-level decisions on the record."}
      E6: {p: P6, sources: [scott2017-radicalcandor, edmondson2018-fearless-org, larson2021-staffeng], why: "CC-04 P6 ('Models and defines feedback culture company-wide.') is company/industry scope — telling company leadership the truths no one else will, with the standing to change the outcome."}
    evidence:
      E1: "Receives feedback without defensiveness and acts on it visibly; thanks reviewers for hard comments, asks clarifying questions instead of relitigating, and says so when something seems wrong rather than staying silent."
      E2: "Gives peers direct, kind, specific feedback near the moment — in review, retros, and one-on-ones — following up on whether it landed, and raises team-process problems with a proposed fix."
      E3: "Names the uncomfortable thing in the room — a slipping standard, a struggling teammate, a design being talked around — early and in a way people can hear, and models receiving hard feedback publicly."
      E4: "Gives feedback across team and level boundaries, including upward to leaders whose decisions are not working and to senior engineers nobody else will, repairing cross-team frictions before they become escalations."
      E5: "Builds feedback culture deliberately across the org — coaching senior engineers on candor, intervening where silence has become the norm, and challenging org-level decisions on the record so others can too."
      E6: "Tells company leadership the truths no one else will, with the evidence, standing, and framing to change the outcome."
  - theme: "Cross-functional collaboration"
    capability: CC-03
    key_area: "Collaboration & Communication"
    key_attribute: "Teamwork"
    anchor: cagan2017-inspired
    anchor_why: "empowered product teams pair engineers with product and design from discovery, not just delivery, with Skelton & Pais's interaction modes for the org layer; full stack work sits at the junction of product, design, and platform, and the interfaces between people fail more often than the interfaces between services."
    mappings:
      E1: {p: P1, sources: [cagan2017-inspired, skelton-pais2019, sfia9], why: "CC-03 P1 ('Responsive to feedback; pairs willingly; asks for help appropriately.') is the guided bar — asking clarifying questions about acceptance criteria before building and raising blockers the day they appear is asking for help appropriately."}
      E2: {p: P2, sources: [cagan2017-inspired, skelton-pais2019, sfia9], why: "CC-03 P2 ('Collaborates smoothly with adjacent functions; handles disagreement constructively.') matches engaging design and product early from problem statements, flagging constraints while alternatives are still cheap."}
      E3: {p: P3, sources: [cagan2017-inspired, skelton-pais2019, sfia9], why: "CC-03 P3 ('Builds strong cross-team relationships; resolves friction directly.') is the capability-owning bar: operating as the engineering counterpart to product/design for a capability, negotiating scope with data, is a strong cross-functional relationship at domain scope."}
      E4: {p: P4, sources: [cagan2017-inspired, skelton-pais2019, larson2021-staffeng], why: "CC-03 P4 ('Expert at aligning teams with competing priorities; mediates disputes between senior people.') is Staff-scope — untangling cross-team dependency knots, keeping decisions made in one room honored in others."}
      E5: {p: P5, sources: [cagan2017-inspired, skelton-pais2019, larson2021-staffeng], why: "CC-03 P5 ('Creates the forums and processes through which collaboration happens.') matches designing the org's team boundaries and interaction patterns with leadership, applying cognitive-load reasoning."}
      E6: {p: P6, sources: [cagan2017-inspired, skelton-pais2019, larson2021-staffeng], why: "CC-03 P6 ('Builds coalitions at company scale and externally.') is company/industry scope — aligning engineering with company strategy across functions, trusted as a co-owner of outcomes."}
    evidence:
      E1: "Asks clarifying questions about acceptance criteria before building, flags when a mock is ambiguous or technically awkward rather than guessing, and raises blockers the day they appear."
      E2: "Engages design and product early, working from problem statements rather than just tickets — flags technical constraints while alternatives are still cheap and translates engineering trade-offs into terms partners can decide on."
      E3: "Operates as the engineering counterpart to product and design for a capability — negotiates scope with data, shapes the roadmap with technical possibility rather than feasibility vetoes, and disagrees-and-commits visibly."
      E4: "Untangles cross-team dependency knots, clarifying interaction modes and ownership so teams stop blocking each other, keeping decisions made in one room honored in the others."
      E5: "Designs the org's team boundaries and interaction patterns with leadership, applying cognitive-load reasoning to reorganizations and partnering with product leadership on the roadmap."
      E6: "Aligns engineering with company strategy across functions, trusted by product, design, and executive peers as a co-owner of outcomes."
  - theme: "Mentoring & growing engineers"
    capability: LI-01
    key_area: "Leadership & Business Impact"
    key_attribute: "Growing People & Direction"
    anchor: larson2021-staffeng
    anchor_why: "sponsorship and deliberate mentorship as the core leverage mechanisms of senior ICs, alongside Fournier's tech-lead mentoring chapters; past E2, an engineer's ceiling is set by how many others they make better."
    mappings:
      E1: {p: P1, sources: [larson2021-staffeng, fournier2017, sfia9], why: "LI-01 P1 ('Receptive to mentoring; shares what they learn.') is the guided bar — asking questions in public channels so answers help others and improving onboarding docs as they onboard is sharing what they've just learned."}
      E2: {p: P2, sources: [larson2021-staffeng, fournier2017, sfia9], why: "LI-01 P2 ('Helps onboard teammates; informally mentors juniors.') matches onboarding new teammates and unblocking juniors day to day, without doing the work for them."}
      E3: {p: P3, sources: [larson2021-staffeng, fournier2017, sfia9], why: "LI-01 P3 ('Coaches engineers with growth-oriented feedback; measurably improves a team's skill.') is the capability-owning bar: mentoring engineers deliberately toward independence with mentees whose progression is visible is measurable team-skill improvement."}
      E4: {p: P4, sources: [larson2021-staffeng, fournier2017], why: "LI-01 P4 ('Develops future leads across teams; shapes hiring and onboarding.') is Staff-scope — growing senior engineers into capability owners across multiple teams, creating structures where mentoring happens without them."}
      E5: {p: P5, sources: [larson2021-staffeng, fournier2017], why: "LI-01 P5 ('Develops senior engineers and leaders; builds culture deliberately.') matches building the org's talent-growth machinery (mentoring programs, hiring bar) and sponsoring the next staff engineers."}
      E6: {p: P6, sources: [larson2021-staffeng, fournier2017], why: "LI-01 P6 ('Develops the next generation of top talent; legacy outlasts tenure.') is company/industry scope — developing the company's senior technical bench and being the mentor its top engineers seek out."}
    evidence:
      E1: "Asks questions in public channels so the answers help others, improves the onboarding docs as they onboard, and helps the next new person with what they just learned."
      E2: "Onboards new teammates and unblocks juniors day to day — pairing generously, explaining the why behind conventions rather than just the rules — without doing the work for them."
      E3: "Mentors engineers deliberately toward independence — stretch tasks with a safety net, growth-oriented review comments, career conversations, questions rather than answers — with mentees whose progression is visible to others."
      E4: "Grows senior engineers into capability owners — sponsoring them into visible problems, coaching their design judgment through rather than taking over — and creates the structures (guilds, review rotations, design shadowing) where mentoring happens without them."
      E5: "Builds the org's talent-growth machinery — mentoring programs, promotion-calibration input, technical curricula, the hiring bar — and grows the next staff engineers, sponsoring rather than just advising."
      E6: "Develops the company's senior technical bench — shaping who its next principals are and what excellence means here — and is the mentor its top engineers seek out."
  - theme: "Technical direction & influence"
    capability: LI-03
    key_area: "Leadership & Business Impact"
    key_attribute: "Growing People & Direction"
    anchor: larson2021-staffeng
    anchor_why: "staff-plus engineers operate through direction-setting, alignment, and organizational influence without authority; the E3-to-E4 jump is precisely the shift from owning work to multiplying others, and this competency is most of that difference."
    mappings:
      E1: {p: P1, sources: [larson2021-staffeng, sfia9], why: "LI-03 P1 ('Contributes informed opinions in technical discussions.') is the guided bar — driving their own tasks to done, chasing reviews and resolving ambiguity by asking, is self-leadership, not yet influencing others' work."}
      E2: {p: P2, sources: [larson2021-staffeng, sfia9], why: "LI-03 P2 ('Influences component-level decisions through credibility.') matches leading small efforts they're part of and driving small technical decisions to conclusion, at component scope."}
      E3: {p: P3, sources: [larson2021-staffeng, sfia9], why: "LI-03 P3 ('Sets technical direction for a domain; others align to their calls.') is this ladder's terminal-level bar by its own text: setting direction for a domain/capability that others follow voluntarily is 'others align to their calls' verbatim."}
      E4: {p: P4, sources: [larson2021-staffeng], why: "LI-03 P4 ('Shapes how multiple teams approach problems; trusted tiebreaker.') is Staff-scope by its own text — aligning multiple teams on a direction none of them owns alone is exactly 'shapes how multiple teams approach problems.'"}
      E5: {p: P5, sources: [larson2021-staffeng], why: "LI-03 P5 ('Influences org-wide technical strategy.') matches setting technical direction an organization executes against, choosing what not to do as visibly as what to do."}
      E6: {p: P6, sources: [larson2021-staffeng], why: "LI-03 P6 ('Influences company strategic direction through insight.') is company/industry scope — setting company technical direction with the executive team, carried credibly to boards and the industry."}
    evidence:
      E1: "Drives their own tasks to done — chases reviews, resolves ambiguity by asking, raises risks early, and proposes next steps rather than waiting for assignment."
      E2: "Leads small efforts they're part of and drives small technical decisions to conclusion — proposes, gathers input, decides or escalates — rather than letting them drift."
      E3: "Sets technical direction for a capability others follow voluntarily — a vision people can repeat, work broken down and sequenced risk-first, the team unblocked, contested decisions landed by argument rather than seniority. This is the terminal-level bar: sustained excellence here is a complete career."
      E4: "Aligns multiple teams on a technical direction none of them owns alone — builds the coalition, does the 1:1 persuasion and the written case, absorbs the disagreement, and stays accountable through delivery."
      E5: "Sets technical direction an organization executes against — picks the few bets that matter, kills zombie projects, chooses what not to do as visibly as what to do — and gets it resourced."
      E6: "Sets company technical direction with the executive team — the bets, the narrative, and the accountability for them — carried credibly to boards, customers, and the industry."
  - theme: "Product thinking"
    capability: PD-06
    key_area: "Leadership & Business Impact"
    key_attribute: "Product & Business Impact"
    anchor: cagan2017-inspired
    anchor_why: "engineers closest to the technology are a primary source of product insight when they engage with users and value, not just tickets; full stack engineers sit closest to the whole user experience of anyone in engineering."
    mappings:
      E1: {p: P1, sources: [cagan2017-inspired, sfia9], why: "PD-06 P1 ('Understands the capability they're building and who uses it.') is the guided bar — explaining who uses the feature and why it matters in their own words, trying their own change as a user, is literally that text."}
      E2: {p: P2, sources: [cagan2017-inspired, sfia9], why: "PD-06 P2 ('Frames own work in user/business outcomes, not just tasks.') matches using product analytics on features they ship and checking whether the thing worked, not just whether it deployed."}
      E3: {p: P3, sources: [cagan2017-inspired, sfia9], why: "PD-06 P3 ('Treats their area as a product; uses metrics to decide what to build for a domain.') is the capability-owning bar: contributing to discovery (prototyping to de-risk, bringing usage data to planning) is using metrics to decide what to build for a domain verbatim."}
      E4: {p: P4, sources: [cagan2017-inspired, larson2021-staffeng], why: "PD-06 P4 ('Expert at aligning technical bets with product strategy across teams.') is Staff-scope — spotting product opportunities that only cross-team technical vantage reveals, redirecting initiatives early."}
      E5: {p: P5, sources: [cagan2017-inspired, larson2021-staffeng], why: "PD-06 P5 ('Sets product direction for an org's technical surface.') matches influencing org product strategy with technical possibility, as a peer to product leadership."}
      E6: {p: P6, sources: [cagan2017-inspired, larson2021-staffeng], why: "PD-06 P6 ('Shapes how the company creates value through technical products.') is company/industry scope — shaping company product direction through technology bets, spotting platform shifts that change the business."}
    evidence:
      E1: "Explains who uses the feature they're building and why it matters in their own words, tries their own change as a user before calling it done, and flags when a spec seems to contradict the user's goal."
      E2: "Uses product analytics and user feedback on features they ship — checks whether the thing worked, not just whether it deployed — and proposes simpler versions that deliver the same outcome."
      E3: "Contributes to discovery, not just delivery — prototypes to de-risk, brings usage data and user pain to planning, challenges requirements with evidence, and kills their own pet solutions when the data says so."
      E4: "Spots the product opportunities and risks that only cross-team technical vantage reveals, killing or redirecting initiatives early with evidence rather than late with delivery pain."
      E5: "Influences org product strategy with technical possibility — opening options product didn't know were cheap and closing ones that look cheap but aren't — as a peer to product leadership."
      E6: "Shapes company product direction through technology bets, spotting the platform shifts that change the business."
  - theme: "Scoping, prioritization & estimation"
    capability: PD-02
    key_area: "Leadership & Business Impact"
    key_attribute: "Product & Business Impact"
    anchor: mcconnell2006-estimation
    anchor_why: "decomposition-based estimates as probabilistic forecasts, paired with Reinertsen's cost-of-delay economics for sequencing; trustworthy delivery is the currency senior ICs spend on everything else."
    mappings:
      E1: {p: P1, sources: [mcconnell2006-estimation, reinertsen2009-flow, sfia9], why: "PD-02 P1 ('Works highest-priority-first when told the priorities.') is the guided bar — breaking tasks into day-sized pieces and working the agreed priority order rather than the interesting order is following told priorities."}
      E2: {p: P2, sources: [mcconnell2006-estimation, reinertsen2009-flow, sfia9], why: "PD-02 P2 ('Makes sound priority calls within scope; time-boxes uncertain work.') matches slicing features into thin vertical increments with stated assumptions, distinguishing must-have from nice-to-have, within their own scope."}
      E3: {p: P3, sources: [mcconnell2006-estimation, reinertsen2009-flow, sfia9], why: "PD-02 P3 ('Balances cost/value/risk across a domain; resists hype; decisions hold up over months.') is the capability-owning bar: sequencing a capability's work by impact, risk, and cost of delay, trusted without escalation, is balancing cost/value/risk across a domain verbatim."}
      E4: {p: P4, sources: [mcconnell2006-estimation, reinertsen2009-flow, larson2021-staffeng], why: "PD-02 P4 ('Expert at portfolio-level trade-offs; surfaces hidden assumptions; trusted tiebreaker.') is Staff-scope — de-risking and rebalancing multi-team programs, finding the critical path across teams."}
      E5: {p: P5, sources: [mcconnell2006-estimation, reinertsen2009-flow, larson2021-staffeng], why: "PD-02 P5 ('Sets decision frameworks for the org.') matches shaping org-level investment allocation (product vs. platform vs. paydown) with the economic case written down."}
      E6: {p: P6, sources: [mcconnell2006-estimation, reinertsen2009-flow, larson2021-staffeng], why: "PD-02 P6 ('Influences company strategic direction through judgment.') is company/industry scope — answering for the company's biggest technical commitments to the board, re-planning publicly when reality changes."}
    evidence:
      E1: "Breaks their tasks into day-sized pieces, flags slips the day they're known, and finishes what they start — working the agreed priority order rather than the interesting order."
      E2: "Slices features into thin vertical increments that ship value early — decomposing across frontend, backend, and migration work — estimates with stated assumptions, distinguishes must-have from nice-to-have, and says no to scope creep with a reason."
      E3: "Sequences a capability's work by expected impact, risk, and cost of delay — hardest unknowns first, states what they're deliberately not doing — and is trusted to trade quality, scope, and time inside the capability without escalation; their estimates are the ones planning trusts."
      E4: "De-risks and rebalances multi-team programs — finds the critical path across teams, keeps every team's slice independently shippable, and cancels or shrinks initiatives with sunk costs when the math says to."
      E5: "Shapes org-level investment allocation — product vs. platform vs. paydown, honest capacity math, the mechanisms that keep commitments credible — with the economic case written down."
      E6: "Answers for the company's biggest technical commitments — to the board, to customers — re-planning publicly when reality changes; their read on feasibility is treated as load-bearing."
  - theme: "Strategic & commercial awareness"
    capability: PD-07
    key_area: "Leadership & Business Impact"
    key_attribute: "Product & Business Impact"
    anchor: rumelt2011-good-strategy
    anchor_why: "good strategy is diagnosis, guiding policy, and coherent action; engineering choices are strategy in code with a cost model attached, and the habit of connecting work to outcomes starts at E1."
    mappings:
      E1: {p: P1, sources: [rumelt2011-good-strategy, sfia9], why: "PD-07 P1 ('States what business outcome their current task serves — and asks when they can't — treating infrastructure and license costs as real money.') is the guided bar by its own text: stating and asking is the Associate register, not yet checking whether it worked."}
      E2: {p: P2, sources: [rumelt2011-good-strategy, sfia9], why: "PD-07 P2 ('Checks whether shipped work actually moved its metric and says so plainly when it didn't; weighs cost and maintenance burden in the technical choices they own.') is the independent-component bar: checking their own shipped work's metric, unaided, is component-scope accountability, one step past merely stating intent."}
      E3: {p: P3, sources: [rumelt2011-good-strategy, sfia9], why: "PD-07 P3 ('Frames a domain's technical decisions in business terms — cost of delay, revenue risk, support load — pushes back on work with weak business rationale, and redirects effort when the numbers say the plan is wrong.') is the capability-owning bar by its own text: framing 'a domain's' decisions and redirecting effort is domain-scope authority a component owner doesn't have."}
      E4: {p: P4, sources: [rumelt2011-good-strategy, larson2021-staffeng], why: "PD-07 P4 ('Builds the business case for the cross-team technical investments with the largest return and is trusted by leadership to have done the math.') is Staff-scope by its own text — cross-team investment cases trusted by leadership are the multi-team register."}
      E5: {p: P5, sources: [rumelt2011-good-strategy, larson2021-staffeng], why: "PD-07 P5 ('Aligns an organization's technical strategy with its economics — cost curves, velocity, risk — owning trade-offs measured in staff-years and reporting them in the business's own terms.') is the org-authority bar: aligning 'an organization's' strategy, reported in staff-years, is Senior Staff's org-wide economic accountability."}
      E6: {p: P6, sources: [rumelt2011-good-strategy, larson2021-staffeng], why: "PD-07 P6 ('Advises company leadership on where technology changes the business model and is accountable for company-level technology bets paying off.') is company/industry scope — advising leadership on business-model-level bets is the P6 executive-peer register."}
    evidence:
      E1: "Can say, when their tech lead asks, that the ticket they're working means fewer support escalations for a specific customer complaint — and asks what the actual dollar impact is when they genuinely don't know."
      E2: "Checks the analytics dashboard two weeks after their checkout-flow change ships, finds conversion unchanged, and says so in the team retro instead of letting the ticket quietly close as 'done'."
      E3: "Tells the roadmap owner that a requested real-time-sync feature isn't worth the infra spend for the traffic it would see, backs it with the hosting-cost delta and the support-ticket volume it would actually resolve, and gets the plan changed to a cheaper polling approach."
      E4: "Builds the cost-benefit case for consolidating three teams' duplicate notification services into one shared platform, with the infra-savings and engineering-hours numbers a director signs off on without re-deriving them."
      E5: "Reports the org's infrastructure cost curve against velocity to leadership every quarter, and uses it to kill a popular but uneconomical microservices-per-team pattern that was inflating both cloud spend and cross-team coordination cost."
      E6: "Tells the executive team which of three competing platform bets actually changes the unit economics of the core product, and is the person whose read on that question the CEO uses to decide."
