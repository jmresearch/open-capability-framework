      E2: "Improves the tooling friction they personally hit — a slow build, a missing lint rule, a stale README, a tsconfig fix — and upstreams the fix instead of working around it, upgrading dependencies safely with changelogs read before major bumps."
      E3: "Owns the developer experience of a capability's codebase — TS project references, bundler config, CI caching, lint/format automation, upgrade cadence — measuring dev-loop time before and after changes; new engineers ship in days because of it."
      E4: "Designs the monorepo and shared-tooling layer multiple teams work inside, landing the risky upgrades (TypeScript majors, bundler swaps) with codemods and migration docs, and measures adoption rather than assuming it."
