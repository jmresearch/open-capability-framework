      E3: {p: P3, sources: [winters2020, sfia9], why: "OPS-27 P3 ('Designs self-service workflows for ambiguous needs, reducing friction and resolving hard abstraction and adoption issues.') is the capability-owning bar: owning the developer experience of a capability's codebase, measuring dev-loop time, is resolving ambiguous adoption issues at domain scope."}
