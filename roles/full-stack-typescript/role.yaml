  - theme: "Data modeling"
    capability: BE-01
    key_area: "Backend & API Engineering"
    key_attribute: "Data & Persistence"
    anchor: kleppmann2017-ddia
    anchor_why: "schema design, consistency, and evolution determine what a system can ever safely do; the schema outlives the code, and modeling errors are the most expensive class of backend mistake."
    mappings:
      E1: {p: P1, sources: [kleppmann2017-ddia, sfia9], why: "BE-01 P1 ('Writes simple queries and follows existing schemas under review.') is the guided bar — writing correct queries and simple schema changes against an existing model, explaining entities in their own words, under review."}
      E2: {p: P2, sources: [kleppmann2017-ddia, sfia9], why: "BE-01 P2 ('Models standard entities and writes correct queries independently with normal review.') matches designing sound schemas for their features independently — keys, constraints, indexes judged by access pattern."}
      E3: {p: P3, sources: [kleppmann2017-ddia, sfia9], why: "BE-01 P3 ('Designs normalized schemas autonomously; writes complex queries and resolves modeling trade-offs.') is the capability-owning bar: modeling a capability's domain so invalid states are hard to represent is autonomous normalized-schema design at domain scope."}
      E4: {p: P4, sources: [kleppmann2017-ddia, larson2021-staffeng], why: "BE-01 P4 ('Defines data-modeling approaches teams adopt; solves the hardest schema and query problems.') is Staff-scope — untangling data models entangled across teams and landing the migrations."}
      E5: {p: P5, sources: [kleppmann2017-ddia, larson2021-staffeng], why: "BE-01 P5 ('Sets relational modeling strategy across systems; anticipates evolving data and access needs.') matches setting the org's data architecture and killing duplicate sources of truth."}
      E6: {p: P6, sources: [kleppmann2017-ddia, larson2021-staffeng], why: "BE-01 P6 ('Defines best practice for relational modeling industrywide; shapes widely adopted approaches.') is company/industry scope — owning company-level data-strategy bets including regulatory and multi-region posture."}
    evidence:
      E1: "Writes correct queries and simple schema changes against an existing model, explaining the main entities and their relationships in their own words."
      E2: "Designs sound schemas for their features — keys, constraints, indexes, normalization judged by access pattern — encoding invariants in the database rather than in application hope, with reversible migrations."
      E3: "Models a capability's domain so that invalid states are hard to represent, choosing consistency and transaction boundaries deliberately, designing for schema evolution, and catching modeling errors in others' designs before they calcify."
      E4: "Untangles data models entangled across teams — ownership of shared entities, duplication vs. reference, event contracts — and lands the migrations."
      E5: "Sets the org's data architecture (store selection, consistency posture, canonical sources of truth) and kills duplicate sources of truth."
      E6: "Owns company-level data strategy bets — the storage and consistency platform products build on for years, including regulatory and multi-region posture."
  - theme: "Query performance & safe migrations"
