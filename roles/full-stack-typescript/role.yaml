      E5: {p: P5, sources: [winters2020, larson2021-staffeng], why: "OPS-27 P5 ('Sets organization-wide platform strategy, anticipating how developer-experience engineering should evolve.') matches driving org developer-productivity strategy with survey and telemetry data."}
