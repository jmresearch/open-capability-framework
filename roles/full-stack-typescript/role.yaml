      E2: "Evaluates a package before adopting it — maintenance health, size, license, transitive surface, alternatives including writing it themselves — and keeps the components they own patched without being chased."
      E3: "Owns the dependency posture of a capability — upgrade cadence, pinning strategy, CVE triage by real exploitability, pruning abandoned packages before they bite — and leads its major framework and runtime upgrades."
      E4: "Builds supply-chain tooling and policy multiple teams follow (allowlists, automated updates, provenance checks, internal registries) and coordinates response when a shared dependency is compromised."
      E5: "Sets org supply-chain security posture — SBOM practice, artifact signing, build integrity, vendor risk — with compliance and security functions, reporting exposure to leadership."
      E6: "Owns company software supply-chain strategy and represents it to customers and auditors."
  - theme: "Data protection & privacy"
    capability: OPS-09
    key_area: "Security"
    key_attribute: "Supply Chain & Data Protection"
    anchor: gdpr
    anchor_why: "data protection by design and by default; full stack engineers decide at design time what gets collected, logged, cached, and retained, and mishandling personal data is a company-level event."
    mappings:
      E1: {p: P1, sources: [gdpr, sfia9], why: "OPS-09 P1 ('Knows data handling has privacy implications; follows rules.') is the guided bar — handling personal data per the team's rules (no PII in logs/URLs) and asking before new data collection is following rules."}
      E2: {p: P2, sources: [gdpr, sfia9], why: "OPS-09 P2 ('Applies PII handling, redaction, residency and retention correctly.') matches applying minimization by default in their features (collecting only what's needed, applying retention rules) without prompting."}
      E3: {p: P3, sources: [gdpr, sfia9], why: "OPS-09 P3 ('Designs for compliance (consent, audit trails, regional rules); owns readiness for a domain.') is the capability-owning bar: owning the data-protection design of a capability (classification, deletion paths that actually delete) is owning readiness for a domain verbatim."}
      E4: {p: P4, sources: [gdpr, larson2021-staffeng], why: "OPS-09 P4 ('Expert at translating regulation into controls; represents engineering in audits.') is Staff-scope — building privacy-preserving infrastructure multiple teams rely on (deletion pipelines, PII-safe logging)."}
      E5: {p: P5, sources: [gdpr, larson2021-staffeng], why: "OPS-09 P5 ('Sets org compliance strategy; anticipates regulation.') matches owning the org's privacy engineering program with legal and security, translating regulation into platform defaults."}
      E6: {p: P6, sources: [gdpr, larson2021-staffeng], why: "OPS-09 P6 ('Authoritative on the landscape; trusted interface to regulators.') is company/industry scope — shaping company data strategy where product value and privacy trade off, answering to regulators."}
    evidence:
      E1: "Handles personal data per the team's rules — no PII in logs, URLs, or analytics, no secrets in code or client bundles — and asks before adding any new data collection."
      E2: "Applies minimization by default in their features — collects only what's needed, encrypts what the standard requires, keeps PII out of client caches and telemetry, applies retention rules without prompting."
      E3: "Owns the data-protection design of a capability — classification, encryption expectations, retention, deletion paths that actually delete — and catches privacy problems in design review before legal has to."
      E4: "Builds privacy-preserving infrastructure multiple teams rely on (deletion pipelines, consent propagation, PII-safe logging libraries) and remediates cross-team data-handling gaps."
      E5: "Owns the org's privacy engineering program with legal and security, translating regulation into platform defaults teams can follow."
      E6: "Shapes company data strategy where product value and privacy obligations trade off, and answers for it to regulators and customers."
