role: AI Engineer
slug: ai-engineer
variant: ic_technical
minted: 2026-07-02
scope_note: >
  E1-E6 map to scope bands task -> component -> capability/domain -> multiple teams ->
  organization -> company (approximately S1-S6 on the IC axis). E3 / Senior is the terminal
  level: sustained excellence at capability scope is a complete career; E4+ is a different
  job defined by multi-team leverage. Consolidated 2026-07 by union from six independent
  same-methodology sources (180 source competencies -> 43 canonical); proficiency targets
  follow the IC guide E1:P1 ... E6:P6. R3 sourced-derivation retrofit (2026-07-09): every
  mapping now carries a bibliography source and a per-competency, per-level why grounded in
  that capability's actual P1-P6 catalog text -- the earlier blanket claim ("per-competency
  review found the source cells consistently written to those bars") is superseded by this
  per-cell sourcing. The diagonal held for all 43 competencies on re-derivation: every
  capability's own P1-P6 profile independently escalates task -> component -> domain/capability
  -> multiple-teams -> organization -> company in step with E1-E6; several (AI-21, OPS-30,
  SWE-09) use those exact scope nouns verbatim in their catalog text, so no mapping deviates
  from Ek:Pk -- see each competency's mappings[].why for the per-level catalog citation.
  Role-leveling source convention (constant across the ladder, not per-competency): E1-E3 pair
  the competency anchor with sfia9 (SFIA's guided/independent/proficient responsibility
  tiers); E4-E6 pair it with larson2021-staffeng (StaffEng's senior-IC archetypes for
  multi-team/org/company scope). AI risk assessment & governance is the one competency with a
  third, always-on source (eu-ai-act) alongside its nist-ai-rmf anchor, since both were named
  in the original citation and both are genuine bibliography entries used verbatim in AI-21's
  own catalog text. AI-01, AI-02 and AI-05 (two rows each) and AI-03 (three rows) remain
  deliberate double/triple-maps carried over from the original 2026-07 consolidation (flagged
  there as future split candidates): the catalog capability's single description spans more
  than one theme this ladder distinguishes (e.g. AI-02 covers retrieval pipelines, embeddings,
  and context/memory as one capability), so several competencies share one id with identical
  bars, differentiated in evidence/why by which part of the capability's description each
  theme instantiates -- not forced into weaker single mappings. Twenty of the 43 competency
  anchors resolve to a close bibliography substitute rather than the original free-text
  citation, because that citation (a blog post, conference talk, or paper never added to the
  bibliography) has no entry: in every case the substitute is a source the catalog's own
  capability_levels.csv already cites for that exact capability id (the 2026-07 "b07 batch" of
  deep AI/ML sourcing), reused rather than adding a near-duplicate bibliography row. Examples:
  API & service design's Bloch essay -> fielding2000 (SWE-07's own P1/P2 anchor); Debugging &
  systems diagnosis's Agans -> zeller2009 (SWE-06's own anchor); Agent architecture &
  orchestration's "Building Effective Agents" -> yao2022-react (AI-03's own P1-P3, P5 anchor,
  the ReAct paper that formalized the plan-act-observe loop); Tool & function design for
  agents's "Writing Effective Tools for Agents" -> mcp-spec (AI-03's own P4/P6 anchor, also
  Anthropic's own published standard); Embeddings & semantic search's Reimers & Gurevych ->
  johnson2019-faiss (AI-02's own P4 anchor); full list and rationale in r3-aie-report.md.
ladder_name: AI Engineer (IC Technical, E1-E6) - Canonical
ladder_description: >
  Canonical six-level IC ladder for engineers building LLM-powered and agentic systems,
  consolidated by union from six independent same-methodology sources; E3 Senior is the
  terminal level.
derived: true
levels:
  - {code: E1, title: Associate AI Engineer, scope: "task", focus: "Learns the AI stack and ships well-scoped tasks with guidance"}
  - {code: E2, title: AI Engineer, scope: "component", focus: "Owns model-backed components end to end, independently"}
  - {code: E3, title: Senior AI Engineer, scope: "capability / domain (terminal level)", focus: "Owns an AI capability; the quality bar for a domain; terminal level"}
  - {code: E4, title: Staff AI Engineer, scope: "multiple teams", focus: "Sets patterns and standards multiple teams build against"}
  - {code: E5, title: Senior Staff AI Engineer, scope: "organization", focus: "Drives org-wide AI engineering strategy"}
  - {code: E6, title: Principal AI Engineer, scope: "company", focus: "Sets company-level technical direction for AI"}
competencies:
  - theme: System design & architecture
    capability: SWE-05
    key_area: Software Engineering Craft
    key_attribute: Design & Architecture
    anchor: kleppmann2017-ddia
    anchor_why: "AI features live inside distributed systems; the data-flow and consistency trade-offs Kleppmann catalogs are the load-bearing design decisions, model calls included."
    mappings:
      E1: {p: P1, sources: [kleppmann2017-ddia, sfia9], why: "SWE-05 P1 ('Implements designs specified by others; asks why, not just how.') is the guided bar an Associate operates at — implementing a design someone else made and asking about an unclear boundary is exactly the novice-to-competent register, applied to where model calls sit in the request path."}
      E2: {p: P2, sources: [kleppmann2017-ddia, sfia9], why: "SWE-05 P2 ('Designs sound components; understands coupling, cohesion, interface design.') is the independent-component bar an AI Engineer operates at — designing one sound component — isolating model calls behind clear interfaces — is independent practice at component scope, not yet a capability's whole design."}
      E3: {p: P3, sources: [kleppmann2017-ddia, sfia9], why: "SWE-05 P3 ('Designs systems for evolution: clean seams, versioned interfaces, replaceable parts.') is the domain-owning bar for a Senior — designing for evolution (swappable models, versioned prompts, isolated nondeterminism) across a capability is 'clean seams, replaceable parts' one level past a single component. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [kleppmann2017-ddia, larson2021-staffeng], why: "SWE-05 P4 ('Mastery of architecture for complex systems; sets patterns and prevents drift.') is Staff-scope — writing reference architectures other teams instantiate is pattern-setting read across multiple teams, not one capability's design reviews."}
      E5: {p: P5, sources: [kleppmann2017-ddia, larson2021-staffeng], why: "SWE-05 P5 ('Sets multi-year architecture direction across the org.') matches Senior Staff's org-wide authority — setting AI architectural direction across the org and retiring dead-end patterns is the multi-year, org-scope direction P5 names."}
      E6: {p: P6, sources: [kleppmann2017-ddia, larson2021-staffeng], why: "SWE-05 P6 ('Authoritative and externally credible; defines architectural approach others follow.') is the company/industry-scope bar — defining the company's build-vs-buy and platform-vs-product bets in writing executives act on is what external credibility cashes out to at company scope."}
    evidence:
      E1: "Explains the system's architecture in their own words."
      E2: "Designs a component and writes the short design note for it."
      E3: "Selects patterns by trade-off in design docs that name the alternatives and failure modes."
      E4: "Writes the reference architectures other teams instantiate."
      E5: "Sets the architectural direction for AI systems across the org."
      E6: "Defines the company's long-horizon technical bets for AI systems."
  - theme: API & service design
    capability: SWE-07
    key_area: Software Engineering Craft
    key_attribute: Design & Architecture
    anchor: fielding2000
    anchor_why: "Bloch's original API-design essay has no bibliography entry; Fielding's REST dissertation is the foundational, catalog-sourced text SWE-07's own P1/P2 bars already cite for interface design, and AI features leak nondeterminism to consumers unless the contract deliberately contains it."
    mappings:
      E1: {p: P1, sources: [fielding2000, sfia9], why: "SWE-07 P1 ('Understands HTTP/REST and the deploy pipeline; makes guided changes.') is the guided bar an Associate operates at — implementing endpoints to an existing contract, including error responses, is the guided register — the contract already exists, they fill it in."}
      E2: {p: P2, sources: [fielding2000, sfia9], why: "SWE-07 P2 ('Designs clean APIs; understands rate limits, retries, timeouts, idempotency.') is the independent-component bar an AI Engineer operates at — designing clean APIs with rate limits, retries, timeouts and idempotency for one component is independent interface design at component scope."}
      E3: {p: P3, sources: [fielding2000, sfia9], why: "SWE-07 P3 ('Designs services for scale and cost; understands distributed failure modes.') is the domain-owning bar for a Senior — designing services for scale and distributed failure modes — streaming, partial failure, nondeterminism handled explicitly — is what isolating consumers from model and provider changes requires for a whole capability. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [fielding2000, larson2021-staffeng], why: "SWE-07 P4 ('Expert in platform/service design (multi-tenancy, capacity, shared services).') is Staff-scope — expert platform/service design across multi-tenancy and shared services is setting API conventions multiple teams follow, not one capability's contracts."}
      E5: {p: P5, sources: [fielding2000, larson2021-staffeng], why: "SWE-07 P5 ('Sets interface standards used across the org.') matches Senior Staff's org-wide authority — setting interface standards used across the org is the org-wide deprecation and interface-strategy authority P5 names."}
      E6: {p: P6, sources: [fielding2000, larson2021-staffeng], why: "SWE-07 P6 ('Defines company-wide API approach; trusted with irreversible interface bets.') is the company/industry-scope bar — defining company-wide API approach and owning irreversible interface bets is the external, partner-facing register."}
    evidence:
      E1: "Implements endpoints to an existing API contract, including error responses, and flags mismatches between spec and behavior."
      E2: "Designs the API surface for a component and documents it well enough that a consumer needs no walkthrough."
      E3: "Designs contracts that isolate consumers from model and provider changes and rejects designs that leak provider details to callers."
      E4: "Sets the API conventions multiple teams follow for model-backed services and retires inconsistent legacy surfaces with migration paths."
      E5: "Drives the org's interface strategy — which capabilities become shared platforms, and the deprecation policy that keeps the surface coherent."
      E6: "Shapes the company's external and partner-facing AI interfaces, balancing product commitments against provider volatility."
  - theme: Coding & implementation
    capability: SWE-01
    key_area: Software Engineering Craft
    key_attribute: Code Craft & Implementation
    anchor: mcconnell2004
    anchor_why: "AI code is still code; McConnell's implementation discipline is the base layer the rest of the ladder stands on."
    mappings:
      E1: {p: P1, sources: [mcconnell2004, sfia9], why: "SWE-01 P1 ('Writes working, readable code in the team's language; debugs own changes.') is the guided bar an Associate operates at — writing working, readable code and debugging their own changes is the novice-to-competent bar Code Complete's construction discipline describes."}
      E2: {p: P2, sources: [mcconnell2004, sfia9], why: "SWE-01 P2 ('Proficient in the primary language/ecosystem; handles errors, async and concurrency basics correctly.') is the independent-component bar an AI Engineer operates at — handling errors, async patterns and concurrency basics correctly in idiomatic code independently is proficiency in the primary ecosystem at component scope."}
      E3: {p: P3, sources: [mcconnell2004, sfia9], why: "SWE-01 P3 ('Code is a reference others learn from; debugs the hard problems (races, memory, nondeterminism).') is the domain-owning bar for a Senior — code others use as the reference for the stack, and debugging race conditions and nondeterministic failures, is the 'reference others learn from' register applied to a capability. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [mcconnell2004, larson2021-staffeng], why: "SWE-01 P4 ('Mastery across multiple stacks/paradigms; solves problems others can't; sets implementation patterns.') is Staff-scope — solving implementation problems other teams can't, across multiple stacks, and landing shared libraries is mastery read across multiple teams rather than one capability."}
      E5: {p: P5, sources: [mcconnell2004, larson2021-staffeng], why: "SWE-01 P5 ('Sets implementation standards adopted across the org; anticipates where code breaks at scale.') matches Senior Staff's org-wide authority — anticipating where implementations break at scale and shaping org-wide practice through load-bearing code is the org-scope standard-setting P5 names."}
      E6: {p: P6, sources: [mcconnell2004, larson2021-staffeng], why: "SWE-01 P6 ('Industry-level depth; authors foundational primitives and idioms others build on.') is the company/industry-scope bar — authoring foundational primitives used company-wide is the industry-level depth P6 describes."}
    evidence:
      E1: "Implements the retry-with-backoff helper for a flaky provider call exactly to spec and finds the off-by-one in their own token-counting logic before it reaches review."
      E2: "Ships the async job that reprocesses failed embedding batches, handling partial-batch failures and concurrent writes to the vector store without a teammate having to point them out."
      E3: "Writes the concurrent request-batching code newer engineers copy verbatim, and is the one who finds the race condition in the streaming-response handler that only shows up under load."
      E4: "Rewrites the team's Python retrieval service in Rust for a client with different concurrency guarantees, solving a memory-pressure bug in the vector index that stumped two other engineers."
      E5: "Sets the org's async-error-handling convention after a postmortem shows three teams' AI services failed the same way under provider timeout spikes."
      E6: "Writes the request-batching primitive now vendored into every AI service's client library company-wide, the reference implementation new hires study."
  - theme: Code quality & review
    capability: SWE-02
    key_area: Software Engineering Craft
    key_attribute: Code Craft & Implementation
    anchor: winters2020
    anchor_why: "Review is where a team's quality bar is actually enforced, and Winters, Manshreck & Wright's account of code health at Google scale is written for exactly this discipline, with AI-generated code raising the volume it must absorb."
    mappings:
      E1: {p: P1, sources: [winters2020, sfia9], why: "SWE-02 P1 ('Writes functional, readable code; uses version control correctly; responds well to review.') is the guided bar an Associate operates at — submitting small, reviewable changes and responding to feedback by fixing the pattern is the functional, review-responsive bar P1 names."}
      E2: {p: P2, sources: [winters2020, sfia9], why: "SWE-02 P2 ('Writes clean, documented, modular code; gives useful review feedback.') is the independent-component bar an AI Engineer operates at — giving useful review feedback and writing clean, modular, documented code independently for a component is proficiency at component scope."}
      E3: {p: P3, sources: [winters2020, sfia9], why: "SWE-02 P3 ('Designs for maintainability; leads refactors of problem areas; review feedback teaches.') is the domain-owning bar for a Senior — holding the quality bar in review for a whole domain — including AI-generated code — and leading refactors is 'designs for maintainability' applied to a capability. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [winters2020, larson2021-staffeng], why: "SWE-02 P4 ('Expert in code health at scale (shared libraries, deprecations, large migrations).') is Staff-scope — codifying review and code-health standards multiple teams adopt, including prompt-versioning conventions, is expertise in code health at scale, not one capability's review queue."}
      E5: {p: P5, sources: [winters2020, larson2021-staffeng], why: "SWE-02 P5 ('Shapes org-wide engineering standards for long-lived codebases.') matches Senior Staff's org-wide authority — changing how the org reviews and maintains code, including standards for machine-authored changes, is shaping org-wide engineering standards."}
      E6: {p: P6, sources: [winters2020, larson2021-staffeng], why: "SWE-02 P6 ('Defines what good engineering looks like company-wide; externally recognized.') is the company/industry-scope bar — setting the company's engineering quality bar, cited in executive quality trade-offs, is company-wide, externally-recognized standard-setting."}
    evidence:
      E1: "Submits small, reviewable changes that pass CI first try more often than not and responds to review feedback by fixing the pattern, not just the line."
      E2: "Reviews peers' changes with substantive comments and keeps the code they touch consistently readable."
      E3: "Holds the quality bar in review for a whole domain, including AI-generated code, articulating why a change is risky rather than just that it is."
      E4: "Codifies review and code-health standards multiple teams adopt and measurably reduces defect escape in the areas they steward."
      E5: "Changes how the org reviews and maintains code — tooling, norms, and the standards for machine-authored changes."
      E6: "Sets the company's engineering quality bar, cited when quality trade-offs reach executive decisions."
  - theme: Debugging & systems diagnosis
    capability: SWE-06
    key_area: Software Engineering Craft
    key_attribute: Code Craft & Implementation
    anchor: zeller2009
    anchor_why: "Agans' rules have no bibliography entry; Zeller's systematic-debugging text is the catalog-sourced substitute SWE-06 already anchors on, and model-backed systems add nondeterminism on top of ordinary bugs, so disciplined fault isolation is what separates the two."
    mappings:
      E1: {p: P1, sources: [zeller2009, sfia9], why: "SWE-06 P1 ('Debugs issues in own code with support; uses basic tooling.') is the guided bar an Associate operates at — debugging their own code with support and basic tooling is the guided bar for bugs in their own tasks."}
      E2: {p: P2, sources: [zeller2009, sfia9], why: "SWE-06 P2 ('Independently diagnoses defects in own area systematically.') is the independent-component bar an AI Engineer operates at — independently diagnosing defects in their own area systematically — distinguishing code bugs from model-behavior variance — is proficiency at component scope."}
      E3: {p: P3, sources: [zeller2009, sfia9], why: "SWE-06 P3 ('Leads diagnosis of hard, cross-cutting failures; root cause not symptoms.') is the domain-owning bar for a Senior — leading diagnosis of hard, cross-cutting failures, including intermittent model-dependent ones, and writing the reproduction others rerun, is root-cause diagnosis for a capability. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [zeller2009, larson2021-staffeng], why: "SWE-06 P4 ('Expert at the rare/systemic failures; builds tooling that makes them visible.') is Staff-scope — untangling cross-team failures where no single owner sees the whole path, and leaving behind instrumentation, is the rare/systemic-failure expertise P4 names."}
      E5: {p: P5, sources: [zeller2009, larson2021-staffeng], why: "SWE-06 P5 ('The person called for the worst failures; sets diagnostic practice org-wide.') matches Senior Staff's org-wide authority — spotting systemic failure classes from incident patterns across the org and driving architectural fixes is the org-wide diagnostic-practice authority P5 describes."}
      E6: {p: P6, sources: [zeller2009, larson2021-staffeng], why: "SWE-06 P6 ('Authority on diagnosis; advances the discipline.') is the company/industry-scope bar — being the debugger of last resort for company-critical incidents and turning each into durable prevention is the pioneer-level authority P6 names."}
    evidence:
      E1: "Reproduces a reported bug and bisects it to a candidate cause with guidance, reading logs and stack traces before asking for help."
      E2: "Isolates faults across service boundaries unaided, distinguishing deterministic code bugs from model-behavior variance before escalating."
      E3: "Debugs the hardest failures in a capability, including intermittent model-dependent ones, and writes the reproduction others rerun."
      E4: "Untangles cross-team failures where no single owner sees the whole path and leaves behind the instrumentation that makes the next one cheap."
      E5: "Spots systemic failure classes from incident patterns across the org and drives the architectural fixes."
      E6: "Is the debugger of last resort for company-critical AI incidents and turns each into a durable prevention mechanism."
  - theme: Deterministic tests vs evals
    capability: SWE-03
    key_area: Software Engineering Craft
    key_attribute: Testing & AI-Assisted Development
    anchor: cohn2009
    anchor_why: "Vocke's blog post and Husain's article have no bibliography entries; Cohn's Succeeding with Agile is where the test pyramid this competency splits from evals actually originates, and LLM systems need two verification regimes that confusing breaks both."
    mappings:
      E1: {p: P1, sources: [cohn2009, sfia9], why: "SWE-03 P1 ('Writes unit tests with guidance; tests own changes before merging.') is the guided bar an Associate operates at — writing unit tests for deterministic parts with guidance, and being able to say what's testable versus eval-able when asked, is the guided testing-pyramid bar."}
      E2: {p: P2, sources: [cohn2009, sfia9], why: "SWE-03 P2 ('Applies the testing pyramid; everything shipped arrives tested; mocks dependencies sensibly.') is the independent-component bar an AI Engineer operates at — drawing the test/eval boundary correctly for a component — mocking model calls, routing behavioral claims to evals — independently is proficiency with the pyramid at component scope."}
      E3: {p: P3, sources: [cohn2009, sfia9], why: "SWE-03 P3 ('Designs testable systems (contract, property-based, replay from prod); owns a test strategy.') is the domain-owning bar for a Senior — designing the verification strategy for a capability, including rejecting flaky model-in-the-loop tests with a stated rule, is owning a test strategy rather than following one. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [cohn2009, larson2021-staffeng], why: "SWE-03 P4 ('Expert in test strategy at scale (test data, environments, deployment safety).') is Staff-scope — standardizing the test-vs-eval discipline across teams with shared fixtures and CI policy is expert test strategy at scale, not one capability's suite."}
      E5: {p: P5, sources: [cohn2009, larson2021-staffeng], why: "SWE-03 P5 ('Sets testing/verification discipline across the org.') matches Senior Staff's org-wide authority — owning the org's verification strategy for AI systems and funding the harnesses that make the split cheap is org-wide testing-discipline authority."}
      E6: {p: P6, sources: [cohn2009, larson2021-staffeng], why: "SWE-03 P6 ('Shapes the company-wide quality culture; advances verification practice.') is the company/industry-scope bar — setting company policy for what 'verified' means, traceable from CI to eval to production, is the pioneer-level, company-wide quality-culture bar."}
    evidence:
      E1: "Writes unit tests for the deterministic parts of a change and can say which behaviors are testable versus eval-able when asked."
      E2: "Draws the test/eval boundary correctly for a component and keeps CI fast and free of flaky model-dependent assertions."
      E3: "Designs the verification strategy for a capability and rejects flaky model-in-the-loop tests in review with a stated rule."
      E4: "Standardizes the test-vs-eval discipline across teams with shared fixtures, replay harnesses, and CI policy for what may block a merge."
      E5: "Owns the org's verification strategy for AI systems, funding the harnesses that make the right split cheap and killing the theater."
      E6: "Sets company policy for what 'verified' means for AI products, traceable from CI to eval to production evidence."
  - theme: AI-augmented development judgment
    capability: SWE-10
    key_area: Software Engineering Craft
    key_attribute: Testing & AI-Assisted Development
    anchor: dora2024
    anchor_why: "SWE-10's own catalog profile is written directly from DORA's 2024 AI-adoption findings: AI assistance boosts throughput but hurts stability without verification discipline, and DORA is the source that measured that trade-off."
    mappings:
      E1: {p: P1, sources: [dora2024, sfia9], why: "SWE-10 P1 ('Uses AI coding tools with the output treated as a draft - reads every generated line, tests it, and can explain any part of the diff when asked.') is the guided bar an Associate operates at — using AI coding tools with output treated as a draft, reading every generated line, is the P1 bar verbatim — read, test, explain."}
      E2: {p: P2, sources: [dora2024, sfia9], why: "SWE-10 P2 ('Calibrates when generation helps and when it misleads for the work at hand; catches plausible-but-wrong generated code before review, and their AI-assisted changes pass review at the same rate as hand-written ones.') is the independent-component bar an AI Engineer operates at — calibrating when generation helps versus misleads, catching plausible-but-wrong code before review, is exactly SWE-10 P2's own text applied to one component's workflow."}
      E3: {p: P3, sources: [dora2024, sfia9], why: "SWE-10 P3 ('Sets the norms for AI-assisted work in a domain - what may be delegated to agents, what verification it requires, how provenance is noted in review - and coaches others out of over-trust and under-use.') is the domain-owning bar for a Senior — setting the norms for AI-assisted work on a capability — what may be delegated, what review it requires — is P3's 'sets the norms... in a domain' at capability scope. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint."}
      E4: {p: P4, sources: [dora2024, larson2021-staffeng], why: "SWE-10 P4 ('Defines AI-assisted engineering practice across teams - where agents run in the delivery lifecycle, what gates their output - justified by throughput and defect data rather than vendor claims.') is Staff-scope — defining AI-assisted engineering practice across teams, backed by throughput and defect data, is P4's cross-team practice-definition, not one team's norms."}
      E5: {p: P5, sources: [dora2024, larson2021-staffeng], why: "SWE-10 P5 ('Drives an organization's AI-augmented engineering strategy - tooling selection, workflow redesign, skill expectations - and adjusts policy from measured delivery outcomes.') matches Senior Staff's org-wide authority — driving the org's AI-augmented engineering strategy, selecting tooling and adjusting policy from outcomes, is P5's organization-wide strategy bar."}
      E6: {p: P6, sources: [dora2024, larson2021-staffeng], why: "SWE-10 P6 ('Shapes how software engineering itself changes with AI at company and industry level; a credible public voice on what changes and what doesn't.') is the company/industry-scope bar — shaping how the company builds software in the AI era, as a credible public voice, is P6's company-and-industry register."}
    evidence:
      E1: "Has the agent draft the schema-migration script, then reads and runs every line by hand and can walk a reviewer through why the down-migration is safe."
      E2: "Accepts the agent's generated boilerplate for a new API route unchanged but rewrites its generated cache-invalidation logic by hand after spotting a stale-read bug; their AI-assisted PRs land clean at the same rate as their hand-written ones."
      E3: "Writes the team's rule that agents may draft data-pipeline glue code unattended but never touch auth logic without a human diff review, and talks a skeptical teammate into trying agent-assisted refactors for mechanical renames instead of hand-editing forty files."
      E4: "Decides, with six months of defect-escape data across three teams, which pipeline stages autonomous coding agents may run in unattended and which require a human gate before merge."
      E5: "Picks the org's standard coding-agent tooling after a bake-off, redesigns the PR template around provenance tags, and walks back a workflow change once the data shows it slowed incident response."
      E6: "Writes the engineering blog post other companies cite when re-tooling their own build process around agentic coding."
  - theme: Prompt design & iteration
    capability: AI-01
    key_area: LLM Integration & Context Engineering
    key_attribute: Model Integration & Prompting
    anchor: brown2020-gpt3
    anchor_why: "Anthropic and OpenAI's prompt-engineering guides have no bibliography entries; Brown et al.'s GPT-3 paper is where few-shot prompting — the technique AI-01 P2 names directly — was first demonstrated, and prompts are load-bearing program text that versioned, tested iteration turns from folklore into engineering."
    mappings:
      E1: {p: P1, sources: [brown2020-gpt3, sfia9], why: "AI-01 P1 ('Understands LLM basics (tokens, context windows, temperature, system prompts); calls model APIs correctly.') is the guided bar an Associate operates at — calling model APIs correctly and understanding tokens, context windows and system prompts is the assisted bar for making a targeted, verified edit to an existing prompt."}
      E2: {p: P2, sources: [brown2020-gpt3, sfia9], why: "AI-01 P2 ('Writes effective prompts; uses structured outputs, function calling and streaming; understands model differences and pricing.') is the independent-component bar an AI Engineer operates at — writing effective prompts with structured outputs and function calling independently is AI-01's own P2 text, applied to a component's prompts written from scratch."}
