role: Platform Engineering
slug: platform-engineering
variant: ic_technical
minted: 2026-07-02
scope_note: >
  E1-E6 map to scope bands task -> component -> capability/domain -> multiple teams ->
  organization -> company (approximately S1-S6 on the IC axis). E3 / Senior is the terminal
  level: sustained excellence at capability scope is a complete career; E4+ is a different
  job defined by multi-team leverage. Consolidated 2026-07 by union from five independent
  same-methodology sources (163 source competencies -> 37 canonical); proficiency targets
  follow the IC guide E1:P1 ... E6:P6. R3 sourced-derivation retrofit (2026-07-09): every
  mapping now carries a bibliography source and a per-competency, per-level why grounded in
  that capability's actual P1-P6 catalog text -- the earlier blanket scope_note claim ("per-
  competency review found the source cells consistently written to those bars") is superseded
  by this per-cell sourcing. The diagonal held for all 37 competencies on re-derivation: every
  capability's own P1-P6 profile independently escalates task -> component -> domain/capability
  -> multiple-teams -> organization -> company in step with E1-E6 (several -- OPS-31, OPS-32,
  SEC-18, OPS-30, LI-03, PD-04, PD-02 -- use those exact scope nouns in their catalog text), so
  no mapping deviates from Ek:Pk; see each competency's mappings[].why for the per-level catalog
  citation. Role-leveling source convention (constant across the ladder, not per-competency):
  E1-E3 pair the competency anchor with sfia9 (SFIA's guided/independent/proficient
  responsibility tiers); E4-E6 pair it with larson2021-staffeng (StaffEng's senior-IC
  archetypes for multi-team/org/company scope). OPS-06 (Incident response / Learning from
  incidents) and OPS-27 (Golden paths & paved roads / Self-service provisioning) are
  deliberate double-maps: the catalog capability's single description spans both readings, so
  two competencies share one id with identical bars, differentiated in evidence/why by which
  half of the capability's description each theme instantiates -- flagged as future
  catalog-split candidates, not forced into a weaker single mapping. Four anchors resolve to a
  close existing bibliography substitute rather than the original free-text citation verbatim
  (no new entries needed): Code review's Sadowski et al. case study -> google-eng-practices
  (Google's own published review standard); Container orchestration's Burns/Grant/Oppenheimer/
  Brewer/Wilkes Borg/Omega/Kubernetes paper -> hightower2022 (Kubernetes: Up and Running,
  co-authored by Burns); Compliance & audit readiness's NIST OSCAL -> nist-csf2 (NIST's
  Cybersecurity Framework 2.0, the catalog's existing NIST compliance anchor); Mentorship &
  knowledge sharing's Lave & Wenger 1991 Situated Learning -> wenger1998-communitiesofpractice
  (Wenger's own solo continuation of the same legitimate-peripheral-participation theory).
ladder_name: Platform Engineer (IC Technical, E1-E6) - Canonical
ladder_description: >
  Canonical six-level IC ladder for platform engineering, consolidated by union from five
  independent same-methodology generations; E3 Senior is the terminal level.
derived: true
levels:
  - {code: E1, title: Associate Platform Engineer, scope: "task", focus: "Learns the platform and ships well-defined tasks with guidance"}
  - {code: E2, title: Platform Engineer, scope: "component", focus: "Owns platform components end to end and unblocks internal users independently"}
  - {code: E3, title: Senior Platform Engineer, scope: "capability / domain (terminal level)", focus: "Owns a platform capability as a product; terminal level"}
  - {code: E4, title: Staff Platform Engineer, scope: "multiple teams", focus: "Shapes platform architecture and adoption across multiple teams"}
  - {code: E5, title: Senior Staff Platform Engineer, scope: "organization", focus: "Sets platform strategy and standards for the engineering organization"}
  - {code: E6, title: Principal Platform Engineer, scope: "company", focus: "Sets company-wide platform direction and technical bets"}
competencies:
  # ---- Platform as a Product ----
  - theme: Internal user research
    capability: PM-01
    key_area: Platform as a Product
    key_attribute: Product Discovery & Feedback
    anchor: noda2023-devex
    anchor_why: "grounds discovery in evidence about how developers actually experience the platform, not provider assumptions."
    mappings:
      E1: {p: P1, sources: [noda2023-devex, sfia9], why: "PM-01 P1 ('runs scripted customer interviews and notes findings under a senior researcher's guidance') is the guided-task bar an Associate operates at -- they sit in on interviews and write up friction, they do not yet run discovery."}
      E2: {p: P2, sources: [noda2023-devex, sfia9], why: "P2 ('plans and conducts standard discovery for a feature, synthesizing themes with normal review') matches a Platform Engineer running structured interviews for the one component they own, with review as the independence check."}
      E3: {p: P3, sources: [noda2023-devex, sfia9], why: "P3 ('independently frames ambiguous problems, selects fitting methods, and separates signal from noise') is what owning discovery for a whole capability requires -- no senior researcher frames the problem for them anymore. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [noda2023-devex, larson2021-staffeng], why: "P4 ('designs the team's discovery approach and untangles findings others find contradictory') is Staff-scope: the deliverable is a reusable discovery method other platform teams adopt, not one more interview round."}
      E5: {p: P5, sources: [noda2023-devex, larson2021-staffeng], why: "P5 ('sets the org's research strategy and anticipates emerging customer needs before they surface') matches owning a standing, anticipatory research practice across engineering."}
      E6: {p: P6, sources: [noda2023-devex, larson2021-staffeng], why: "P6 ('defines what rigorous product discovery means and shapes the discipline's practice externally') is the only DevEx-research bar with company-plus-external reach."}
    evidence:
      E1: "Shadows platform users and sits in on interviews and support rotations, writing up the friction they hit."
      E2: "Runs structured interviews and support-channel reviews with the internal engineers using their component."
      E3: "Designs and runs the discovery process for a capability."
      E4: "Synthesizes research across several product teams into shared personas and friction maps other platform teams adopt."
      E5: "Establishes the organization's standing platform research practice."
      E6: "Represents the internal developer experience at company level."
  - theme: Adoption & success metrics
    capability: PM-10
    key_area: Platform as a Product
    key_attribute: Product Discovery & Feedback
    anchor: forsgren2018
    anchor_why: "supplies the outcome metrics that make voluntary platform adoption measurable and defensible."
    mappings:
      E1: {p: P1, sources: [forsgren2018, sfia9], why: "PM-10 P1 ('pulls and reports defined product metrics under direction') is the guided-reporting bar -- an Associate charts numbers someone else defined, not yet picking them."}
      E2: {p: P2, sources: [forsgren2018, sfia9], why: "P2 ('builds and interprets metric dashboards for a product with normal review') matches instrumenting one component's adoption/retention signals under normal review."}
      E3: {p: P3, sources: [forsgren2018, sfia9], why: "P3 ('independently designs metric frameworks and draws sound conclusions from messy data') is what defining the success metrics for a whole capability requires. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [forsgren2018, larson2021-staffeng], why: "P4 ('defines the measurement model teams adopt and diagnoses misleading metrics others trust') matches standardizing how several platform teams measure adoption so the numbers compose."}
      E5: {p: P5, sources: [forsgren2018, larson2021-staffeng], why: "P5 ('sets product-analytics strategy across the org and anticipates which signals will matter') matches owning the org's platform scorecard."}
      E6: {p: P6, sources: [forsgren2018, larson2021-staffeng], why: "P6 ('defines rigorous product measurement for the discipline and is cited externally on it') matches framing platform value in company terms with external credibility."}
    evidence:
      E1: "Pulls and charts existing adoption and usage numbers accurately when asked."
      E2: "Instruments their component with adoption, retention, and satisfaction signals."
      E3: "Defines the success metrics for a capability."
      E4: "Standardizes how several platform teams measure adoption so their numbers compose."
      E5: "Owns the organization's platform scorecard."
      E6: "Frames platform value in company terms."
  - theme: Thinnest viable platform
    capability: OPS-31
    key_area: Platform as a Product
    key_attribute: Platform Strategy & Scope
    anchor: skelton-pais2019
    anchor_why: "defines the Thinnest Viable Platform -- the sizing test every build-buy-adopt and retirement decision here is judged against."
    mappings:
      E1: {p: P1, sources: [skelton-pais2019, sfia9], why: "OPS-31 P1 ('checks for an existing tool, service, or open-source option before writing new code ... asks whether a proposed task serves a real user need') is written at task scope -- one build decision, not a portfolio of them."}
      E2: {p: P2, sources: [skelton-pais2019, sfia9], why: "P2 ('proposes wrapping or configuring an existing service instead of building new when it meets the need ... defending removal of unused features in their own component') names 'their own component' verbatim -- the E2 band."}
      E3: {p: P3, sources: [skelton-pais2019, sfia9], why: "P3 ('keeps a whole capability at its thinnest viable size -- makes explicit, documented build-buy-adopt decisions ... retires surface area whose maintenance cost exceeds its value') names 'a whole capability' verbatim, and the terminal register: sustained thinness discipline over one capability is a complete job. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [skelton-pais2019, larson2021-staffeng], why: "P4 ('arbitrates overlap and sprawl across teams -- merges duplicate offerings ... sets the bar for what deserves to be shared platform at all') names 'across teams' verbatim -- E4."}
      E5: {p: P5, sources: [skelton-pais2019, larson2021-staffeng], why: "P5 ('shapes the organization's platform boundary -- what the platform owns versus product teams versus vendors -- and drives the organization to shed what it should not own') names 'the organization' verbatim -- E5."}
      E6: {p: P6, sources: [skelton-pais2019, larson2021-staffeng], why: "P6 ('sets the build-buy-adopt principles an entire company references, keeping company-scale platform investment proportional to the delivery it unlocks') names company scale verbatim -- E6."}
    evidence:
      E1: "Finds that an existing internal CLI already covers most of a proposed new tool's use case and raises it in planning instead of starting a new build."
      E2: "Recommends adopting the org's existing secrets-manager service instead of building a bespoke wrapper for their component, and writes up the build-vs-adopt comparison that settles it."
      E3: "Retires half a capability's plugin surface after usage telemetry shows only two of eight plugins are load-bearing, documenting the build-buy-adopt call for what stays."
      E4: "Merges two platform teams' overlapping feature-flag services into one and retires the duplicate."
      E5: "Draws the line for what the platform organization owns versus what product teams should just buy, and gets teams to hand back components that crossed it."
      E6: "Kills a company-wide platform initiative whose maintenance cost has outgrown the delivery it unlocks, over objections that the build already happened."
  - theme: Platform roadmap & prioritization
    capability: PM-05
    key_area: Platform as a Product
    key_attribute: Platform Strategy & Scope
    anchor: perri2018-escapingbuildtrap
    anchor_why: "holds the platform roadmap to outcome-over-output product discipline rather than an infrastructure ticket queue."
    mappings:
      E1: {p: P1, sources: [perri2018-escapingbuildtrap, sfia9], why: "PM-05 P1 ('maintains roadmap items and updates status under guidance') is the guided bar -- an Associate can explain why their task is on the roadmap without owning the roadmap."}
      E2: {p: P2, sources: [perri2018-escapingbuildtrap, sfia9], why: "P2 ('builds and sequences a credible roadmap for one product with normal review') matches sequencing one component's backlog by user impact."}
      E3: {p: P3, sources: [perri2018-escapingbuildtrap, sfia9], why: "P3 ('independently balances competing priorities and replans confidently under shifting constraints') is what owning a capability's roadmap requires without a product manager holding the pen. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [perri2018-escapingbuildtrap, larson2021-staffeng], why: "P4 ('designs the planning approach others use and resolves cross-team portfolio conflicts') matches aligning roadmaps across several platform teams."}
      E5: {p: P5, sources: [perri2018-escapingbuildtrap, larson2021-staffeng], why: "P5 ('sets portfolio planning strategy and foresees where investment should shift next') matches driving the platform organization's investment strategy."}
      E6: {p: P6, sources: [perri2018-escapingbuildtrap, larson2021-staffeng], why: "P6 ('defines portfolio-planning best practice for the field and is recognized for it') matches setting multi-year platform direction for the company."}
    evidence:
      E1: "Explains why their current task is on the roadmap."
      E2: "Sequences their component's backlog by user impact."
      E3: "Owns the roadmap for a platform capability."
      E4: "Aligns roadmaps across platform teams."
      E5: "Drives the platform organization's investment strategy."
      E6: "Sets multi-year platform direction for the company."
  - theme: Golden paths & paved roads
    capability: OPS-27
    key_area: Platform as a Product
    key_attribute: Developer Experience
    anchor: spotify2020-goldenpaths
    anchor_why: "the named industry pattern this competency's templates, defaults, and escape hatches implement."
    mappings:
      E1: {p: P1, sources: [spotify2020-goldenpaths, sfia9], why: "OPS-27 P1 ('maintains existing self-service platform components under review, addressing documented user requests') matches an Associate following the golden path as a real user would and reporting exactly where it breaks -- consuming the road before building it."}
      E2: {p: P2, sources: [spotify2020-goldenpaths, sfia9], why: "P2 ('independently builds and supports standard platform capabilities and templates for routine developer needs with review') matches building and maintaining golden-path assets scoped to one component."}
      E3: {p: P3, sources: [spotify2020-goldenpaths, sfia9], why: "P3 ('designs self-service workflows for ambiguous needs, reducing friction and resolving hard abstraction and adoption issues') matches designing a golden path for a whole use case end to end -- the ambiguous, cross-cutting judgment a template author needs. This reading of OPS-27 is the paved-road half of the capability's description; Self-service provisioning below carries the automation-interface half. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [spotify2020-goldenpaths, larson2021-staffeng], why: "P4 ('defines platform architecture and golden paths others adopt, solving deep developer-experience and leverage problems') matches reconciling golden paths across teams into one coherent journey."}
      E5: {p: P5, sources: [spotify2020-goldenpaths, larson2021-staffeng], why: "P5 ('sets organization-wide platform strategy, anticipating how developer-experience engineering should evolve') matches defining the organization's paved-road strategy."}
      E6: {p: P6, sources: [spotify2020-goldenpaths, larson2021-staffeng], why: "P6 ('defines what excellent platform engineering means for the field, shaping industry developer-experience practice') matches making the paved road the company default through economics and quality rather than mandate."}
    evidence:
      E1: "Follows the golden path as a real user would and reports exactly where it breaks."
      E2: "Builds and maintains golden-path assets for their component."
      E3: "Designs a golden path for a whole use case end to end."
      E4: "Reconciles golden paths across teams into coherent journeys."
      E5: "Defines the organization's paved-road strategy."
      E6: "Makes the paved road the company default by economics and quality, not policy."
  - theme: Cognitive load reduction
    capability: OPS-32
    key_area: Platform as a Product
    key_attribute: Developer Experience
    anchor: sweller1988
    anchor_why: "makes load reduction the platform's defining purpose rather than optional polish."
    mappings:
      E1: {p: P1, sources: [sweller1988, sfia9], why: "OPS-32 P1 ('names the exact docs, errors, and setup steps that forced them to understand internals a consumer should not need, and files concrete simplification issues') is task-scoped noticing, not yet fixing -- the Associate bar."}
      E2: {p: P2, sources: [sweller1988, sfia9], why: "P2 ('reduces the concepts and steps a consumer must hold to use their component ... and shows the before/after') names 'their component' verbatim -- E2."}
      E3: {p: P3, sources: [sweller1988, sfia9], why: "P3 ('designs a capability's abstractions around what consumers must not have to know ... measures load with time-to-first-success and support-ticket themes') names 'a capability's abstractions' verbatim, treating load as an owned, measured product property rather than a task-level fix. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [sweller1988, larson2021-staffeng], why: "P4 ('audits cognitive load across team boundaries ... drives the cross-boundary simplifications no single team could make') is explicitly cross-team-boundary work -- E4."}
      E5: {p: P5, sources: [sweller1988, larson2021-staffeng], why: "P5 ('makes cognitive load a first-class organizational measure with explicit load budgets, vetoing designs that externalize complexity onto consuming teams') matches owning an org-wide load budget with veto authority."}
      E6: {p: P6, sources: [sweller1988, larson2021-staffeng], why: "P6 ('shapes company-level technology and team-boundary choices explicitly around team cognitive load, arguing for fewer, deeper abstractions over sprawling optionality') is explicitly company-level."}
    evidence:
      E1: "Flags that provisioning a database requires reading the underlying Terraform module's internals just to fill in one required field, and files the doc fix."
      E2: "Collapses a twelve-field service-creation form down to two required fields by defaulting the rest, and shows the before/after time-to-first-deploy."
      E3: "Rewrites a capability's onboarding so a first-time consumer ships without reading the implementation, tracking time-to-first-success as the load metric."
      E4: "Finds three teams independently solved the same secrets-rotation problem because none could see the others' internals, and drives the shared fix across all three."
      E5: "Sets an explicit cognitive-load budget per platform surface and vetoes a design that would have pushed new required concepts onto every consuming team."
      E6: "Argues successfully against a company-wide multi-cloud push on cognitive-load grounds -- fewer, deeper abstractions over optionality -- and the simpler single-cloud default ships instead."
  # ---- Platform Software Engineering ----
  - theme: Platform system design
    capability: SWE-05
    key_area: Platform Software Engineering
    key_attribute: Design & Architecture
    anchor: conway1968
    anchor_why: "platform architecture and team boundaries must be designed together, or Conway's Law designs them for you."
    mappings:
      E1: {p: P1, sources: [conway1968, sfia9], why: "SWE-05 P1 ('implements designs specified by others; asks why, not just how') is the guided-implementation bar -- an Associate explains the architecture, they do not yet author it."}
      E2: {p: P2, sources: [conway1968, sfia9], why: "P2 ('designs sound components; understands coupling, cohesion, interface design') matches designing a component within an established architecture."}
      E3: {p: P3, sources: [conway1968, sfia9], why: "P3 ('designs systems for evolution: clean seams, versioned interfaces, replaceable parts') is the trade-off-driven design-doc judgment a capability owner needs -- naming alternatives, failure modes, and evolution paths themselves. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [conway1968, larson2021-staffeng], why: "P4 ('mastery of architecture for complex systems; sets patterns and prevents drift') matches driving designs that cut across several teams' systems."}
      E5: {p: P5, sources: [conway1968, larson2021-staffeng], why: "P5 ('sets multi-year architecture direction across the org') matches setting the architectural direction the platform organization builds against."}
      E6: {p: P6, sources: [conway1968, larson2021-staffeng], why: "P6 ('authoritative and externally credible; defines architectural approach others follow') matches making the company's foundational architecture bets."}
    evidence:
      E1: "Explains the platform's architecture in their own words."
      E2: "Designs a component within an established architecture."
      E3: "Selects patterns by trade-off in design docs that name alternatives, failure modes, and evolution paths."
      E4: "Drives designs that cut across several teams' systems."
      E5: "Sets the architectural direction the platform organization builds against."
      E6: "Makes the company's foundational architecture bets."
  - theme: API & interface design
    capability: SWE-07
    key_area: Platform Software Engineering
    key_attribute: Design & Architecture
    anchor: winters2020
    anchor_why: "justifies treating interfaces as long-lived contracts and breaking changes as incidents."
    mappings:
      E1: {p: P1, sources: [winters2020, sfia9], why: "SWE-07 P1 ('understands HTTP/REST and the deploy pipeline; makes guided changes') is the guided bar -- an Associate uses the platform's APIs correctly from documentation alone, they do not yet design one."}
      E2: {p: P2, sources: [winters2020, sfia9], why: "P2 ('designs clean APIs; understands rate limits, retries, timeouts, idempotency') matches extending a component's interface without breaking consumers."}
      E3: {p: P3, sources: [winters2020, sfia9], why: "P3 ('designs services for scale and cost; understands distributed failure modes') is what treating a capability's interface as a long-lived product contract requires -- Hyrum's Law-aware design, not a one-off endpoint. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [winters2020, larson2021-staffeng], why: "P4 ('expert in platform/service design (multi-tenancy, capacity, shared services)') matches aligning interface conventions across several teams' APIs so the platform feels like one product."}
      E5: {p: P5, sources: [winters2020, larson2021-staffeng], why: "P5 ('sets interface standards used across the org') matches owning the organization's interface standards."}
      E6: {p: P6, sources: [winters2020, larson2021-staffeng], why: "P6 ('defines company-wide API approach; trusted with irreversible interface bets') matches setting the company's contract with its developers."}
    evidence:
      E1: "Uses the platform's APIs correctly from documentation alone."
      E2: "Extends a component's interface without breaking consumers."
      E3: "Designs a capability's interface as a long-lived product contract."
      E4: "Aligns interface conventions across several teams' APIs so the platform feels like one product."
      E5: "Owns the organization's interface standards."
      E6: "Sets the company's contract with its developers."
  - theme: Coding & implementation
    capability: SWE-02
    key_area: Platform Software Engineering
    key_attribute: Code Craft & Quality
    anchor: fowler2018
    anchor_why: "sets the craft bar for platform code that many teams depend on."
    mappings:
      E1: {p: P1, sources: [fowler2018, sfia9], why: "SWE-02 P1 ('writes functional, readable code; uses version control correctly; responds well to review') is the entry bar -- small, convention-following changes that pass review with minor feedback."}
      E2: {p: P2, sources: [fowler2018, sfia9], why: "P2 ('writes clean, documented, modular code; gives useful review feedback') matches shipping production-quality code independently."}
      E3: {p: P3, sources: [fowler2018, sfia9], why: "P3 ('designs for maintainability; leads refactors of problem areas; review feedback teaches') matches writing the code other engineers study to learn how it's done on this platform. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [fowler2018, larson2021-staffeng], why: "P4 ('expert in code health at scale (shared libraries, deprecations, large migrations)') matches raising the code-health baseline across teams."}
      E5: {p: P5, sources: [fowler2018, larson2021-staffeng], why: "P5 ('shapes org-wide engineering standards for long-lived codebases') matches defining what code quality means for the organization."}
      E6: {p: P6, sources: [fowler2018, larson2021-staffeng], why: "P6 ('defines what good engineering looks like company-wide; externally recognized') matches holding the company's long-horizon code health against short-term pressure."}
    evidence:
      E1: "Ships small, working changes that follow the codebase's conventions and pass review with minor feedback."
      E2: "Ships production-quality code independently."
      E3: "Writes the code others study to learn how it is done here."
      E4: "Raises the code-health baseline across teams."
      E5: "Defines what code quality means for the organization."
      E6: "Holds the company's long-horizon code health against short-term pressure."
  - theme: Code review
    capability: SWE-04
    key_area: Platform Software Engineering
    key_attribute: Code Craft & Quality
    anchor: google-eng-practices
    anchor_why: "grounds the progression from catching defects to calibrating review culture."
    mappings:
      E1: {p: P1, sources: [google-eng-practices, sfia9], why: "SWE-04 P1 ('navigates the codebase and understands code shown; reviews small changes') matches reviewing peers' changes for readability and test coverage and asking genuine questions."}
      E2: {p: P2, sources: [google-eng-practices, sfia9], why: "P2 ('independently understands unfamiliar code; gives timely, specific review feedback') matches giving reviews that catch real defects without a second reviewer double-checking them."}
      E3: {p: P3, sources: [google-eng-practices, sfia9], why: "P3 ('quickly grasps complex/legacy systems; reviews raise the bar across a domain') matches reviewing for systemic risk, not just correctness, at capability scope. E3 is this ladder's terminal level (scope_note): sustained P3 mastery here is a complete career, not a waypoint -- consistent with how SFIA treats independent full-competency practice as a legitimate long-run professional register and with StaffEng's own point that not every strong senior engineer needs to become staff."}
      E4: {p: P4, sources: [google-eng-practices, larson2021-staffeng], why: "P4 ('expert at reviewing high-risk changes; review standards spread across teams') matches calibrating review culture across teams."}
      E5: {p: P5, sources: [google-eng-practices, larson2021-staffeng], why: "P5 ('authority on review practice org-wide') matches designing the organization's quality gates."}
      E6: {p: P6, sources: [google-eng-practices, larson2021-staffeng], why: "P6 ('defines what good review looks like; shapes industry-facing practice') matches reviewing the changes that change the company."}
    evidence:
      E1: "Reviews peers' changes for readability and test coverage and asks genuine questions."
      E2: "Gives reviews that catch real defects."
      E3: "Reviews for systemic risk, not just correctness."
      E4: "Calibrates review culture across teams."
      E5: "Designs the organization's quality gates."
      E6: "Reviews the changes that change the company."
  - theme: Testing & verification
    capability: SWE-03
    key_area: Platform Software Engineering
