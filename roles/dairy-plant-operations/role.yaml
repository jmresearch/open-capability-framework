  # ---- Safety & Process Safety Management ----
  - theme: Lockout/tagout & hazardous energy control
    capability: WPL-08
    key_area: Safety & Process Safety Management
    key_attribute: Personal Safety & Energy Control
    anchor: osha1910-147-loto
    anchor_why: "hazardous-energy control prevents the plant's highest-consequence injuries"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, osha1910-147-loto], why: "WPL-08 P1 ('conducts routine safety checks and logs incidents following defined procedures') is Dreyfus's novice band at L1's checked scope, instantiated here as locking out one energy source and verifying zero energy exactly per 1910.147's procedure."}
      L2: {p: P2, sources: [dreyfus1980, osha1910-147-loto], why: "WPL-08 P2 ('manages standard EHS programs and investigations independently within policy') is Dreyfus's advanced-beginner band at L2's shift scope -- completing a multi-point lockout by the written procedure alone."}
      L3: {p: P3, sources: [dreyfus1980, osha1910-147-loto], why: "WPL-08 P3 ('resolves complex safety hazards and ambiguous compliance situations under risk') is the Dreyfus competent band at L3's multiple-areas scope -- planning a group lockout for a job with no ready-made procedure."}
      L4: {p: P4, sources: [sfia9, osha1910-147-loto], why: "WPL-08 P4 ('defines EHS standards and risk-assessment methods that others adopt') is SFIA's Ensure/advise band -- Lead Operator, IC terminal, sets the line's energy-control standard."}
      L5: {p: P4, sources: [sfia9, osha1910-147-loto], why: "L5 keeps L4's P4 standard-setting depth -- the Shift Supervisor stops a task with incomplete lockout before it starts, enforcing the standard L4 already set, not writing a new one."}
      L6: {p: P5, sources: [sfia9, osha1910-147-loto], why: "WPL-08 P5 ('sets EHS strategy and anticipates emerging hazards and regulatory change') is SFIA's Initiate/influence band at L6's department scope, applied to closing systemic lockout gaps."}
      L7: {p: P6, sources: [sfia9, osha1910-147-loto], why: "WPL-08 P6 ('establishes environmental-health-and-safety practice recognized as authoritative across the field') is SFIA's Set-strategy/inspire band -- accountable for zero hazardous-energy incidents plant-wide."}
    evidence:
      L1: "Locks out one energy source correctly and verifies zero energy."
      L2: "Completes a multi-point lockout by the procedure alone."
      L3: "Plans a group lockout for a job others found ambiguous."
      L4: "Sets the energy-control standard the line follows."
      L5: "Stops a task with incomplete lockout before it starts."
      L6: "Closes a lockout gap through a procedure change."
      L7: "Is accountable for zero hazardous-energy incidents plant-wide."
