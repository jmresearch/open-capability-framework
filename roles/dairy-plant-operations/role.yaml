      L4: {p: P4, sources: [sfia9, osha-1910], why: "WPL-08 P4 ('defines EHS standards and risk-assessment methods that others adopt') is SFIA's Ensure/advise band -- Lead Operator, IC terminal, sets the line's permit-to-work standard."}
