      L2: {p: P2, sources: [dreyfus1980, osha-1910], why: "WPL-08 P2 ('manages standard EHS programs and investigations independently within policy') is Dreyfus's advanced-beginner band at L2's shift scope -- filling a hot-work or confined-space (1910.146) permit correctly alone."}
