role: Dairy Plant Operations
slug: dairy-plant-operations
variant: general
minted: 2026-07-07
scope_note: >
  A single, unified IC->manager progression for a Grade A / cultured / cheese / powder dairy
  processing plant - the atypical pathway where operator craft and operational leadership advance
  in ONE ladder rather than splitting into separate IC and manager tracks. L1-L4 are
  individual-contributor operator craft (L4 Lead Operator is the IC-terminal master operator who
  leads without the title); L5-L7 are operational leadership (Shift Supervisor -> Area / Production
  Manager -> Plant Operations Manager). Scope widens by breadth of responsibility: one machine /
  task -> a process area -> a line across a shift -> a shift crew -> a department across shifts ->
  the whole plant. Leadership competencies appear at the IC levels as informal, demonstrable-now
  behaviors (trains a peer, runs the pre-shift huddle, calls the safety stand-down, owns changeover
  discipline) and formalize at L5-L7; conversely food-safety, process, and equipment craft keep
  advancing through L7 (a plant manager still owns the HACCP plan and the PSM program). Consolidated
  2026-07-07 by union from five independent same-methodology blind runs (163 source competencies ->
  38 canonical); every focus area spans 2+ competencies. 13 competencies map to existing OCF
  capabilities (generic operations, maintenance, EHS, leadership, finance); 25 dairy/food-plant
  craft competencies had no catalog match and reference pending proposals under a new
  "Food & Beverage Manufacturing" (FBM) capability set (see contrib/). Proficiency follows an
  operational curve: craft competencies climb L1:P1 -> L7:P6 with an L4-L5 depth plateau at the
  IC-terminal master-operator bar; leadership competencies start as informal proxies (L1:P1) and
  rise to P6 at plant-lead scope.
levels:
  - {code: L1, title: Operator I, scope: "one machine / task under direction", focus: "learns the plant and runs a single process area under direction"}
  - {code: L2, title: Operator II, scope: "a process area across a shift", focus: "runs a process area independently across a full shift"}
  - {code: L3, title: Senior Operator, scope: "multiple process areas", focus: "operates multiple areas, troubleshoots, and coaches peers"}
  - {code: L4, title: Lead Operator, scope: "a line / process end to end (IC terminal)", focus: "owns a line end to end and leads the floor without the title - IC terminal"}
  - {code: L5, title: Shift Supervisor, scope: "a shift crew", focus: "leads a shift crew and its safety, quality, and output"}
  - {code: L6, title: Area / Production Manager, scope: "a department across shifts", focus: "owns a department across shifts - its people, cost, and performance"}
  - {code: L7, title: Plant Operations Manager, scope: "the whole plant", focus: "owns whole-plant operations, safety, quality, and cost"}
