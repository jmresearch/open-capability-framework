role: Dairy Plant Operations
slug: dairy-plant-operations
variant: general
minted: 2026-07-07
scope_note: >
  A single, unified IC->manager progression for a Grade A / cultured / cheese / powder dairy processing plant - the atypical pathway where operator craft and operational leadership advance in ONE ladder rather than splitting into separate IC and manager tracks. L1-L4 are individual-contributor operator craft (L4 Lead Operator is the IC-terminal master operator who leads without the title); L5-L7 are operational leadership (Shift Supervisor -> Area / Production Manager -> Plant Operations Manager). Scope widens by breadth of responsibility: one machine / task -> a process area -> a line across a shift -> a shift crew -> a department across shifts -> the whole plant. Leadership competencies appear at the IC levels as informal, demonstrable-now behaviors (trains a peer, runs the pre-shift huddle, calls the safety stand-down, owns changeover discipline) and formalize at L5-L7; conversely food-safety, process, and equipment craft keep advancing through L7 (a plant manager still owns the HACCP plan and the PSM program). Consolidated 2026-07-07 by union from five independent same-methodology blind runs (163 source competencies -> 38 canonical); every focus area spans 2+ competencies. 13 competencies map to existing OCF capabilities (generic operations, maintenance, EHS, leadership, finance); 25 dairy/food-plant craft competencies had no catalog match and were accepted into a new "Food & Beverage Manufacturing" (FBM) capability set (FBM-01..FBM-25, data/capabilities.csv). Proficiency follows an operational curve, re-verified per competency against the accepted catalog text rather than applied as a template: craft competencies climb L1:P1 -> L7:P6 with an L4-L5 depth plateau at the IC-terminal master-operator bar (scope widens line->crew, depth does not); leadership competencies (operator training, coaching, shift leadership, cost/budget) start as informal proxies (L1:P1, L2:P1) and only formalize to P4 at L5 when the title (Shift Supervisor) does; the huddle/escalation/scheduling trio plateaus at P2 across L2-L3 before the same L4->P3, L5->P4 formalization step. R3 sourced-derivation retrofit (2026-07-09): every mapping now carries a bibliography source and a per-competency why; anchors resolve to bibliography keys; role flavor from the prior authored ladder survives only where it passes the cell-derivation instance test, stored under evidence:. Rendered ladder.md/ladder.csv/ladder.xlsx are derived from this file plus the catalog and must never be hand-edited.
ladder_name: Dairy Plant Operations (L1-L7) - Canonical
ladder_description: >
  Unified individual-contributor-to-manager career ladder (L1-L7) for a Grade A dairy processing plant, where food-safety, process, and equipment craft and operational leadership advance together from Operator I to Plant Operations Manager.
derived: true
levels:
  - {code: L1, title: Operator I, scope: "one machine / task under direction", focus: "learns the plant and runs a single process area under direction"}
  - {code: L2, title: Operator II, scope: "a process area across a shift", focus: "runs a process area independently across a full shift"}
  - {code: L3, title: Senior Operator, scope: "multiple process areas", focus: "operates multiple areas, troubleshoots, and coaches peers"}
  - {code: L4, title: Lead Operator, scope: "a line / process end to end (IC terminal)", focus: "owns a line end to end and leads the floor without the title - IC terminal"}
  - {code: L5, title: Shift Supervisor, scope: "a shift crew", focus: "leads a shift crew and its safety, quality, and output"}
  - {code: L6, title: Area / Production Manager, scope: "a department across shifts", focus: "owns a department across shifts - its people, cost, and performance"}
  - {code: L7, title: Plant Operations Manager, scope: "the whole plant", focus: "owns whole-plant operations, safety, quality, and cost"}
competencies:
  # ---- Food Safety & Regulatory Compliance ----
  - theme: Pasteurization & flow-diversion control
    capability: FBM-01
    key_area: Food Safety & Regulatory Compliance
    key_attribute: Thermal Process Control
    anchor: fda-pmo
    anchor_why: "the flow-diversion device and its legal setpoints are the plant's public-health guarantee"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, fda-pmo], why: "FBM-01 P1 ('confirms the FDD holds forward flow only above cut-in...escalates any anomaly to a lead') is Dreyfus's novice band exactly matched to L1's scope (one machine, work checked): the PMO's cut-in/cut-out set points are given, not judged."}
      L2: {p: P2, sources: [dreyfus1980, fda-pmo], why: "FBM-01 P2 ('independently controls the flow-diversion function...handles routine nuisance diversions') is Dreyfus's advanced-beginner band at L2's process-area-across-a-shift scope: the legal set points are applied unsupervised for the routine case."}
      L3: {p: P3, sources: [dreyfus1980, fda-pmo], why: "FBM-01 P3 ('troubleshoots...sensor drift, low product level, restart transients...coaches operators') is the Dreyfus competent band at L3's multiple-areas scope: diagnosing why the kill step misbehaves, not just running it."}
      L4: {p: P4, sources: [sfia9, fda-pmo], why: "FBM-01 P4 ('sets the local diversion-control standard...is the person called when a diversion won't clear') is SFIA's Ensure/advise band -- the Lead Operator (IC-terminal, a line end to end) authors the line's divert-response procedure."}
      L5: {p: P4, sources: [sfia9, fda-pmo], why: "L5 holds the same P4 depth as L4 -- FBM-01's P4 bar is already the master-operator standard; Shift Supervisor's step is scope (a shift crew), auditing every operator's chart against the standard L4 already sets, not a deeper technical bar."}
      L6: {p: P5, sources: [sfia9, fda-pmo], why: "FBM-01 P5 ('governs flow-diversion control across the plant's thermal lines...sets the competency bar for who is cleared to hold the kill step') is SFIA's Initiate/influence band at L6's department-across-shifts scope."}
      L7: {p: P6, sources: [sfia9, fda-pmo], why: "FBM-01 P6 ('defines flow-diversion-control practice adopted beyond the plant') is SFIA's Set-strategy/inspire band -- the Plant Operations Manager signs the PMO compliance the whole plant is inspected against."}
    evidence:
      L1: "States the legal cut-in temperature for the product running."
      L2: "Clears a routine divert and records its cause unprompted."
      L3: "Cracks a nuisance-divert pattern others cannot explain."
      L4: "Writes the divert-response procedure the line follows and teaches the chart to new operators."
      L5: "Surfaces crew-wide pasteurization compliance in the shift review."
      L6: "Drives divert rate down department-wide with a targeted FDD test-and-seal standard."
      L7: "Signs the PMO compliance the plant is inspected against."
  - theme: Thermal-process legal limits & records
    capability: FBM-02
    key_area: Food Safety & Regulatory Compliance
    key_attribute: Thermal Process Control
    anchor: fda-pmo
    anchor_why: "the legally defensible thermal process and its records are what an inspector audits"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, fda-pmo], why: "FBM-02 P1 ('records the required time and temperature...flags a record that does not show the process was met') is Dreyfus's novice band at L1's one-unit, checked scope: transcription against a legal minimum someone else set."}
      L2: {p: P2, sources: [dreyfus1980, fda-pmo], why: "FBM-02 P2 ('independently confirms the running process against the correct legal minimum...knows which reading proves the process') is Dreyfus's advanced-beginner band at L2's shift scope."}
      L3: {p: P3, sources: [dreyfus1980, fda-pmo], why: "FBM-02 P3 ('owns the thermal-process records for a line or area...resolves gaps and discrepancies before they age') is the Dreyfus competent band at L3's multiple-areas scope -- autonomous judgment on what makes a record legally defensible."}
      L4: {p: P4, sources: [sfia9, fda-pmo], why: "FBM-02 P4 ('establishes the documented scheduled thermal process...is the person who signs that a lot's process is proven') is SFIA's Ensure/advise band -- the Lead Operator authors the line's record standard, IC terminal."}
      L5: {p: P4, sources: [sfia9, fda-pmo], why: "L5 keeps L4's P4 depth -- the Shift Supervisor audits the crew's records against the standard the Lead Operator already authored; scope widens to a crew, the record-authority bar does not deepen."}
      L6: {p: P5, sources: [sfia9, fda-pmo], why: "FBM-02 P5 ('governs the thermal-process-authority program across the plant...defends the minima and records to a regulator or auditor without gaps') is SFIA's Initiate/influence band at L6's department scope."}
      L7: {p: P6, sources: [sfia9, fda-pmo], why: "FBM-02 P6 ('sets thermal-process-legality practice others adopt') is SFIA's Set-strategy/inspire band -- the plant's authority on thermal-process legality."}
    evidence:
      L1: "Reads the required minimum hold temperature off the process record."
      L2: "Catches and reports an out-of-limit hold time without prompting."
      L3: "Defends a borderline record with the supporting evidence."
      L4: "Sets the recordkeeping standard an inspector can follow end to end."
      L5: "Signs off the crew's thermal records as inspection-ready."
      L6: "Closes record gaps before an audit finds them."
      L7: "Is the plant's authority on thermal-process legality."
  - theme: HACCP plan & CCP monitoring
    capability: FBM-03
    key_area: Food Safety & Regulatory Compliance
    key_attribute: Food Safety Systems
    anchor: codex-haccp
    anchor_why: "CCP monitoring is the systematic guard against food-safety hazards"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, codex-haccp], why: "FBM-03 P1 ('monitors an assigned CCP on schedule...immediately notifies a lead and holds product') is Dreyfus's novice band at L1's one-CCP, checked scope -- executing Codex's monitoring principle exactly."}
      L2: {p: P2, sources: [dreyfus1980, codex-haccp], why: "FBM-03 P2 ('independently monitors the CCPs for a line...initiates the documented corrective action') is Dreyfus's advanced-beginner band at L2's shift scope."}
      L3: {p: P3, sources: [dreyfus1980, nacmcf1998], why: "FBM-03 P3 ('verifies monitoring is happening as written...handles the non-routine deviation without a supervisor') is the Dreyfus competent band at L3's multiple-areas scope -- NACMCF's corrective-action principle exercised on the ambiguous case."}
      L4: {p: P4, sources: [sfia9, nacmcf1998], why: "FBM-03 P4 ('builds the HACCP plan...writes the monitoring and corrective-action procedures others follow') is SFIA's Ensure/advise band -- the Lead Operator authors the line's HACCP plan, IC terminal."}
      L5: {p: P4, sources: [sfia9, nacmcf1998], why: "L5 keeps L4's P4 plan-authorship depth -- the Shift Supervisor verifies the crew's monitoring and owns corrective-action closure against the plan L4 already built; scope, not depth, widens to a crew."}
      L6: {p: P5, sources: [sfia9, nacmcf1998], why: "FBM-03 P5 ('governs the HACCP program across the plant...leads the HACCP team, owns validation...and reassessment') is SFIA's Initiate/influence band at L6's department scope."}
      L7: {p: P6, sources: [sfia9, codex-haccp], why: "FBM-03 P6 ('advances HACCP practice beyond the plant') is SFIA's Set-strategy/inspire band -- accountable for the plant's HACCP validity at audit."}
    evidence:
      L1: "Knows which step on the line is a CCP."
      L2: "Takes the first corrective action on a CCP deviation without waiting."
      L3: "Judges a borderline CCP reading correctly under pressure."
      L4: "Writes the CCP-monitoring procedure the line runs to and teaches it to the crew."
      L5: "Signs the crew's CCP verification records."
      L6: "Catches a hazard the current plan misses before it reaches product."
      L7: "Is accountable for the plant's HACCP validity at audit."
  - theme: Preventive controls & PCQI oversight
    capability: FBM-04
    key_area: Food Safety & Regulatory Compliance
    key_attribute: Food Safety Systems
    anchor: fsma-pc-117c
    anchor_why: "preventive controls and a qualified individual own the food-safety plan above HACCP"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, fsma-pc-117c], why: "FBM-04 P1 ('carries out an assigned preventive-control monitoring or verification task...reports the finding to the qualified individual') is Dreyfus's novice band at L1's one-control, checked scope."}
      L2: {p: P2, sources: [dreyfus1980, fsma-pc-117c], why: "FBM-04 P2 ('independently performs the monitoring and verification activities the food-safety plan assigns...recognizes when a preventive control is out of control') is Dreyfus's advanced-beginner band at L2's shift scope."}
      L3: {p: P3, sources: [dreyfus1980, fsma-pc-117c], why: "FBM-04 P3 ('owns execution of the preventive controls for an area...coaches others on what each control is protecting against') is the Dreyfus competent band at L3's multiple-areas scope."}
      L4: {p: P4, sources: [sfia9, fsma-pc-117c], why: "FBM-04 P4 ('serves as a preventive-controls qualified individual...writes and owns the food-safety plan, validates the preventive controls') is SFIA's Ensure/advise band -- the exact PCQI authorship 21 CFR 117 Subpart C requires, at Lead Operator's line scope."}
      L5: {p: P4, sources: [sfia9, fsma-pc-117c], why: "L5 keeps L4's P4 PCQI-authorship depth -- the Shift Supervisor holds the crew's food-safety plan current against the plan L4 wrote, not a deeper qualified-individual bar."}
      L6: {p: P5, sources: [sfia9, fsma-pc-117c], why: "FBM-04 P5 ('governs the preventive-controls program plant-wide...leads reanalysis on the required cadence') is SFIA's Initiate/influence band at L6's department scope."}
      L7: {p: P6, sources: [sfia9, fsma-pc-117c], why: "FBM-04 P6 ('advances preventive-controls practice beyond the plant') is SFIA's Set-strategy/inspire band -- the plant's qualified authority on the food-safety plan."}
    evidence:
      L1: "Follows a preventive-control monitoring procedure as written."
      L2: "Reports a preventive-control lapse before it recurs."
      L3: "Decides correctly whether a preventive control held."
      L4: "Writes and validates the line's preventive-control monitoring procedure as its PCQI."
      L5: "Holds the crew's food-safety plan current for the shift."
      L6: "Defines a preventive control other areas adopt."
      L7: "Is the plant's qualified authority on the food-safety plan."
  - theme: Environmental monitoring & pathogen control
    capability: FBM-05
    key_area: Food Safety & Regulatory Compliance
    key_attribute: Contamination Control
    anchor: fda-listeria2017
    anchor_why: "environmental monitoring finds and eliminates pathogens before they reach product"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, fda-listeria2017], why: "FBM-05 P1 ('collects environmental swabs at the assigned sites and zones using correct technique...records the sampling') is Dreyfus's novice band at L1's checked scope."}
      L2: {p: P2, sources: [dreyfus1980, fda-listeria2017], why: "FBM-05 P2 ('independently executes the environmental sampling plan...maintains zone separation...flags a presumptive positive') is Dreyfus's advanced-beginner band at L2's shift scope."}
      L3: {p: P3, sources: [dreyfus1980, fda-listeria2017], why: "FBM-05 P3 ('interprets results and trends, drives the vectoring and seek-and-destroy response') is the Dreyfus competent band at L3's multiple-areas scope."}
      L4: {p: P4, sources: [sfia9, fda-listeria2017], why: "FBM-05 P4 ('designs the environmental monitoring program for a process...defines the corrective-sanitation and investigation procedure others follow') is SFIA's Ensure/advise band -- the Lead Operator authors the line's zoned program."}
      L5: {p: P4, sources: [sfia9, fda-listeria2017], why: "L5 keeps L4's P4 program-design depth -- the Shift Supervisor closes the crew's positive findings against the program L4 designed; scope, not depth, widens to a crew."}
      L6: {p: P5, sources: [sfia9, fda-listeria2017], why: "FBM-05 P5 ('governs environmental pathogen control plant-wide...owns the zoning scheme...and drives harborage elimination from trend data') is SFIA's Initiate/influence band at L6's department scope."}
      L7: {p: P6, sources: [sfia9, fda-listeria2017], why: "FBM-05 P6 ('advances environmental-pathogen-control practice beyond the plant') is SFIA's Set-strategy/inspire band -- accountable for the plant's Listeria-control posture."}
    evidence:
      L1: "Swabs a Zone 1 site correctly on the sampling map."
      L2: "Executes the presumptive-positive response steps unprompted."
      L3: "Traces a recurring positive to its harborage site."
      L4: "Designs the line's environmental-monitoring program: sites, zones, frequencies."
      L5: "Closes out the crew's positive findings to negative."
      L6: "Redesigns zoning to eliminate a recurring pathogen niche."
      L7: "Is accountable for the plant's Listeria-control posture."
  - theme: Allergen control & changeover
    capability: FBM-06
    key_area: Food Safety & Regulatory Compliance
    key_attribute: Contamination Control
    anchor: falcpa2004
    anchor_why: "undeclared allergens are a leading recall cause, so segregation and changeover must be controlled"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, falcpa2004], why: "FBM-06 P1 ('follows the allergen-changeover checklist...verifies the correct label and packaging are staged') is Dreyfus's novice band at L1's checked scope."}
      L2: {p: P2, sources: [dreyfus1980, falcpa2004], why: "FBM-06 P2 ('independently executes allergen changeovers across a shift...checks labels against the product') is Dreyfus's advanced-beginner band at L2's shift scope."}
      L3: {p: P3, sources: [dreyfus1980, falcpa2004], why: "FBM-06 P3 ('owns allergen control for a line or area...investigates a suspected cross-contact') is the Dreyfus competent band at L3's multiple-areas scope."}
      L4: {p: P4, sources: [sfia9, falcpa2004], why: "FBM-06 P4 ('sets the allergen-control standard for a process...validates changeover cleaning') is SFIA's Ensure/advise band -- the Lead Operator authors the line's segregation and validation procedure."}
      L5: {p: P4, sources: [sfia9, falcpa2004], why: "L5 keeps L4's P4 validation depth -- the Shift Supervisor verifies every crew changeover against the matrix L4 already set; scope widens to a crew, not the technical bar."}
      L6: {p: P5, sources: [sfia9, falcpa2004], why: "FBM-06 P5 ('governs the allergen program plant-wide...owns the allergen matrix, production sequencing, the changeover-validation regime') is SFIA's Initiate/influence band at L6's department scope."}
      L7: {p: P6, sources: [sfia9, falcpa2004], why: "FBM-06 P6 ('advances allergen-control practice beyond the plant') is SFIA's Set-strategy/inspire band -- accountable for zero undeclared-allergen escapes plant-wide."}
    evidence:
      L1: "Confirms the correct label is loaded for the product."
      L2: "Completes a validated allergen changeover across the shift alone."
      L3: "Resequences a run to avoid an allergen conflict."
      L4: "Sets and validates the line's allergen changeover-cleaning procedure."
      L5: "Verifies every crew changeover against the allergen matrix."
      L6: "Eliminates a cross-contact risk by redesigning the production sequence."
      L7: "Is accountable for zero undeclared-allergen escapes plant-wide."
