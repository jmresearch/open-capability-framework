  # ---- Leadership, People & Continuous Improvement ----
  - theme: Operator training & development
    capability: LI-01
    key_area: Leadership, People & Continuous Improvement
    key_attribute: People Leadership & Development
    anchor: twi-job-instruction
    anchor_why: "structured job instruction is how operator craft is reliably transferred"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, twi-job-instruction], why: "LI-01 P1 ('receptive to mentoring; shares what they learn') is Dreyfus's novice band -- Operator I (one task, under direction) is still primarily a mentee, passing along a task step the TWI 'show, tell, do, check' way without yet owning anyone's development."}
      L2: {p: P1, sources: [dreyfus1980, twi-job-instruction], why: "L2 holds LI-01's P1 depth -- Operator II is independent on their own station (craft competencies step to P2 here), but teaching another person is still done with a lead's support, not yet the unaided 'helps onboard teammates' of P2; technical independence and teaching independence are different maturities."}
      L3: {p: P2, sources: [dreyfus1980, twi-job-instruction], why: "LI-01 P2 ('helps onboard teammates; informally mentors juniors') is Dreyfus's advanced-beginner band at L3's multiple-areas scope -- qualifying a new operator unaided is informal onboarding, not yet the deliberate, growth-oriented coaching P3 requires."}
      L4: {p: P3, sources: [dreyfus1980, twi-job-instruction], why: "LI-01 P3 ('coaches engineers with growth-oriented feedback; measurably improves a team's skill') is the Dreyfus competent band -- Lead Operator (IC terminal) turns a specific operator's skill gap around through deliberate coaching with a measurable result, still an individual coaching act, not a training program."}
      L5: {p: P4, sources: [sfia9, twi-job-instruction], why: "LI-01 P4 ('develops future leads across teams; shapes hiring and onboarding') is SFIA's Ensure/advise band -- Shift Supervisor formalizes into the title and now owns developing the crew's own future leads and its qualification records, the step this ladder's scope_note calls out as leadership 'formalizing at L5.'"}
      L6: {p: P5, sources: [sfia9, twi-job-instruction], why: "LI-01 P5 ('develops senior engineers and leaders; builds culture deliberately') is SFIA's Initiate/influence band at L6's department scope -- building a capability pipeline other areas adopt."}
      L7: {p: P6, sources: [sfia9, twi-job-instruction], why: "LI-01 P6 ('develops the next generation of top talent; legacy outlasts tenure') is SFIA's Set-strategy/inspire band -- sets how the plant grows operator talent, an operator-development system that outlasts any one manager."}
    evidence:
      L1: "Walks a peer through a single task step by step."
      L2: "Onboards a peer to their area with a lead's support."
      L3: "Qualifies a new operator on their area unaided."
      L4: "Coaches a struggling operator's specific skill gap until the change is measurable in their output."
      L5: "Grooms a crew member into the next Lead Operator and owns the crew's qualification records."
      L6: "Builds a capability pipeline other areas adopt."
      L7: "Builds an operator-development system that keeps producing leads after they've moved on."
  - theme: Coaching & performance feedback
    capability: EM-01
    key_area: Leadership, People & Continuous Improvement
    key_attribute: People Leadership & Development
    anchor: grove1983-high-output-management
    anchor_why: "feedback and coaching are how output is driven through people"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, grove1983-high-output-management], why: "EM-01 P1 ('gathers performance inputs and drafts feedback under a manager's guidance') is Dreyfus's novice band -- Operator I offers a peer specific, in-the-moment feedback, still following someone else's judgment on what to say."}
      L2: {p: P1, sources: [dreyfus1980, grove1983-high-output-management], why: "L2 holds EM-01's P1 depth -- Operator II is independent on their own station, but giving feedback that actually changes a peer's performance is still occasional and unstructured, short of P2's standard review cadence."}
      L3: {p: P2, sources: [dreyfus1980, grove1983-high-output-management], why: "EM-01 P2 ('runs standard performance cycles and holds direct reports accountable with normal review') is Dreyfus's advanced-beginner band at L3's multiple-areas scope -- turning a peer's recurring miss around through repeatable, not one-off, coaching."}
      L4: {p: P3, sources: [dreyfus1980, grove1983-high-output-management], why: "EM-01 P3 ('independently manages underperformance and difficult cases through to clear resolution') is the Dreyfus competent band -- Lead Operator holds a peer accountable constructively before it escalates, without a supervisor's backstop."}
      L5: {p: P4, sources: [sfia9, grove1983-high-output-management], why: "EM-01 P4 ('defines accountability practices other managers adopt and coaches them through hard cases') is SFIA's Ensure/advise band -- Shift Supervisor formally owns fair performance feedback for the whole crew, Grove's one-on-one/appraisal cadence now run as the job, not a peer favor."}
      L6: {p: P5, sources: [sfia9, grove1983-high-output-management], why: "EM-01 P5 ('sets the org's performance philosophy and anticipates systemic accountability gaps') is SFIA's Initiate/influence band at L6's department scope -- defining the feedback practice other supervisors adopt."}
      L7: {p: P6, sources: [sfia9, grove1983-high-output-management], why: "EM-01 P6 ('defines what fair, effective performance management means and influences the field externally') is SFIA's Set-strategy/inspire band -- sets how the plant develops and holds people accountable."}
    evidence:
      L1: "Offers a peer specific, in-the-moment feedback."
      L2: "Helps a struggling peer improve on a specific task."
      L3: "Turns a peer's recurring miss around through repeatable coaching."
      L4: "Holds a peer accountable constructively before it escalates."
      L5: "Owns fair performance feedback for the crew."
      L6: "Defines the feedback practice other supervisors adopt."
      L7: "Sets how the plant develops and holds people accountable."
  - theme: Shift leadership & crew coordination
    capability: LI-08
    key_area: Leadership, People & Continuous Improvement
    key_attribute: People Leadership & Development
    anchor: hersey-blanchard1969
    anchor_why: "leading a shift means adapting direction to the crew and the moment, and modeling the safety behaviors others follow"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, hersey-blanchard1969], why: "LI-08 P1 ('recognizes that different people need different support; adjusts approach when prompted by feedback') is Dreyfus's novice band -- Operator I models the crew's norms and calls out an unsafe act in the moment, without yet reading readiness unaided."}
      L2: {p: P1, sources: [dreyfus1980, hersey-blanchard1969], why: "L2 holds LI-08's P1 depth -- Operator II reinforces a rule with peers informally, still reactive rather than the deliberate directing/coaching/supporting/delegating match to readiness P2 requires."}
      L3: {p: P2, sources: [dreyfus1980, hersey-blanchard1969], why: "LI-08 P2 ('matches direction and support to each person's readiness per task...tells technical problems from adaptive ones') is Dreyfus's advanced-beginner band at L3's multiple-areas scope -- rallying the crew through a single upset and calling a stand-down on a real hazard is a deliberate, situational style match for one hard moment, not yet sustained across a wide range of people and situations."}
      L4: {p: P3, sources: [dreyfus1980, hersey-blanchard1969], why: "LI-08 P3 ('flexes skillfully across a wide range of people and hard situations without losing a grounded center; refuses to force technical fixes onto adaptive challenges') is the Dreyfus competent band -- Lead Operator sustains that style-flexing across the whole line's varied people and problems, IC terminal, not yet coaching other leaders to do it (P4)."}
      L5: {p: P4, sources: [sfia9, hersey-blanchard1969], why: "LI-08 P4 ('coaches other leaders to read what a person, team, or moment needs; adapts across diverse teams while staying recognizably consistent in values') is SFIA's Ensure/advise band -- Shift Supervisor now formally runs the crew day to day and owns its safety and delivery outcomes, the leadership formalization this ladder's L5 step is built for."}
      L6: {p: P5, sources: [sfia9, hersey-blanchard1969], why: "LI-08 P5 ('develops adaptive leadership as an organizational discipline...leaders diagnose technical-versus-adaptive at scale') is SFIA's Initiate/influence band at L6's department scope -- setting the crew-leadership and behavior-based-safety practice other shifts adopt."}
      L7: {p: P6, sources: [sfia9, hersey-blanchard1969], why: "LI-08 P6 ('shapes an adaptive, grounded leadership culture across an organization...emulated beyond the organization') is SFIA's Set-strategy/inspire band -- accountable for how the whole plant is led and how safely it runs."}
    evidence:
      L1: "Models the crew's norms and calls out an unsafe act in the moment."
      L2: "Keeps the area's work moving and reinforces a rule with peers informally."
      L3: "Rallies the crew through an upset and calls a stand-down on a real hazard."
      L4: "Flexes between directing, coaching, and delegating across the line's operators and situations without losing the safety center."
      L5: "Runs the crew day to day and owns its safety and delivery outcomes."
      L6: "Sets the crew-leadership and behavior-based-safety practice other shifts adopt."
      L7: "Is accountable for how the whole plant is led and how safely it runs."
  - theme: Pre-shift huddles & shift handover
    capability: CC-01
    key_area: Leadership, People & Continuous Improvement
    key_attribute: Communication & Coordination
    anchor: ohno1988-tps
    anchor_why: "a disciplined huddle and handover prevent information loss between shifts"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, ohno1988-tps], why: "CC-01 P1 ('communicates status clearly; documentation is accurate') is Dreyfus's novice band -- Operator I hands over their own machine's status accurately, the baseline clarity discipline at L1's checked scope."}
      L2: {p: P2, sources: [dreyfus1980, ohno1988-tps], why: "CC-01 P2 ('writes clear design notes, runbooks and PRs; explains trade-offs without overselling') is Dreyfus's advanced-beginner band -- Operator II runs a clean area-to-area handover unprompted across a full shift."}
      L3: {p: P2, sources: [dreyfus1980, ohno1988-tps], why: "L3 holds CC-01's P2 depth -- Senior Operator flags the one handover item that prevents a downstream miss across multiple areas; the judgment sharpens with scope, but it is still routine handover communication, not yet the decision-driving documents P3 requires."}
      L4: {p: P3, sources: [dreyfus1980, ohno1988-tps], why: "CC-01 P3 ('writes design docs that drive decisions; translates technical risk for non-technical stakeholders') is the Dreyfus competent band -- Lead Operator runs the huddle that sets and decides the line's priorities for the shift, IC terminal."}
      L5: {p: P4, sources: [sfia9, ohno1988-tps], why: "CC-01 P4 ('expert at making complex capability/risk legible to executives...RFCs align orgs') is SFIA's Ensure/advise band -- Shift Supervisor formally runs the crew huddle and the shift-to-shift handover, aligning the whole crew, not just a line."}
      L6: {p: P5, sources: [sfia9, ohno1988-tps], why: "CC-01 P5 ('strategy memos leadership acts on; org-wide and external reach') is SFIA's Initiate/influence band at L6's department scope -- standardizing the handover other shifts adopt."}
      L7: {p: P6, sources: [sfia9, ohno1988-tps], why: "CC-01 P6 ('a clarifying voice at company scale; externally recognized') is SFIA's Set-strategy/inspire band -- sets how information flows across the plant's shifts."}
    evidence:
      L1: "Hands over their machine's status accurately."
      L2: "Runs a clean area-to-area handover unprompted."
      L3: "Flags the one handover item that prevents a downstream miss."
      L4: "Leads a huddle that sets and decides the line's priorities for the shift."
      L5: "Runs the crew huddle and shift-to-shift handover."
      L6: "Standardizes a handover format other shifts adopt."
      L7: "Sets how information flows across the plant's shifts."
  - theme: Escalation & cross-functional coordination
    capability: CC-03
    key_area: Leadership, People & Continuous Improvement
    key_attribute: Communication & Coordination
    anchor: lencioni2002-fivedysfunctions
    anchor_why: "knowing when to escalate and how to pull in the right function contains problems early"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, lencioni2002-fivedysfunctions], why: "CC-03 P1 ('responsive to feedback; pairs willingly; asks for help appropriately') is Dreyfus's novice band -- Operator I raises an issue to the right person promptly, at L1's checked scope."}
      L2: {p: P2, sources: [dreyfus1980, lencioni2002-fivedysfunctions], why: "CC-03 P2 ('collaborates smoothly with adjacent functions; handles disagreement constructively') is Dreyfus's advanced-beginner band -- Operator II coordinates with maintenance or QA to clear a routine issue alone."}
      L3: {p: P2, sources: [dreyfus1980, lencioni2002-fivedysfunctions], why: "L3 holds CC-03's P2 depth -- Senior Operator pulls the right functions together to solve a cross-area problem across multiple areas; still collaborating within an established relationship, not yet resolving contested accountability (P3)."}
      L4: {p: P3, sources: [dreyfus1980, lencioni2002-fivedysfunctions], why: "CC-03 P3 ('builds strong cross-team relationships; resolves friction directly') is the Dreyfus competent band -- Lead Operator decides, case by case, when and how the line escalates and resolves the friction that comes with it, IC terminal."}
      L5: {p: P4, sources: [sfia9, lencioni2002-fivedysfunctions], why: "CC-03 P4 ('expert at aligning teams with competing priorities; mediates disputes between senior people') is SFIA's Ensure/advise band -- Shift Supervisor formally runs the crew's response when a line goes down or a quality hold hits, pulling in maintenance and QA and mediating their competing priorities."}
      L6: {p: P5, sources: [sfia9, lencioni2002-fivedysfunctions], why: "CC-03 P5 ('creates the forums and processes through which collaboration happens') is SFIA's Initiate/influence band at L6's department scope -- defining the escalation protocol other shifts adopt."}
      L7: {p: P6, sources: [sfia9, lencioni2002-fivedysfunctions], why: "CC-03 P6 ('builds coalitions at company scale and externally') is SFIA's Set-strategy/inspire band -- sets how the plant coordinates in a major event."}
    evidence:
      L1: "Raises an issue to the right person promptly."
      L2: "Coordinates with maintenance or QA to clear a routine issue alone."
      L3: "Pulls the right functions together to solve a cross-area problem."
      L4: "Decides when and how the line escalates, and resolves the friction that follows."
      L5: "Runs the crew's response when a line goes down or a quality hold hits, pulling in maintenance and QA."
      L6: "Defines the escalation protocol other shifts adopt."
      L7: "Sets how the plant coordinates in a major event."
  - theme: OEE & loss elimination
    capability: SCM-07
    key_area: Leadership, People & Continuous Improvement
    key_attribute: Continuous Improvement & Cost
    anchor: nakajima1988-tpm
    anchor_why: "OEE makes production loss visible so it can be eliminated"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, nakajima1988-tpm], why: "SCM-07 P1 ('performs defined production tasks and records output under supervision') is Dreyfus's novice band at L1's checked scope, instantiated as logging a downtime reason accurately against the run."}
      L2: {p: P2, sources: [dreyfus1980, nakajima1988-tpm], why: "SCM-07 P2 ('independently runs standard production lines, handling routine variation with review') is Dreyfus's advanced-beginner band -- naming the shift's biggest loss from the OEE data alone."}
      L3: {p: P3, sources: [dreyfus1980, nakajima1988-tpm], why: "SCM-07 P3 ('autonomously manages complex production with ambiguous disruptions, holding output and quality') is the Dreyfus competent band -- recovering measurable OEE by eliminating a specific loss across multiple areas."}
      L4: {p: P4, sources: [sfia9, nakajima1988-tpm], why: "SCM-07 P4 ('defines production-operations methods others adopt and resolves problems others can't') is SFIA's Ensure/advise band -- Lead Operator sets the OEE and loss-tracking standard the line runs to, IC terminal."}
      L5: {p: P4, sources: [sfia9, nakajima1988-tpm], why: "L5 keeps L4's P4 standard-setting depth -- the Shift Supervisor drives the crew's OEE up against a target using the tracking standard L4 already set."}
      L6: {p: P5, sources: [sfia9, nakajima1988-tpm], why: "SCM-07 P5 ('sets manufacturing-operations strategy and anticipates how production capability must evolve') is SFIA's Initiate/influence band at L6's department scope -- removing a systemic loss other areas adopt the fix for."}
      L7: {p: P6, sources: [sfia9, nakajima1988-tpm], why: "SCM-07 P6 ('defines best-in-class manufacturing operations and is externally recognized for it') is SFIA's Set-strategy/inspire band -- sets the plant's OEE and improvement agenda."}
    evidence:
      L1: "Logs a downtime reason accurately against the run."
      L2: "Names the shift's biggest loss from the OEE data alone."
      L3: "Recovers measurable OEE by eliminating a specific loss."
      L4: "Sets the OEE and loss-tracking standard the line runs to."
      L5: "Drives the crew's OEE up against a target."
      L6: "Removes a systemic loss other areas adopt the fix for."
      L7: "Sets the plant's OEE and improvement agenda."
  - theme: Root-cause problem solving
    capability: SUP-05
    key_area: Leadership, People & Continuous Improvement
    key_attribute: Continuous Improvement & Cost
    anchor: ohno1988-tps
    anchor_why: "structured root-cause analysis permanently removes recurring problems"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, ohno1988-tps], why: "SUP-05 P1 ('gathers incident details and documents findings for a reviewer to analyze') is Dreyfus's novice band at L1's checked scope -- documenting a problem's details for someone else's analysis."}
      L2: {p: P2, sources: [dreyfus1980, ohno1988-tps], why: "SUP-05 P2 ('independently runs root-cause analysis on standard recurring problems with normal review') is Dreyfus's advanced-beginner band -- completing a basic 5-Why to a plausible root cause alone."}
      L3: {p: P3, sources: [dreyfus1980, ohno1988-tps], why: "SUP-05 P3 ('untangles ambiguous, systemic root causes and is the go-to for elusive recurring issues') is the Dreyfus competent band -- cracking a systemic root cause others could not find, across multiple areas."}
      L4: {p: P4, sources: [sfia9, ohno1988-tps], why: "SUP-05 P4 ('defines the problem-management methodology others adopt and cracks the hardest root causes') is SFIA's Ensure/advise band -- Lead Operator sets the root-cause standard the line uses, IC terminal."}
      L5: {p: P4, sources: [sfia9, ohno1988-tps], why: "L5 keeps L4's P4 methodology-authorship depth -- the Shift Supervisor confirms a crew countermeasure actually held against the standard L4 already set."}
      L6: {p: P5, sources: [sfia9, ohno1988-tps], why: "SUP-05 P5 ('sets problem-management strategy and anticipates systemic failures before they recur') is SFIA's Initiate/influence band at L6's department scope -- preventing a class of failure before it recurs."}
      L7: {p: P6, sources: [sfia9, ohno1988-tps], why: "SUP-05 P6 ('defines how the discipline practices root-cause management and shapes industry approaches') is SFIA's Set-strategy/inspire band -- sets how the plant permanently removes problems."}
    evidence:
      L1: "Documents a problem's details for analysis."
      L2: "Completes a basic 5-Why to a plausible root cause alone."
      L3: "Cracks a systemic root cause others could not find."
      L4: "Sets the root-cause standard the line uses."
      L5: "Confirms a crew countermeasure actually held."
      L6: "Prevents a class of failure before it recurs."
      L7: "Sets how the plant permanently removes problems."
  - theme: Production scheduling & changeover
    capability: SCM-08
    key_area: Leadership, People & Continuous Improvement
    key_attribute: Continuous Improvement & Cost
    anchor: ascm-scor
    anchor_why: "scheduling and fast changeover convert the plan into on-time output"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, ascm-scor], why: "SCM-08 P1 ('updates schedules and logs shop-floor status from given inputs under guidance') is Dreyfus's novice band -- Operator I executes a changeover step by the SMED sheet, at L1's checked scope."}
      L2: {p: P2, sources: [dreyfus1980, ascm-scor], why: "SCM-08 P2 ('independently builds routine production schedules and manages standard sequencing with review') is Dreyfus's advanced-beginner band -- Operator II completes a routine changeover to time alone across a shift."}
      L3: {p: P2, sources: [dreyfus1980, ascm-scor], why: "L3 holds SCM-08's P2 depth -- Senior Operator rebalances the run to protect on-time output across multiple areas; still executing the plan under given constraints, not yet the volatile-constraint scheduling authorship P3 requires."}
      L4: {p: P3, sources: [dreyfus1980, shingo1985-smed], why: "SCM-08 P3 ('autonomously schedules under volatile constraints, rebalancing the floor to hold commitments') is the Dreyfus competent band -- Lead Operator sets the changeover sequencing the line uses, applying Shingo's SMED discipline to hold commitments, IC terminal."}
      L5: {p: P4, sources: [sfia9, shingo1985-smed], why: "SCM-08 P4 ('defines scheduling and control methods others adopt and resolves the hardest sequencing problems') is SFIA's Ensure/advise band -- Shift Supervisor holds crew changeover times and schedule to the target the standard already sets, formally owning the crew's throughput."}
      L6: {p: P5, sources: [sfia9, ascm-scor], why: "SCM-08 P5 ('sets shop-floor scheduling strategy and anticipates how control systems must evolve') is SFIA's Initiate/influence band at L6's department scope -- cutting changeover loss through an SMED standard other shifts adopt."}
      L7: {p: P6, sources: [sfia9, ascm-scor], why: "SCM-08 P6 ('defines leading production-scheduling practice for the field and is sought externally for it') is SFIA's Set-strategy/inspire band -- sets how the plant schedules and changes over."}
    evidence:
      L1: "Executes a changeover step by the SMED sheet."
      L2: "Completes a routine changeover to time alone."
      L3: "Rebalances the run to protect on-time output."
      L4: "Sets the changeover and sequencing standard the line uses."
      L5: "Holds crew changeover times and schedule to target."
      L6: "Cuts changeover loss through an SMED standard other shifts adopt."
      L7: "Sets how the plant schedules and changes over."
  - theme: Cost, labor & budget ownership
    capability: EM-06
    key_area: Leadership, People & Continuous Improvement
    key_attribute: Continuous Improvement & Cost
    anchor: horngren-costaccounting
    anchor_why: "cost and labor ownership is how operations are held to budget"
    mappings:
      L1: {p: P1, sources: [dreyfus1980, horngren-costaccounting], why: "EM-06 P1 ('tracks spend and processes vendor invoices under guidance') is Dreyfus's novice band -- Operator I logs yield and labor data accurately for the shift, at L1's checked scope."}
      L2: {p: P1, sources: [dreyfus1980, horngren-costaccounting], why: "L2 holds EM-06's P1 depth -- Operator II is independent on their own station, but pointing out a waste or overtime driver is still tracking/reporting, short of P2's managing a budget with normal review."}
      L3: {p: P2, sources: [dreyfus1980, horngren-costaccounting], why: "EM-06 P2 ('manages a team budget and standard vendor relationships with normal review') is Dreyfus's advanced-beginner band at L3's multiple-areas scope -- cutting a controllable cost on the floor unprompted, still within a set budget someone else owns."}
      L4: {p: P3, sources: [dreyfus1980, horngren-costaccounting], why: "EM-06 P3 ('independently controls budgets under pressure and negotiates difficult vendor terms') is the Dreyfus competent band -- Lead Operator sets the yield and labor-efficiency standard the line runs to, IC terminal."}
      L5: {p: P4, sources: [sfia9, horngren-costaccounting], why: "EM-06 P4 ('defines budget and vendor practices others adopt and rescues failing vendor relationships') is SFIA's Ensure/advise band -- Shift Supervisor formally manages the crew to its labor and cost targets, owning a real budget line for the first time."}
      L6: {p: P5, sources: [sfia9, horngren-costaccounting], why: "EM-06 P5 ('sets org-wide budget and vendor strategy and anticipates cost and supplier risks') is SFIA's Initiate/influence band at L6's department scope -- driving a labor-variance improvement other areas adopt."}
      L7: {p: P6, sources: [sfia9, horngren-costaccounting], why: "EM-06 P6 ('defines exemplary budget and vendor management for the field and influences practice') is SFIA's Set-strategy/inspire band -- accountable for the plant's operations P&L."}
    evidence:
      L1: "Logs yield and labor data accurately for the shift."
      L2: "Points out a waste or overtime driver on their area."
      L3: "Cuts a controllable cost on the floor unprompted."
      L4: "Sets the yield and labor-efficiency standard the line runs to."
      L5: "Manages the crew to its labor and cost targets."
      L6: "Drives a labor-variance improvement other areas adopt."
      L7: "Is accountable for the plant's operations P&L."
