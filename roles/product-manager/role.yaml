      P3: {p: P3, sources: [moore1991-crossing-chasm, sfia9], why: "PM-03 P3 ('Independently reads ambiguous markets and frames defensible positioning implications.') is the terminal, capability-owning bar: independently reading ambiguous markets and framing defensible positioning implications is exactly the judgment Moore's chasm model requires — placing a market correctly relative to the chasm when the evidence is not clear-cut."}
      P4: {p: P4, sources: [moore1991-crossing-chasm, larson2021-staffeng], why: "PM-03 P4 ('Defines the analytical approach others follow and decodes confusing competitive dynamics.') is Staff-scope: defining the analytical approach others follow and decoding confusing competitive dynamics is one person's market-reading framework becoming codified for a team."}
