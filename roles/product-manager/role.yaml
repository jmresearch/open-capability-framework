      P2: {p: P2, sources: [babok3, iso29148, sfia9], why: "PM-07 P2 ('Authors complete, testable specs for standard features with normal review.') matches independent operation: authoring complete, testable specs for standard features with normal review applies BABOK's elicitation and life-cycle-management practices as given, to a scoped and familiar feature."}
      P3: {p: P3, sources: [babok3, iso29148, sfia9], why: "PM-07 P3 ('Independently specifies ambiguous, cross-cutting features and resolves edge cases cleanly.') is the terminal, capability-owning bar: independently specifying ambiguous, cross-cutting features and resolving edge cases cleanly requires ISO 29148's requirement-quality criteria — unambiguous, verifiable, necessary — applied as judgment to genuinely hard cases, not a checklist for routine ones."}
      P4: {p: P4, sources: [babok3, iso29148, larson2021-staffeng], why: "PM-07 P4 ('Defines specification standards others adopt and untangles the hardest requirement conflicts.') is Staff-scope: defining specification standards others adopt and untangling the hardest requirement conflicts is BABOK's competency areas moving from individual application to one person's codified standard for a team."}
      P5: {p: P5, sources: [babok3, iso29148, larson2021-staffeng], why: "PM-07 P5 ('Sets specification strategy across teams and anticipates downstream definition needs.') matches Principal authority: setting specification strategy across teams and anticipating downstream definition needs is organization-wide ownership of the definition bar, not one feature's requirements."}
      P6: {p: P6, sources: [babok3, iso29148, larson2021-staffeng], why: "PM-07 P6 ('Defines what excellent product specification means and influences the practice externally.') is company/portfolio scope: defining what excellent product specification means and influencing practice externally is the register a body-of-knowledge standard like ISO/IEC/IEEE 29148 itself occupies as an externally adopted reference."}
    evidence:
      P1: "Writes user stories with acceptance criteria from a lead's outline, and updates the spec twice as review catches gaps in the edge cases."
      P2: "Writes a one-pager that leads with the customer problem and success measure for a standard feature, and the build raises design questions rather than intent questions."
      P3: "Specifies a cross-cutting feature touching three systems, resolving edge cases the initial ask never anticipated, and a reviewer's comments on the spec prevent a rework two weeks later."
      P4: "Sets the definition-of-ready standard two other teams adopt, and catches an interface gap between two teams' specs that would have silently conflicted at integration."
      P5: "Owns what 'ready to build' means across the product org, and their document review is the quality gate a major initiative has to pass before engineering starts."
      P6: "Writes the founding narrative document for a new portfolio bet, with a hit rate on greenlit narratives the company has come to trust."
  - theme: "Backlog & delivery flow"
