  - theme: "Product narratives & written communication"
    capability: CC-01
    key_area: "Communication, Influence & Craft Leadership"
    key_attribute: "Communication"
    anchor: zinsser2006-onwritingwell
    anchor_why: "substituted for Bryar & Carr's Working Backwards (no bibliography entry) with Zinsser's classic clarity-in-writing reference for the baseline register, paired with Minto's pyramid principle for the decision-driving register — the same two-source pairing CC-01's own catalog levels already use."
    mappings:
      P1: {p: P1, sources: [zinsser2006-onwritingwell, minto1996-pyramid, sfia9], why: "CC-01 P1 ('Communicates status clearly; documentation is accurate.') is the guided bar: communicating status clearly with accurate documentation is Zinsser's baseline clarity discipline — say what happened, plainly."}
