      P3: {p: P3, sources: [zinsser2006-onwritingwell, minto1996-pyramid, sfia9], why: "CC-01 P3 ('Writes design docs that drive decisions; translates technical risk for non-technical stakeholders.') is the terminal, capability-owning bar: writing docs that drive decisions and translating technical risk for non-technical stakeholders requires Minto's answer-first, pyramid-structured argument — leading with the conclusion a decision-maker needs."}
      P4: {p: P4, sources: [zinsser2006-onwritingwell, minto1996-pyramid, larson2021-staffeng], why: "CC-01 P4 ('Expert at making complex capability/risk legible to executives without dumbing it down; RFCs align orgs.') is Staff-scope: making complex capability/risk legible to executives without dumbing it down, with RFCs that align orgs, is Minto's pyramid principle applied at the scale of documents that must persuade rooms full of stakeholders at once."}
      P5: {p: P5, sources: [zinsser2006-onwritingwell, minto1996-pyramid, larson2021-staffeng], why: "CC-01 P5 ('Strategy memos leadership acts on; org-wide and external reach.') matches Principal authority: strategy memos leadership acts on, with org-wide and external reach, is writing that changes org direction, not just informs it."}
      P6: {p: P6, sources: [zinsser2006-onwritingwell, minto1996-pyramid, larson2021-staffeng], why: "CC-01 P6 ('A clarifying voice at company scale; externally recognized.') is company/portfolio scope: being a clarifying voice at company scale, externally recognized, is the level Zinsser's decades of teaching writers aimed to reach — clarity that carries beyond one's own organization."}
    evidence:
      P1: "Writes a status update for their epic that says plainly what happened and what's next, without burying the headline in caveats."
      P2: "Writes a PRD for a standard feature that explains a trade-off honestly rather than overselling it, and engineers don't need to re-ask the intent."
      P3: "Writes a design doc that leads with the decision it's asking for and translates a technical risk into terms a non-technical stakeholder acts on correctly."
      P4: "Writes an RFC that aligns three teams' engineering leads on a shared approach, pre-wired against the objections a skeptic would raise."
      P5: "Writes a strategy memo that leadership funds a quarter's roadmap against, with reach beyond their own product organization."
      P6: "Is the clarifying voice the company turns to for its hardest external communications, recognized outside the company for writing that cuts through noise."
  - theme: "Executive communication"
    capability: CC-06
    key_area: "Communication, Influence & Craft Leadership"
    key_attribute: "Communication"
    anchor: minto1996-pyramid
