      P3: {p: P3, sources: [perri2018-escapingbuildtrap, sfia9], why: "CC-05 P3 ('Mediates technical disputes in their domain; finds the path that holds up.') is the terminal, capability-owning bar: mediating technical disputes in their domain and finding the path that holds up is stepping into dialogue when stakes, opinions, and emotions are all high — mediating, not just negotiating one's own position."}
      P4: {p: P4, sources: [perri2018-escapingbuildtrap, larson2021-staffeng], why: "CC-05 P4 ('Resolves high-stakes disagreements between senior stakeholders across orgs.') is Staff-scope: resolving high-stakes disagreements between senior stakeholders across orgs applies the same toolkit where the stakes and organizational distance are both highest."}
