      P3: {p: P3, sources: [patton2014-storymapping, reinertsen2009-flow, sfia9], why: "PM-08 P3 ('Independently sequences contested work and keeps the backlog coherent under churn.') is the terminal, capability-owning bar: independently sequencing contested work and keeping the backlog coherent under churn requires diagnosing delivery problems from flow data — batch size, queue buildup, aging WIP — and fixing the system rather than pushing the team, which both anchors argue is the real skill."}
      P4: {p: P4, sources: [patton2014-storymapping, reinertsen2009-flow, larson2021-staffeng], why: "PM-08 P4 ('Defines backlog practices others follow and resolves cross-team prioritization disputes.') is Staff-scope: defining backlog practices others follow and resolving cross-team prioritization disputes is one person's story map and flow discipline becoming a shared standard other teams adopt."}
      P5: {p: P5, sources: [patton2014-storymapping, reinertsen2009-flow, larson2021-staffeng], why: "PM-08 P5 ('Sets backlog-management strategy across products and anticipates capacity tensions.') matches Principal authority: setting backlog-management strategy across products and anticipating capacity tensions is org-wide flow ownership — the idea-to-live lead time — not one team's backlog."}
      P6: {p: P6, sources: [patton2014-storymapping, reinertsen2009-flow, larson2021-staffeng], why: "PM-08 P6 ('Defines backlog-management best practice for the discipline and is recognized for it.') is company/portfolio scope: defining backlog-management best practice for the discipline and being recognized for it is the register Patton's own story-mapping technique reached after publication — a company-wide default beyond one team."}
    evidence:
      P1: "Keeps their epic's stories small, ordered, and ready two sprints ahead, and can answer 'what's next and why' without opening the tracking tool."
      P2: "Maintains a story map that shows their area's release strategy at a glance, and watches WIP and cycle time with the team without waiting for someone else to flag a problem."
      P3: "Diagnoses that a team's slipping deadlines are a queue-buildup problem, not a motivation problem, and fixes the batch size rather than pushing the team to work harder."
      P4: "Resolves a cross-team prioritization dispute using a shared backlog-sequencing standard other PMs have adopted from their earlier work."
      P5: "Improves the org's idea-to-live lead time by changing planning and handoff mechanics, with before-and-after numbers to show it."
      P6: "Removes a company-scale delivery bottleneck — a shared review gate every team was queuing behind — with executive backing they built the case for."
  - theme: "Technical & design fluency"
    capability: LI-06
    key_area: "Execution & Delivery"
    key_attribute: "Building with the Team"
    anchor: cagan2017-inspired
    anchor_why: "deep knowledge of the technology and of good design is part of the PM's non-delegable preparation; a PM who can't follow the architecture or judge a design hands the feasibility and usability risks to whoever speaks last."
    mappings:
      P1: {p: P1, sources: [cagan2017-inspired, sfia9], why: "LI-06 P1 ('Follows the team's technical discussions and asks clarifying questions; relies on others to evaluate design quality.') is the guided bar: following the team's technical discussions and asking clarifying questions is LI-06's novice band — relying on others to evaluate design quality — which Cagan names as where a PM's technical preparation starts."}
      P2: {p: P2, sources: [cagan2017-inspired, sfia9], why: "LI-06 P2 ('Understands the systems in scope well enough to review designs, probe trade-offs, and triage incidents — earns technical respect without taking the keyboard.') matches independent operation: understanding the systems in scope well enough to review designs, probe trade-offs, and triage incidents earns technical respect without taking the keyboard — the PM version of LI-06's independent bar."}
      P3: {p: P3, sources: [cagan2017-inspired, sfia9], why: "LI-06 P3 ('Maintains depth across a complex system's stack and hardest problems; a credible thought-partner to the most senior engineers, pairing them with the context they need.') is the capability-owning bar: maintaining depth across a complex system's stack and hardest problems, a credible thought-partner to the most senior engineers, is the P3 register Cagan's non-delegable-preparation argument describes."}
      P4: {p: P3, sources: [cagan2017-inspired, larson2021-staffeng], why: "LI-06 P3 ('Maintains depth across a complex system's stack and hardest problems; a credible thought-partner to the most senior engineers, pairing them with the context they need.') stays at LI-06 P3, not P4: the scope_note's stated plateau means a PM's Staff-level leverage flows through product craft, not deeper technical authority — the P3 'credible thought-partner' bar is the ceiling this role tests for, even at multi-area scope."}
      P5: {p: P4, sources: [cagan2017-inspired, larson2021-staffeng], why: "LI-06 P4 ('Retains broad credibility across a multi-team domain — credible on its hardest cross-cutting technical questions, current enough to ask the question that changes a design.') is LI-06 P4, one below the raw P5-diagonal position: a Principal PM sustains credibility to keep the org's product decisions technically honest and translates platform trade-offs into product terms, which matches P4's 'broad credibility across a multi-team domain,' not P5's technology-direction authority — Cagan is explicit that deep technical authority stays with engineering leaders."}
      P6: {p: P4, sources: [cagan2017-inspired, larson2021-staffeng], why: "LI-06 P4 ('Retains broad credibility across a multi-team domain — credible on its hardest cross-cutting technical questions, current enough to ask the question that changes a design.') holds at LI-06 P4 for the same reason as P5: framing company-level technology inflections in product terms reliably enough that executives act on the translation is P4's cross-cutting credibility exercised at the largest scope this role reaches, deliberately short of P5/P6's technical-authority register."}
    evidence:
      P1: "Follows the team's architecture discussion and asks a clarifying question that shows they did the reading, deferring to the engineers on which design is better."
      P2: "Reviews a proposed design well enough to raise a scalability question before an engineer has to, and triages a live incident credibly without touching the code."
      P3: "Holds their own in an architecture trade-off discussion, spotting that a proposed solution fights the existing system before the team commits to it, and engineers bring them options early because the conversation is worth it."
      P4: "Bridges a technical constraint between two teams' roadmaps that neither team's own engineers had connected, translating the platform trade-off into terms the other PM can act on."
      P5: "Keeps the product org's planning technically honest by representing platform realities in a strategy review, deferring the deepest technical call to the engineering leader in the room."
      P6: "Frames a company-level build-versus-buy technology inflection in product terms clearly enough that executives act on the translation, while the technical authority for the decision itself stays with engineering leadership."
  - theme: "Launch management & readiness"
    capability: PM-09
    key_area: "Execution & Delivery"
    key_attribute: "Launch & Iteration"
    anchor: cagan2017-inspired
    anchor_why: "high-integrity commitments and launch readiness across the whole company, not just the code, paired with Kohavi et al.'s ramped-rollout-and-holdback pattern as the safe launch mechanism."
    mappings:
      P1: {p: P1, sources: [cagan2017-inspired, kohavi2020-trustworthy, sfia9], why: "PM-09 P1 ('Executes assigned launch tasks and tracks checklist items under guidance.') is the guided bar: executing assigned launch tasks and tracking checklist items under guidance is supervised execution of someone else's launch plan."}
      P2: {p: P2, sources: [cagan2017-inspired, kohavi2020-trustworthy, sfia9], why: "PM-09 P2 ('Coordinates a standard product launch across functions with normal review.') matches independent operation: coordinating a standard product launch across functions with normal review is running Kohavi et al.'s ramped-rollout pattern — stages, success/rollback criteria decided in advance — for a familiar launch."}
      P3: {p: P3, sources: [cagan2017-inspired, kohavi2020-trustworthy, sfia9], why: "PM-09 P3 ('Independently orchestrates complex launches and recovers when plans go sideways.') is the terminal, capability-owning bar: owning launch calls under pressure — go/no-go, ramp pace, rollback — with criteria set before emotions run, and running the post-launch review, is Cagan's high-integrity-commitment standard exercised autonomously."}
      P4: {p: P4, sources: [cagan2017-inspired, kohavi2020-trustworthy, larson2021-staffeng], why: "PM-09 P4 ('Defines the go-to-market playbook others adopt and rescues high-stakes launches.') is Staff-scope: coordinating launches that span teams and products, sequencing dependencies and owning the integrated go/no-go, is the launch-readiness discipline applied where no single team can own the call."}
      P5: {p: P5, sources: [cagan2017-inspired, kohavi2020-trustworthy, larson2021-staffeng], why: "PM-09 P5 ('Sets go-to-market strategy across the portfolio and anticipates market-timing risks.') matches Principal authority: setting the org's launch discipline — readiness standards, ramp policy, review practice — and being the escalation point for company-level-blast-radius launches is org-wide ownership."}
      P6: {p: P6, sources: [cagan2017-inspired, kohavi2020-trustworthy, larson2021-staffeng], why: "PM-09 P6 ('Defines what great go-to-market means for the field and shapes external practice.') is company/portfolio scope: launches with company-wide stakes are owned at this level as high-integrity, whole-company commitments — the register Cagan argues launch readiness must reach when the blast radius is the whole company."}
    evidence:
      P1: "Runs the launch checklist for their feature — flags, docs, support notes — and staffs first-day triage, escalating what they can't resolve to their lead."
      P2: "Plans a standard launch end to end: rollout stages and rollback criteria decided in advance, every dependent function briefed before go-live."
      P3: "Makes the go/no-go call on a ramping launch under pressure using criteria set the week before, not in the moment, and runs the post-launch review that feeds the next iteration."
      P4: "Owns the integrated go/no-go for a launch spanning three teams' products, sequencing each team's dependency so no single team's slip silently blocks the others."
      P5: "Sets the org's ramp-policy and readiness standards, and is the escalation point when a launch with company-level blast radius needs a call above any one team."
      P6: "Owns the go/no-go for a launch with company-wide stakes as a high-integrity commitment the whole company is briefed on, not just engineering."
  - theme: "Post-launch iteration & lifecycle"
    capability: PM-10
    key_area: "Execution & Delivery"
    key_attribute: "Launch & Iteration"
    anchor: croll-yoskovitz2013-leananalytics
    anchor_why: "substituted for Olsen's The Lean Product Playbook (no bibliography entry) with Croll & Yoskovitz's stage-based Lean Analytics Cycle — empathy, stickiness, virality, revenue, scale — which is the same anchor family PM-10's other rows above use and covers persevere/pivot/kill judgment directly."
    mappings:
      P1: {p: P1, sources: [croll-yoskovitz2013-leananalytics, sfia9], why: "PM-10 P1 ('Pulls and reports defined product metrics under direction.') is the guided bar: pulling and reporting defined product metrics under direction is watching a launched feature's numbers as told, not yet deciding what to do about them."}
      P2: {p: P2, sources: [croll-yoskovitz2013-leananalytics, sfia9], why: "PM-10 P2 ('Builds and interprets metric dashboards for a product with normal review.') matches independent operation: building and interpreting metric dashboards for one product with normal review is reading a feature's post-launch stage against the Lean Analytics Cycle and proposing the next iteration."}
      P3: {p: P3, sources: [croll-yoskovitz2013-leananalytics, sfia9], why: "PM-10 P3 ('Independently designs metric frameworks and draws sound conclusions from messy data.') is the terminal, capability-owning bar: independently designing metric frameworks and drawing sound conclusions from messy data is the persevere/pivot/kill judgment call the stage-based model exists to inform, made with full autonomy."}
      P4: {p: P4, sources: [croll-yoskovitz2013-leananalytics, larson2021-staffeng], why: "PM-10 P4 ('Defines the measurement model teams adopt and diagnoses misleading metrics others trust.') is Staff-scope: defining the measurement model teams adopt and diagnosing misleading metrics others trust is the stage-based cycle turned into a codified practice enforced across a group of products."}
      P5: {p: P5, sources: [croll-yoskovitz2013-leananalytics, larson2021-staffeng], why: "PM-10 P5 ('Sets product-analytics strategy across the org and anticipates which signals will matter.') matches Principal authority: setting product-analytics strategy across the org and anticipating which signals will matter is organization-wide ownership of what 'iterating well' means, not one product's post-launch loop."}
      P6: {p: P6, sources: [croll-yoskovitz2013-leananalytics, larson2021-staffeng], why: "PM-10 P6 ('Defines rigorous product measurement for the discipline and is cited externally on it.') is company/portfolio scope: defining rigorous product measurement for the discipline and being cited externally is the register the anchor's own book occupies as an externally cited measurement reference."}
    evidence:
      P1: "Reports their feature's week-one usage numbers exactly as their lead asked, without yet proposing what the team should do differently."
      P2: "Reads a newly-launched feature's numbers against the product's current lifecycle stage and proposes the next iteration to try before the next planning cycle."
      P3: "Makes the persevere-pivot-kill call on a six-month-old feature using its own metric framework, and the recommendation holds up under a skeptical leadership review."
      P4: "Diagnoses that a metric two other teams trust as a success signal is actually misleading at this lifecycle stage, and gets both teams onto a corrected measurement model."
      P5: "Sets the analytics strategy for what 'iterating well post-launch' means across the whole product org, anticipating which signals will matter before a product reaches that stage."
      P6: "Defines a measurement discipline for post-launch iteration that gets cited by other companies as a rigorous approach to persevere/pivot/kill decisions."
  - theme: "Business model & unit economics"
    capability: PD-07
    key_area: "Business, Market & Go-to-Market"
    key_attribute: "Business Fluency"
    anchor: osterwalder2010-bmg
    anchor_why: "the Business Model Canvas's nine building blocks are the standard template for reasoning about how a product actually sustains itself economically."
    mappings:
      P1: {p: P1, sources: [osterwalder2010-bmg, sfia9], why: "PD-07 P1 ('States what business outcome their current task serves — and asks when they can't — treating infrastructure and license costs as real money.') is the guided bar: stating what business outcome a current task serves, and treating infrastructure and license costs as real money, is the informing-only cost-awareness PD-07's own P1 profile describes — seeing the numbers, not yet acting on them."}
      P2: {p: P2, sources: [osterwalder2010-bmg, sfia9], why: "PD-07 P2 ('Checks whether shipped work actually moved its metric and says so plainly when it didn't; weighs cost and maintenance burden in the technical choices they own.') matches independent operation: checking whether shipped work actually moved its metric and weighing cost/maintenance burden in the choices one owns applies the canvas's cost-and-revenue-streams blocks to work directly owned, unsupervised."}
      P3: {p: P3, sources: [osterwalder2010-bmg, sfia9], why: "PD-07 P3 ('Frames a domain's technical decisions in business terms — cost of delay, revenue risk, support load — pushes back on work with weak business rationale, and redirects effort when the numbers say the plan is wrong.') is the terminal, capability-owning bar: framing a domain's technical decisions in business terms — cost of delay, revenue risk, support load — and redirecting effort when the numbers say the plan is wrong is the canvas applied with judgment to genuinely contested trade-offs."}
      P4: {p: P4, sources: [osterwalder2010-bmg, larson2021-staffeng], why: "PD-07 P4 ('Builds the business case for the cross-team technical investments with the largest return and is trusted by leadership to have done the math.') is Staff-scope: building the business case for the cross-team investments with the largest return, trusted by leadership to have done the math, is business-model reasoning applied at a scale beyond one product's canvas."}
      P5: {p: P5, sources: [osterwalder2010-bmg, larson2021-staffeng], why: "PD-07 P5 ('Aligns an organization's technical strategy with its economics — cost curves, velocity, risk — owning trade-offs measured in staff-years and reporting them in the business's own terms.') matches Principal authority: aligning an organization's technical strategy with its economics — cost curves, velocity, risk — owning trade-offs measured in staff-years is organization-wide economic ownership."}
      P6: {p: P6, sources: [osterwalder2010-bmg, larson2021-staffeng], why: "PD-07 P6 ('Advises company leadership on where technology changes the business model and is accountable for company-level technology bets paying off.') is company/portfolio scope: advising company leadership on where technology changes the business model and being accountable for company-level technology bets is the register the anchor's own canvas occupies as a company-strategy tool."}
    evidence:
      P1: "States which business outcome their current task serves when a lead asks, and flags that a chosen third-party tool carries a real per-seat license cost, not just an engineering cost."
      P2: "Checks whether a feature shipped last quarter actually moved its target metric, and says plainly in the retro that it didn't, rather than letting the shipped-it framing stand."
      P3: "Redirects a team's roadmap away from a planned initiative once cost-of-delay and support-load numbers show a cheaper, faster path serves the same outcome."
      P4: "Builds the business case for a cross-team platform investment with the largest expected return, and leadership funds it on the strength of the math."
      P5: "Aligns the org's technical investment strategy with its cost curve and velocity trends, owning a trade-off measured in staff-years that leadership signs off on."
      P6: "Advises company leadership on where a technology shift changes the business model itself, and is held accountable for whether the resulting company-level bet pays off."
  - theme: "Pricing & packaging"
    capability: PM-12
    key_area: "Business, Market & Go-to-Market"
    key_attribute: "Business Fluency"
    anchor: nagle2023-pricing
    anchor_why: "substituted for Ramanujam & Tacke's Monetizing Innovation (no bibliography entry) with Nagle, Muller & Gruyaert's value-based pricing text, PM-12's own catalog anchor for the P3/P4/P6 levels — the value cascade against cost-plus defaults."
    mappings:
      P1: {p: P1, sources: [nagle2023-pricing, sfia9], why: "PM-12 P1 ('Populates pricing models with supplied assumptions under direction.') is the guided bar: populating pricing models with supplied assumptions under direction is executing someone else's assumptions, not forming an independent pricing judgment."}
      P2: {p: P2, sources: [nagle2023-pricing, sfia9], why: "PM-12 P2 ('Builds a sound business model for one product with normal review.') matches independent operation: building a sound business model for one product with normal review fills in the Business Model Canvas's revenue-stream block as a standard template, not an invented structure."}
      P3: {p: P3, sources: [nagle2023-pricing, sfia9], why: "PM-12 P3 ('Independently structures pricing under uncertainty and defends margin trade-offs.') is the terminal, capability-owning bar: independently structuring pricing under uncertainty and defending margin trade-offs requires exactly Nagle et al.'s value-based judgment to defend a trade-off rather than defaulting to cost-plus math."}
      P4: {p: P4, sources: [nagle2023-pricing, larson2021-staffeng], why: "PM-12 P4 ('Defines the modeling approach others adopt and untangles complex monetization questions.') is Staff-scope: defining the modeling approach others adopt and untangling complex monetization questions is Nagle et al.'s value cascade moving from one pricing decision to a codified approach a team reuses."}
      P5: {p: P5, sources: [nagle2023-pricing, larson2021-staffeng], why: "PM-12 P5 ('Sets pricing strategy across the portfolio and anticipates market and cost shifts.') matches Principal authority: setting pricing strategy across the portfolio and anticipating market and cost shifts is organization-wide pricing ownership beyond any single product's price."}
      P6: {p: P6, sources: [nagle2023-pricing, larson2021-staffeng], why: "PM-12 P6 ('Defines pricing and business-modeling best practice for the field and is recognized for it.') is company/portfolio scope: defining pricing and business-modeling best practice for the field is the register the anchor's own book occupies as a canonical, externally cited reference."}
    evidence:
      P1: "Fills in a pricing model with the cost and margin assumptions a lead supplied, and asks when an input looks wrong rather than silently accepting it."
      P2: "Builds the revenue-stream section of a new feature's business model using the team's standard canvas, and it holds up under normal review."
      P3: "Defends a value-based price increase to a skeptical sales leader with a margin trade-off argument, instead of defaulting to a cost-plus number that's easier to justify."
      P4: "Defines the pricing-modeling approach two other product teams adopt, and untangles a monetization question — a bundling decision with conflicting margin implications — no single team's model could resolve."
      P5: "Sets the portfolio's pricing strategy for the year, anticipating a cost shift in a key input before it forces a reactive repricing."
      P6: "Defines a pricing and business-modeling practice recognized in the field, with other companies' pricing teams citing the approach."
