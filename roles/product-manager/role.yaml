role: Product Manager
slug: product-manager
variant: ic_technical
minted: 2026-07-02
scope_note: >
  Level codes P1-P6 are the ladder's own columns (Associate PM -> Distinguished PM) and map
  to scope bands one feature/epic -> a product area -> a product/capability -> multiple
  product areas -> product organization -> company portfolio (approximately S1-S6 on the IC
  axis); they are distinct from the catalog's P1-P6 proficiency scale used in the
  proficiency maps below. P3 / Senior Product Manager is the terminal level: sustained
  excellence at product scope is a complete career; P4+ is a different job defined by
  multi-area craft leverage, never headcount. Consolidated 2026-07 by union from five
  independent sources (four blind same-methodology runs plus the trusted Muller PM matrix,
  different lineage; 152 source rows -> 40 canonical). Proficiency targets follow the IC
  guide P1:P1 ... P6:P6 except Technical & design fluency (LI-06), capped at P4 from level
  P4 up: a PM's upper-level leverage flows through product craft rather than deeper
  technical authority, and the source cells plateau accordingly.
levels:
  - {code: P1, title: Associate Product Manager, scope: "one feature/epic", focus: "Learns the craft; ships well-defined slices with guidance"}
  - {code: P2, title: Product Manager, scope: "a product area", focus: "Runs discovery-to-delivery independently for an area"}
  - {code: P3, title: Senior Product Manager, scope: "a product/capability (terminal level)", focus: "Owns outcomes for a product; sets the bar others copy"}
  - {code: P4, title: Staff/Group Product Manager, scope: "multiple product areas", focus: "Aligns strategy and craft across several product teams"}
  - {code: P5, title: Principal Product Manager, scope: "product organization", focus: "Sets product direction and practice the org builds against"}
  - {code: P6, title: Distinguished PM / Head of Product Craft, scope: "company portfolio", focus: "Shapes portfolio bets and the company's product craft"}
