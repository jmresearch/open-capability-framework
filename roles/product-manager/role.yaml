    mappings:
      P1: {p: P1, sources: [minto1996-pyramid, grove1983-high-output-management, sfia9], why: "CC-06 P1 ('Prepares status updates for leadership with guidance; leads with the headline when coached to.') is the guided bar: preparing status updates for leadership with guidance, and leading with the headline when coached to, is following Minto's answer-first structure because someone reminds them to, not yet by habit."}
      P2: {p: P2, sources: [minto1996-pyramid, grove1983-high-output-management, sfia9], why: "CC-06 P2 ('Reports upward answer-first with a specific ask; escalates early with options attached, so no surprise reaches leadership from someone else.') matches independent operation: reporting upward answer-first with a specific ask, escalating early with options attached, is Minto's pyramid principle applied as a self-sufficient habit."}
      P3: {p: P3, sources: [minto1996-pyramid, grove1983-high-output-management, sfia9], why: "CC-06 P3 ('Briefs senior leaders under pressure — facts, impact, options, and a recommendation inside the first two minutes; one-pagers get forwarded unedited.') is the terminal, capability-owning bar: briefing senior leaders under pressure with facts, impact, options, and a recommendation inside two minutes is Grove's case for a manager's output being measured by the output of the people they influence — communication precise enough to drive that output."}
      P4: {p: P4, sources: [minto1996-pyramid, grove1983-high-output-management, larson2021-staffeng], why: "CC-06 P4 ('Builds and lands investment cases with executive audiences — pre-wired with skeptics, sized in business terms, honest about risk; coaches others for executive rooms and runs the operating reviews an organization communicates through.') is Staff-scope: building and landing investment cases with executive audiences, pre-wired with skeptics and sized in business terms, plus coaching others for executive rooms, is Minto's pyramid principle deployed at the scale of a decision that must survive hostile scrutiny."}
      P5: {p: P5, sources: [minto1996-pyramid, grove1983-high-output-management, larson2021-staffeng], why: "CC-06 P5 ('Operates the executive room as a peer — advances positions, absorbs hostile questioning without defensiveness, and changes the room's decision more often than not.') matches Principal authority: operating the executive room as a peer, absorbing hostile questioning and changing the room's decision, is SFIA's highest strategic-influence band combined with Grove's account of the high-leverage activities that define senior management work."}
      P6: {p: P6, sources: [minto1996-pyramid, grove1983-high-output-management, larson2021-staffeng], why: "CC-06 P6 ('Speaks for an organization's technical reality to boards, investors, and press; trusted with the messages that cannot be delegated, and organizational credibility survives the appearances.') is company/portfolio scope: speaking for an organization's technical reality to boards, investors, and press, with organizational credibility on the line, is Grove's output-of-a-manager principle extended to speaking for the organization's credibility itself."}
    evidence:
      P1: "Prepares a status update for a leadership review with a lead's coaching to lead with the headline instead of the chronology."
      P2: "Reports upward with the ask stated first and two options attached, so no surprise reaches their VP from someone else first."
      P3: "Briefs a room of senior leaders under time pressure with facts, impact, options, and a recommendation inside the first two minutes, and the one-pager gets forwarded unedited."
      P4: "Builds an investment case pre-wired against a known skeptic's objections, sized in business terms, and coaches a junior PM through their first executive review."
      P5: "Operates an executive review as a peer, absorbs hostile questioning without getting defensive, and changes the room's decision."
      P6: "Speaks for the company's technical reality to the board and press on a message that can't be delegated, and the company's credibility survives the appearance."
