      P6: {p: P6, sources: [perri2018-escapingbuildtrap, larson2021-staffeng], why: "CC-05 P6 ('Sets the company norm for principled disagreement.') is company/portfolio scope: setting the company norm for principled disagreement is the level at which 'insist on objective criteria' becomes how a whole company disagrees, not one negotiator's technique."}
