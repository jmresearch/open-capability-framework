    mappings:
      P1: {p: P1, sources: [cagan2020-empowered, sfia9], why: "LI-02 P1 ('Participates in interviews; gives clear, evidence-based feedback.') is the guided bar: participating in interviews and giving clear, evidence-based feedback is applying a supplied structured-evaluation method rather than designing one."}
      P2: {p: P2, sources: [cagan2020-empowered, sfia9], why: "LI-02 P2 ('Runs interviews well; calibrates against a consistent bar.') matches independent operation: running interviews well and calibrating against a consistent bar is operationalizing structured interviewing unsupervised, for routine hires."}
      P3: {p: P3, sources: [cagan2020-empowered, sfia9], why: "LI-02 P3 ('Shapes hiring for a team; designs loops; makes sound staffing calls.') is the terminal, capability-owning bar: shaping hiring for a team, designing loops, and making sound staffing calls is designing an interview loop — choosing which structured signals to collect and how to combine them — rather than following one."}
      P4: {p: P4, sources: [cagan2020-empowered, larson2021-staffeng], why: "LI-02 P4 ('Drives hiring strategy across teams; builds the interviewing bar.') is Staff-scope: driving hiring strategy across teams and building the interviewing bar is the org-wide analog of one team's structured-interviewing guide, scaled to multiple teams."}
      P5: {p: P5, sources: [cagan2020-empowered, larson2021-staffeng], why: "LI-02 P5 ('Sets the org's talent strategy.') matches Principal authority: setting the org's talent strategy — workforce planning, leveling, sourcing priorities — is anticipating direction and setting standards rather than executing within them."}
      P6: {p: P6, sources: [cagan2020-empowered, larson2021-staffeng], why: "LI-02 P6 ('Shapes company-wide talent philosophy.') is company/portfolio scope: shaping company-wide talent philosophy is a talent philosophy that shapes how an entire company thinks about hiring PMs, outlasting any one leader's tenure."}
    evidence:
      P1: "Gives evidence-based interview feedback using the team's existing scorecard, citing the specific answer that drove their rating."
      P2: "Runs a PM candidate interview independently and calibrates their rating against the team's existing bar without a debrief coach in the room."
      P3: "Designs a new interview loop stage that catches a judgment gap the old loop was missing, and makes the staffing call on a contested hire."
      P4: "Builds the PM interviewing bar three other teams now hire against, driving hiring strategy across the group."
      P5: "Sets the product org's talent strategy — leveling, sourcing priorities, workforce plan — for the year."
      P6: "Shapes the company's talent philosophy for product roles in a way that outlasts their own tenure in the org."
