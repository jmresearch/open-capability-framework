    key_attribute: Architecture, Quality & Debt
    anchor: cunningham1992
    anchor_why: "debt is a deliberate liability with interest, paid down on purpose, not neglected mess"
    mappings:
      M1: {p: P2, sources: [cunningham1992, sfia9], why: "EM-15 P2 ('keeps a visible debt register with the cost of carry noted and defends a steady paydown allocation in planning') is Cunningham's debt-as-deliberate-liability metaphor applied to one team's budgeted paydown."}
      M2: {p: P3, sources: [cunningham1992, sfia9], why: "EM-15 P3 ('distinguishes debt worth carrying from debt that will detonate, sequences remediation by risk, and prices debt in incident and velocity terms') is the sequencing judgment a critical system's modernization needs, unaided."}
      M3: {p: P4, sources: [cunningham1992, sfia9], why: "EM-15 P4 ('makes debt legible across multiple teams -- shared taxonomy, reporting rhythm -- and gets cross-team risk owned and funded') is the debt-accounting practice several teams now prioritize with -- Director-level."}
      M4: {p: P4, sources: [cunningham1992, sfia9], why: "M4 keeps P4; Senior Director scope is setting a sub-org's quality strategy -- where to gold-plate, where to accept scrappy -- and landing multi-quarter remediation programs against feature pressure, not a deeper debt behavior."}
      M5: {p: P5, sources: [cunningham1992, sfia9], why: "EM-15 P5 ('carries technical risk onto the executive risk register ... lands multi-quarter remediation programs against feature pressure') matches VP-level ownership of a function's technical-health commitments."}
      M6: {p: P6, sources: [cunningham1992, sfia9], why: "EM-15 P6 ('sets an organization's speed-versus-soundness posture explicitly ... and holds it under growth pressure') is Cunningham's debt metaphor applied at the org-wide posture-setting register."}
    evidence:
      M1: "Trades a feature slot for a paydown item in planning by pointing to the register entry showing what the debt has already cost in incidents."
      M2: "Lands a major consolidation that retires a chunk of debt without ever stopping the roadmap to do it."
      M3: "Makes debt legible across a domain -- a shared taxonomy and reporting rhythm teams they do not run adopt -- and aggregates cross-team risk."
      M4: "Sets a sub-org's quality strategy and lands multi-quarter remediation programs against feature pressure, debt stated in business terms."
      M5: "Gets a multi-quarter remediation program funded against direct feature-roadmap competition by putting it on the executive risk register."
      M6: "Publicly names the class of debt the org will always carry for speed, so no team wastes a quarter trying to fix what leadership already decided to accept."
  # ---- Communication & Influence ----
  - theme: Written & Verbal Communication
    capability: CC-01
    key_area: Communication & Influence
    key_attribute: Communication
    anchor: minto1996-pyramid
    anchor_why: "lead with the answer, group the supporting arguments, order them logically"
    mappings:
      M1: {p: P2, sources: [minto1996-pyramid, gitlab-em-jd], why: "CC-01 P2 ('writes clear design notes, runbooks and PRs; explains trade-offs without overselling') is Zinsser's clutter-free discipline applied to one team's routine technical writing."}
      M2: {p: P3, sources: [minto1996-pyramid, gitlab-em-jd], why: "CC-01 P3 ('writes design docs that drive decisions; translates technical risk for non-technical stakeholders') requires Minto's answer-first, pyramid-structured argument for a critical team's external interface."}
      M3: {p: P4, sources: [minto1996-pyramid, gitlab-em-jd], why: "CC-01 P4 ('making complex capability/risk legible to executives without dumbing it down; RFCs align orgs') is Minto's pyramid principle applied at the scale of documents that persuade rooms of stakeholders at once -- Director-level."}
      M4: {p: P4, sources: [minto1996-pyramid, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is setting the writing norms -- templates, pre-read culture, decision-doc formats -- a sub-org adopts because they demonstrably work, not a deeper writing behavior."}
      M5: {p: P5, sources: [minto1996-pyramid, gitlab-em-jd], why: "CC-01 P5 ('strategy memos leadership acts on; org-wide and external reach') is SFIA's strategic-influence band -- delivering one message coherently across audiences for a function."}
      M6: {p: P6, sources: [minto1996-pyramid, gitlab-em-jd], why: "CC-01 P6 ('a clarifying voice at company scale; externally recognized') is Zinsser's decades-long teaching aim -- clarity that carries beyond one's own organization -- applied org-wide."}
    evidence:
      M1: "Writes updates and decision docs that lead with the answer and fit on a page, and runs meetings that end with owners and dates."
      M2: "Makes complex technical situations legible to non-engineers without dumbing them down -- an incident narrative a customer team can use."
      M3: "Writes the documents cross-team decisions get made from -- framing memos, options papers -- that people cite weeks later."
      M4: "Sets the writing norms -- templates, pre-read culture, decision-doc formats -- a sub-org adopts because their versions demonstrably work."
      M5: "Delivers one message coherently across audiences -- board slide, all-hands, engineering deep-dive -- without the versions contradicting each other."
      M6: "Gives the org its language -- the phrases people use to explain the strategy to each other -- and lands hard messages with clarity and humanity."
  - theme: Executive & Upward Communication
    capability: CC-06
    key_area: Communication & Influence
    key_attribute: Communication
    anchor: duarte2012-hbr-guide
    anchor_why: "decisions above a leader are made on how the case is communicated, not only on its merits"
    mappings:
      M1: {p: P2, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P2 ('reports upward answer-first with a specific ask; escalates early with options attached') is Duarte's audience-first framing applied to one team's status, so no surprise reaches leadership from someone else."}
      M2: {p: P3, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P3 ('briefs senior leaders under pressure -- facts, impact, options, and a recommendation inside the first two minutes') is representing a critical program to senior stakeholders under scrutiny, unaided."}
      M3: {p: P4, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P4 ('builds and lands investment cases with executive audiences ... coaches others for executive rooms') is the communication standard other leads adopt -- Director-level."}
      M4: {p: P5, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "M4 steps up to P5 here, one level earlier than this ladder's usual M4:P4 plateau, because running the operating reviews a sub-org communicates through and managing a portfolio of executive stakeholders (CC-06 P5: 'operates the executive room as a peer -- advances positions, absorbs hostile questioning ... changes the room's decision') matches GitLab's Senior Director exec-facing scope, not P4's coaching-others register."}
      M5: {p: P5, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "M5 holds the same P5 bar as M4; the VP differentiator is operating the executive room as a peer for a whole function, not a deeper communication behavior."}
      M6: {p: P6, sources: [duarte2012-hbr-guide, gitlab-em-jd], why: "CC-06 P6 ('speaks for an organization's technical reality to boards, investors, and press ... credibility survives the appearances') is Duarte's persuasive-narrative discipline applied at the company-representing register."}
    evidence:
      M1: "Reports upward with the headline and the ask first, never burying the slip in paragraph four."
      M2: "Turns a skeptical VP's contested launch review into a green light in one sitting, opening with the recommendation before the data."
      M3: "Builds the case for a cross-team investment and lands it with an executive audience, pre-wired with the skeptics and honest about risk."
      M4: "Runs the operating reviews a sub-org communicates through, managing a portfolio of executive stakeholders with different agendas."
      M5: "Walks into a hostile budget review as the only voice defending the function's headcount ask, and leaves with it approved."
      M6: "Fronts the org's response to a public outage for press and investors, and the org's credibility holds through it."
  - theme: Stakeholder Management & Partnership
    capability: PM-13
    key_area: Communication & Influence
    key_attribute: Influence & Partnership
    anchor: freeman1984-stakeholder
    anchor_why: "engineering leaders sit in a web of product, design, sales, support, and operations whose trust is built deliberately"
    mappings:
      M1: {p: P2, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P2 ('manages routine stakeholder relationships and communications with normal review') is running a genuine triad with product and design for one team, closing the loop when things change."}
      M2: {p: P3, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P3 ('independently aligns conflicting stakeholders and navigates tense executive conversations') is mapping and working a critical program's stakeholder web and repairing a damaged partnership, unaided."}
      M3: {p: P4, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P4 ('defines stakeholder-engagement approaches others adopt and brokers the hardest alignment') is treating their peer group as their first team across a domain's partner ecosystem -- Director-level."}
      M4: {p: P4, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is designing how a sub-org interfaces with the rest of the business -- intake paths, escalation contracts -- so partnership survives personnel changes, not a deeper stakeholder behavior."}
      M5: {p: P5, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P5 ('sets executive-engagement strategy and anticipates leadership concerns before they arise') matches VP-level function-to-function alliances tested in a crisis."}
      M6: {p: P6, sources: [freeman1984-stakeholder, gitlab-em-jd], why: "PM-13 P6 ('defines exemplary stakeholder management for the discipline and is externally credible on it') is Freeman's stakeholder theory applied at the org-wide, externally credible register."}
    evidence:
      M1: "Runs a genuine triad with product and design -- shared goals, early involvement, no surprise commitments -- and closes the loop when things change."
      M2: "Maps and works a critical program's stakeholders, and repairs a damaged partnership by resetting expectations and rebuilding credibility."
      M3: "Treats their peer group as their first team -- argues hard in the room, backs the decision outside it -- and builds durable cross-functional relationships."
      M4: "Designs how a sub-org interfaces with the rest of the business -- intake paths, escalation contracts, joint planning -- so partnership survives personnel changes."
      M5: "Forms function-to-function alliances with product, sales, finance, and legal -- reciprocal, durable, tested in a crisis."
      M6: "Stewards the org's most consequential external relationships and models one-company leadership, resolving conflicts by company interest."
  - theme: Influence Without Authority
    capability: LI-07
    key_area: Communication & Influence
    key_attribute: Influence & Partnership
    anchor: cohen-bradford2005
    anchor_why: "from Director up, nearly everything a leader needs done is done by people who do not answer to them"
    mappings:
      M1: {p: P2, sources: [cohen-bradford2005, gitlab-em-jd], why: "LI-07 P2 ('wins cooperation from adjacent teams by trading in their currencies ... rather than escalating') is Cohen & Bradford's reciprocity-based influence at first-line scope."}
      M2: {p: P3, sources: [cohen-bradford2005, gitlab-em-jd], why: "LI-07 P3 ('secures priority from other teams for an initiative with no borrowed authority; builds the case in the other party's terms and repays visibly') is aligning multiple teams around a critical direction under real disagreement, unaided."}
      M3: {p: P4, sources: [cohen-bradford2005, gitlab-em-jd], why: "LI-07 P4 ('moves a multi-team domain to a shared position with no mandate -- assembles the coalition, converts the best-argued skeptic') is Director-level alignment across a domain."}
      M4: {p: P4, sources: [cohen-bradford2005, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is shifting sub-org-level outcomes through people two seams away -- standards groups, principal engineers -- who advocate the position as their own, not a deeper influence behavior."}
      M5: {p: P5, sources: [cohen-bradford2005, gitlab-em-jd], why: "LI-07 P5 ('shifts organization-level outcomes through people several seams away ... holding a minority of the formal power in the room') matches VP-level alignment across a function's peer organizations."}
      M6: {p: P6, sources: [cohen-bradford2005, gitlab-em-jd], why: "LI-07 P6 ('shapes industry and market context in the organization's favor -- standards bodies, open ecosystems, talent narratives') is Cohen & Bradford's currencies-of-influence framework applied at the industry-shaping register."}
    evidence:
      M2: "Gets a dependency bumped ahead of another team's roadmap item by making the case in that team's own success metrics, not theirs."
      M3: "Turns the domain's most vocal skeptic of a shared direction into the person who pitches it to the next skeptic."
      M4: "Shifts sub-org-level outcomes through people two seams away who advocate the position as their own."
      M5: "Influences peer executives and their organizations, landing function-shaping decisions while holding a minority of the formal power in the room."
      M6: "Gets an external standards body to adopt a pattern the org championed, so competitors now build to terms the org set."
  - theme: Conflict Resolution & Negotiation
    capability: CC-05
    key_area: Communication & Influence
    key_attribute: Influence & Partnership
    anchor: fisher-ury1981-gettingtoyes
    anchor_why: "healthy organizations fight about ideas in the open, and unresolved conflict is one of the most expensive latencies an org carries"
    mappings:
      M1: {p: P2, sources: [fisher-ury1981-gettingtoyes, gitlab-em-jd, lencioni2002-fivedysfunctions], why: "CC-05 P2 ('works through disagreement to a decision without damaging relationships') is applying Fisher & Ury's principled-negotiation moves within one team and its nearest neighbors, not yet mediating others' disputes."}
      M2: {p: P3, sources: [fisher-ury1981-gettingtoyes, gitlab-em-jd, lencioni2002-fivedysfunctions], why: "CC-05 P3 ('mediates technical disputes in their domain; finds the path that holds up') is negotiating commitments under pressure on a critical team, reframing turf disputes as interface-design problems, unaided."}
      M3: {p: P4, sources: [fisher-ury1981-gettingtoyes, gitlab-em-jd, lencioni2002-fivedysfunctions], why: "CC-05 P4 ('resolves high-stakes disagreements between senior stakeholders across orgs') is Lencioni's productive-conflict discipline applied as a trusted broker across a domain -- Director-level."}
      M4: {p: P4, sources: [fisher-ury1981-gettingtoyes, gitlab-em-jd, lencioni2002-fivedysfunctions], why: "M4 keeps P4; Senior Director scope is redesigning the structures that generate recurring conflict -- misaligned incentives, ambiguous ownership -- across a sub-org, not re-mediating the same fight."}
      M5: {p: P5, sources: [fisher-ury1981-gettingtoyes, gitlab-em-jd, lencioni2002-fivedysfunctions], why: "CC-05 P5 ('designs the decision processes the org uses to resolve conflict') matches VP-level negotiation of function-level conflicts with peer executives and external parties."}
      M6: {p: P6, sources: [fisher-ury1981-gettingtoyes, gitlab-em-jd, lencioni2002-fivedysfunctions], why: "CC-05 P6 ('sets the company norm for principled disagreement') is Fisher & Ury's objective-criteria principle applied at the whole-company register."}
    evidence:
      M1: "Surfaces simmering disagreement early and mediates it to interests, separating people from positions and driving to an agreement both sides can state fairly."
      M2: "Negotiates commitments under pressure -- scope, deadlines, contested interfaces -- reaching agreements both sides keep, with the trade documented."
      M3: "Resolves lead-to-lead conflicts others route around as a trusted broker, and teaches the parties to resolve the next one themselves."
      M4: "Redesigns the structures that generate recurring conflict, and designs escalation paths so conflicts resolve at the lowest capable level."
      M5: "Negotiates function-level conflicts -- budget splits, shared-platform terms, charter boundaries -- keeping the relationships intact afterward."
      M6: "Turns the org's biggest ideological fights into decision processes the losing side calls fair."
  # ---- Self & Personal Effectiveness ----
  - theme: Managerial Leverage & Focus
    capability: EM-16
    key_area: Self & Personal Effectiveness
    key_attribute: Leverage & Delegation
    anchor: grove1983-high-output-management
    anchor_why: "a manager's output is the leveraged output of everyone they touch, and time is the one non-renewable resource"
    mappings:
      M1: {p: P2, sources: [grove1983-high-output-management, gitlab-em-jd, drucker1967-effective-executive], why: "EM-16 P2 ('runs a deliberate calendar that matches stated priorities ... declines low-leverage meetings') is Drucker's self-management discipline -- knowing where time goes -- at first-line scope."}
      M2: {p: P3, sources: [grove1983-high-output-management, gitlab-em-jd, drucker1967-effective-executive], why: "EM-16 P3 ('prunes their own involvement ruthlessly as complexity grows -- automates, delegates, or kills recurring work every quarter') is Grove's leverage principle applied under a complex team's real complexity."}
      M3: {p: P4, sources: [grove1983-high-output-management, gitlab-em-jd, drucker1967-effective-executive], why: "EM-16 P4 ('chooses interventions by multiplier across many teams ... audits their time and publishes the changes') is the leverage practice other leads pick up -- Director-level."}
      M4: {p: P4, sources: [grove1983-high-output-management, gitlab-em-jd, drucker1967-effective-executive], why: "M4 keeps P4; Senior Director scope is designing their own role top-down from a sub-org's constraints, spending time only where they are the unique unlock, not a deeper leverage behavior."}
      M5: {p: P5, sources: [grove1983-high-output-management, gitlab-em-jd, drucker1967-effective-executive], why: "EM-16 P5 ('allocates attention like a portfolio at organizational scale ... says which is which out loud') matches VP-level ownership of how a function protects its leaders' focus."}
      M6: {p: P6, sources: [grove1983-high-output-management, gitlab-em-jd, drucker1967-effective-executive], why: "EM-16 P6 ('spends presence deliberately as an organizational signal ... guards the organization's focus') is Grove's leverage principle applied at the org-signal register."}
    evidence:
      M1: "Runs a deliberate calendar that matches stated priorities, and ends each week with the highest-leverage actions done."
      M2: "Kills a recurring review meeting that only they found valuable, once they notice no one else has opened the notes in a month."
      M3: "Chooses interventions by multiplier across a domain -- the review that shapes ten decisions -- and declines the rest by policy, not mood."
      M4: "Designs their own role top-down from the sub-org's constraints, spending time only where they are the unique unlock."
      M5: "Tells the function plainly which two initiatives get their personal attention this half and which twenty do not."
      M6: "Skips a well-attended launch review on principle, and the org reads the absence correctly as 'this isn't actually a top priority.'"
  - theme: Delegation & Empowerment
    capability: EM-14
    key_area: Self & Personal Effectiveness
    key_attribute: Leverage & Delegation
    anchor: marquet2012-turn-the-ship
    anchor_why: "leadership scales by pushing authority to where the information is, creating leaders rather than followers"
    mappings:
      M1: {p: P2, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P2 ('delegates whole outcomes with context and check-in contracts matched to each person's readiness ... resists snatching work back') is Marquet's leader-leader delegation at first-line scope."}
      M2: {p: P3, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P3 ('hands ownership of critical, visible work to someone not yet proven and scaffolds them to success, letting them keep the credit') is empowering senior engineers and leads to own hard, ambiguous work on a critical team."}
      M3: {p: P4, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P4 ('pushes decisions down across multiple teams -- publishes decision rights so teams stop escalating what they can decide themselves') is the delegation standard other leads adopt -- Director-level."}
      M4: {p: P4, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is building a sub-org that runs on mechanisms rather than their presence -- delegated authorities with audit trails -- not a deeper delegation behavior."}
      M5: {p: P5, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P5 ('builds organizations that run on mechanisms rather than presence ... grants leaders consequential authority held to outcomes, not methods') matches VP-level ownership of how a function distributes authority."}
      M6: {p: P6, sources: [marquet2012-turn-the-ship, gitlab-em-jd], why: "EM-14 P6 ('runs an organization on intent ... treats every upward escalation as a design flaw to fix') is Marquet's leader-leader model applied at the org-wide register."}
    evidence:
      M2: "Goes on a two-week vacation from a critical workstream they handed off, and it ships on schedule without them."
      M3: "Publishes a one-page decision-rights map that stops three different teams escalating the same class of call to them every week."
      M4: "Builds a sub-org that runs on mechanisms rather than their presence, with pre-declared tripwires for taking back control."
      M5: "Grants senior leaders genuinely consequential authority and holds them to outcomes, not methods; the function's decisions get faster as it grows."
      M6: "Treats a director's request to escalate a call the director was empowered to make as a bug in the org design, not a normal Tuesday."
  - theme: Self-Awareness & Learning Agility
    capability: LI-09
    key_area: Self & Personal Effectiveness
    key_attribute: Growth & Resilience
    anchor: eurich2018-selfawareness
    anchor_why: "accurate self-knowledge and the ability to learn from new experience predict leadership growth"
    mappings:
      M1: {p: P2, sources: [eurich2018-selfawareness, gitlab-em-jd, lombardo-eichinger2000-70-20-10], why: "LI-09 P2 ('asks for feedback on their own practice and changes visibly in response ... keeping a running list of their own failure patterns') is Eurich's internal-plus-external self-awareness loop at first-line scope."}
      M2: {p: P3, sources: [eurich2018-selfawareness, gitlab-em-jd, lombardo-eichinger2000-70-20-10], why: "LI-09 P3 ('knows their failure modes under pressure and manages them in the moment; staffs deliberately against known weaknesses') is the learning-agility Lombardo & Eichinger's model expects once new, high-stakes situations recur on a critical team."}
      M3: {p: P4, sources: [eurich2018-selfawareness, gitlab-em-jd, lombardo-eichinger2000-70-20-10], why: "LI-09 P4 ('runs structured input on themselves -- 360s, skip-level themes -- and closes the loop publicly on what changed') is the feedback mechanism several leads adopt to see their own effect on others -- Director-level."}
      M4: {p: P4, sources: [eurich2018-selfawareness, gitlab-em-jd, lombardo-eichinger2000-70-20-10], why: "M4 keeps P4; Senior Director scope is compensating deliberately for the seniority feedback vacuum across a sub-org -- cultivating truth-tellers -- not a deeper self-awareness behavior."}
      M5: {p: P5, sources: [eurich2018-selfawareness, gitlab-em-jd, lombardo-eichinger2000-70-20-10], why: "LI-09 P5 ('compensates deliberately for the seniority feedback vacuum ... rewards bearers of unwelcome news about themselves') matches VP-level reinvention of leadership at function scale."}
      M6: {p: P6, sources: [eurich2018-selfawareness, gitlab-em-jd, lombardo-eichinger2000-70-20-10], why: "LI-09 P6 ('institutionalizes challenge to their own judgment -- red teams, protected dissent') is Eurich's self-awareness research applied at the org-wide, judgment-checking register."}
    evidence:
      M1: "Asks for feedback on their own management and changes visibly in response, and approaches first-time situations as learnable."
      M2: "Pre-stages a co-lead for a call they know they tend to rush, because they have watched themselves rush it before."
      M3: "Runs a 360 and tells the org, in writing, the one thing it revealed that surprised them and what they are doing about it."
      M4: "Compensates deliberately for the seniority feedback vacuum, cultivating truth-tellers and rewarding the bearer of unwelcome news."
      M5: "Reinvents their leadership at function scale, letting go of the operator identity and saying 'I don't know' in rooms where pretending is the norm."
      M6: "Stands up a red-team review of their own biggest strategic bet and changes the bet when it finds a real hole."
  - theme: Resilience & Sustainable Pace
    capability: LI-10
    key_area: Self & Personal Effectiveness
    key_attribute: Growth & Resilience
    anchor: loehr-schwartz2003-full-engagement
    anchor_why: "performance is a function of managed energy, not time, and sustainable pace beats heroics"
    mappings:
      M1: {p: P2, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P2 ('stays effective and steady under pressure -- recovers from setbacks, manages their own energy, and models a sustainable pace others learn from watching') is Loehr & Schwartz's managed-energy discipline at first-line scope."}
      M2: {p: P3, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P3 ('holds up through prolonged pressure -- incident sieges, crunch, organizational turbulence -- helping the team stay resilient and refusing burnout-driven decisions') is sustained composure through a complex team's real operational pressure."}
      M3: {p: P4, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P4 ('builds resilience into how multiple teams operate -- on-call health, recovery after pushes, load balancing -- and repairs burnout risk at scale') is the sustainable-pace norm other leads adopt -- Director-level."}
      M4: {p: P4, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is modeling and protecting sustainable pace across a sub-org, designed into the operating rhythm rather than left to heroics, not a deeper resilience behavior."}
      M5: {p: P5, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P5 ('stewards organizational resilience -- capacity buffers, crisis rotation, energy management for senior leaders -- and holds the line when business pressure argues for permanent crunch') matches VP-level ownership."}
      M6: {p: P6, sources: [loehr-schwartz2003-full-engagement, gitlab-em-jd], why: "LI-10 P6 ('shapes a resilient, sustainable culture across an organization; the organization absorbs shocks without breaking people') is Loehr & Schwartz's energy-management thesis applied at the org-wide register."}
    evidence:
      M1: "Stays effective and steady under pressure, and models a sustainable pace the team learns from watching, not from posters."
      M2: "Cancels a planned launch rather than run the team through a second consecutive crunch month, and says why out loud."
      M3: "Notices two teams in a domain are both quietly running hot and rebalances on-call across them before either loses someone to burnout."
      M4: "Models and protects sustainable pace across a sub-org, including through the leaders they develop; pace is designed in, not left to heroics."
      M5: "Pushes back when the business asks for a permanent on-call surge, and gets a capacity buffer funded instead."
      M6: "Shapes a resilient, sustainable culture org-wide; the story of the org's hardest year is told without casualties as the moral."
  - theme: Decision-Making Under Uncertainty
    capability: LI-04
    key_area: Self & Personal Effectiveness
    key_attribute: Judgment & Integrity
    anchor: kahneman2011-thinking-fast-slow
    anchor_why: "judgment is systematically biased, and decision quality improves through process, not willpower"
    mappings:
      M1: {p: P2, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P2 ('decides independently within their components; evaluates alternatives honestly') is sizing the decision process to reversibility on one team -- quick calls on two-way doors, written analysis on one-way doors."}
      M2: {p: P3, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P3 ('makes architectural choices for a domain that hold up over months') is structuring high-stakes calls on incomplete data for a critical team -- options written, dissent solicited before their own view is stated."}
      M3: {p: P4, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P4 ('foresees second-order consequences; sets decision frameworks for teams') is installing debiasing mechanics across a domain -- pre-mortems, decision journals reviewed against outcomes -- Director-level."}
