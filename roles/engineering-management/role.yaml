      M5: {p: P5, sources: [kahneman2011-thinking-fast-slow, gitlab-em-jd], why: "LI-04 P5 ('sets decision-making frameworks for the org') matches VP-level ownership of function-level bets under genuine ambiguity, sized so being wrong is survivable."}
