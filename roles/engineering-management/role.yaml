      M4: {p: P4, sources: [whitmore1992-coaching, gitlab-em-jd, google-rework-oxygen], why: "M4 keeps the P4 bar; Senior Director scope is coaching capability built at scale -- manager forums, feedback training -- that a sub-org adopts and keeps running without them."}
      M5: {p: P5, sources: [whitmore1992-coaching, gitlab-em-jd, google-rework-oxygen], why: "LI-01 P5 ('develops senior engineers and leaders; builds culture deliberately') matches VP-level ownership of a function's talent-development strategy, including peers who seek their counsel."}
      M6: {p: P6, sources: [whitmore1992-coaching, gitlab-em-jd, google-rework-oxygen], why: "LI-01 P6 ('develops the next generation of top talent; legacy outlasts tenure') is coaching's pioneer register -- Whitmore's own claim that coaching should outlast the coach."}
