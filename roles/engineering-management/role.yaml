      M2: {p: P3, sources: [mayer1995-trust, gitlab-em-jd, acm-code-of-ethics2018], why: "M2 holds the same P3 bar; the Senior EM differentiator is holding the quality or safety line on a critical system under senior pressure, protecting the engineer who raised the flag, not a deeper integrity behavior."}
      M3: {p: P4, sources: [mayer1995-trust, gitlab-em-jd, acm-code-of-ethics2018], why: "LI-11 P4 ('serves as the honest broker across teams ... carries uncomfortable systemic truths to the room that can fix them') is the ethical norm other leads adopt around access, data, and honest disclosure -- Director-level."}
      M4: {p: P4, sources: [mayer1995-trust, gitlab-em-jd, acm-code-of-ethics2018], why: "M4 keeps P4; Senior Director scope is building the mechanisms that make integrity cheap in a sub-org -- ethics review in design, safe escalation with follow-through -- not a deeper integrity behavior."}
      M5: {p: P5, sources: [mayer1995-trust, gitlab-em-jd, acm-code-of-ethics2018], why: "LI-11 P5 ('builds mechanisms that make integrity cheap at scale ... stops launches on ethical grounds with the business case for trust') matches VP-level ownership of a function's public impact."}
