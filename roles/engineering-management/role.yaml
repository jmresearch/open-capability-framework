  - theme: Risk Management & Governance
    capability: RISK-01
    key_area: Execution & Operations
    key_attribute: Delivery & Reliability
    anchor: nist-csf2
    anchor_why: "risk fails at the management layer -- unowned exposures, unfunded mitigations -- more often than the technical one"
    mappings:
      M1: {p: P2, sources: [nist-csf2, gitlab-em-jd, pmi-pmbok7], why: "RISK-01 P2 ('conducts standard risk assessments and updates registers independently with normal review') is keeping a team risk register with named owners and trigger conditions, per PMBOK's risk-register practice."}
      M2: {p: P3, sources: [nist-csf2, gitlab-em-jd, pmi-pmbok7], why: "RISK-01 P3 ('assesses complex, interconnected enterprise risks and sets local methodology autonomously') is leading a critical system through a real risk event -- an audit, a coordinated disclosure -- hardening system and process afterward, unaided."}
      M3: {p: P4, sources: [nist-csf2, gitlab-em-jd, pmi-pmbok7], why: "RISK-01 P4 ('designs the enterprise risk framework and appetite model others adopt; solves the hardest risk problems') is normalizing risk practice across a domain -- shared register format, paved-road controls teams adopt -- Director-level."}
      M4: {p: P4, sources: [nist-csf2, gitlab-em-jd, pmi-pmbok7], why: "M4 keeps P4; Senior Director scope is a sub-org's risk governance -- risk-appetite statements, exception processes with expiry dates -- not a deeper risk behavior."}
      M5: {p: P5, sources: [nist-csf2, gitlab-em-jd, pmi-pmbok7], why: "RISK-01 P5 ('sets enterprise risk strategy and appetite at board level; anticipates emerging systemic risks') matches VP-level trading of risk against delivery with explicit executive sign-off."}
      M6: {p: P6, sources: [nist-csf2, gitlab-em-jd, pmi-pmbok7], why: "RISK-01 P6 ('defines enterprise-risk practice recognized industry-wide; externally cited authority') is the NIST CSF's risk discipline applied at the board-and-regulator-facing register."}
    evidence:
      M1: "Keeps a team risk register with named owners and trigger conditions, and escalates when a trigger fires rather than hoping."
      M2: "Leads a critical system through a real risk event -- an audit or a failed dependency -- and hardens the system and process afterward."
      M3: "Normalizes risk practice across a domain -- shared register format, review cadence, paved-road controls teams adopt because they are easier."
      M4: "Builds a sub-org's risk governance -- risk-appetite statements, exception processes with expiry dates -- and funds the mitigations."
      M5: "Trades risk against delivery at function scale with explicit executive sign-off on accepted risks -- no silent acceptance."
      M6: "Sets the org's risk appetite and answers for its posture to the board, regulators, and customers."
