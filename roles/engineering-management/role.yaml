      M5: {p: P5, sources: [schmidt-hunter1998, gitlab-em-jd], why: "LI-02 P5 ('sets the org's talent strategy') matches GitLab's VP-level ownership of function-wide talent-acquisition strategy, holding the bar under growth pressure."}
      M6: {p: P6, sources: [schmidt-hunter1998, gitlab-em-jd], why: "LI-02 P6 ('shapes company-wide talent philosophy') is Schmidt & Hunter's selection science applied at the company-defining, external-brand register."}
