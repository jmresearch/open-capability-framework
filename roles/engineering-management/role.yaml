      M5: {p: P5, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P5 ('designs how an organization absorbs step-change growth ... without culture dilution') matches VP-level ownership of function-wide growth events -- acquisitions, new sites -- beyond any one team's formation."}
      M6: {p: P6, sources: [tuckman1965, gitlab-em-jd], why: "EM-13 P6 ('makes team formation an organization-wide capability ... audits that the machinery still works') is the SVP register: forming teams is now infrastructure, not a per-team event."}
