      M2: {p: P3, sources: [edmondson2018-fearless-org, gitlab-em-jd, google-rework-aristotle], why: "M2 holds the same P3 bar; the Senior EM differentiator is rebuilding safety where it is measurably damaged -- post-incident, post-layoff, post-conflict -- not a deeper safety behavior."}
      M3: {p: P4, sources: [edmondson2018-fearless-org, gitlab-em-jd, google-rework-aristotle], why: "EM-03 P4 ('diagnoses and fixes systemic safety failures across teams; other leaders seek their help') is Project Aristotle's finding generalized beyond one team -- Director-level per GitLab."}
      M4: {p: P4, sources: [edmondson2018-fearless-org, gitlab-em-jd, google-rework-aristotle], why: "M4 keeps P4; Senior Director scope is building the channels through which bad news travels up fast across a sub-org, not a new safety behavior."}
      M5: {p: P5, sources: [edmondson2018-fearless-org, gitlab-em-jd, google-rework-aristotle], why: "EM-03 P5 ('sets the org's team-health bar and mechanisms; safety practices they designed are adopted org-wide') matches VP-level ownership of making dissent safe in executive rooms."}
      M6: {p: P6, sources: [edmondson2018-fearless-org, gitlab-em-jd, google-rework-aristotle], why: "EM-03 P6 ('shapes how the industry thinks about team health; published practices others implement') is Edmondson's research applied at the field-shaping register."}
    evidence:
