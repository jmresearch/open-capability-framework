      M2: {p: P3, sources: [whitmore1992-coaching, gitlab-em-jd, google-rework-oxygen], why: "M2 holds the same P3 coaching bar as M1; the Senior EM differentiator is coaching senior engineers and first-time leads through ambiguity the manager cannot solve for them, not a deeper technique."}
