    mappings:
      M1: {p: P3, sources: [fournier2017-managerspath, sfia9], why: "LI-06 P3 ('a credible thought-partner to the most senior engineers on the hardest problems') is Fournier's tech-lead-to-manager shift: a first-line manager is typically promoted from a senior IC role and is expected to retain that depth immediately, not grow into it -- above P2's still-building design-review-only band."}
      M2: {p: P3, sources: [fournier2017-managerspath, sfia9], why: "M2 holds the same P3 bar; the Senior EM differentiator is maintaining depth across a critical system's stack and hardest problems, pairing staff engineers with business context, not a deeper technical behavior."}
      M3: {p: P4, sources: [fournier2017-managerspath, sfia9], why: "LI-06 P4 ('credible on a multi-team domain's hardest cross-cutting technical questions, current enough to ask the question that changes a design') is Fournier's broadened-credibility register applied across a domain -- Director-level per SFIA's higher responsibility band."}
      M4: {p: P4, sources: [fournier2017-managerspath, sfia9], why: "M4 keeps P4; Senior Director scope is sustaining strategic technical credibility with the principal engineers and architects who set a sub-org's bar, not a deeper credibility behavior."}
      M5: {p: P5, sources: [fournier2017-managerspath, sfia9], why: "LI-06 P5 ('translates architectural risk into business terms without distortion, and senior technologists accept the judgment') matches VP-level ownership of guiding a function's technology direction."}
      M6: {p: P5, sources: [fournier2017-managerspath, sfia9], why: "LI-06 tops out at P5 ('sustains credibility to guide an organization's technology direction') for this ladder; SVP-level credibility across the org's technology landscape is the same authority-band behavior at wider reach, not a new P6 register the catalog defines for this capability."}
    evidence:
      M1: "Asks the one design-review question that makes a senior engineer redo their approach, without being the one who could have written the code."
      M2: "Is the person a staff engineer brings a genuinely hard call to before committing to it, on a system outside their own team."
      M3: "Gets pulled into a cross-team design dispute specifically because both sides trust their read of the trade-off."
      M4: "Sustains strategic technical credibility across a sub-org, credible with the principal engineers and architects who set the bar."
      M5: "Talks a CFO out of a cost-cutting call by reframing the architectural risk in terms that survive the CFO's own scrutiny."
      M6: "Sustains credibility across the org's technology landscape; engineers trust their judgment because it survives contact with detail."
