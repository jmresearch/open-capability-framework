  - theme: Capacity & Headcount Planning
    capability: EM-05
    key_area: Execution & Operations
    key_attribute: Resource Stewardship
    anchor: brooks1975-mythical-man-month
    anchor_why: "adding people to a late project makes it later; capacity is nonlinear in headcount"
    mappings:
      M1: {p: P2, sources: [brooks1975-mythical-man-month, gitlab-em-jd], why: "EM-05 P2 ('builds a credible headcount plan for one team with normal review') is planning one team's quarter against realistic capacity -- on-call, ramp time, keep-the-lights-on -- and showing the math when asked to take more."}
      M2: {p: P3, sources: [brooks1975-mythical-man-month, gitlab-em-jd], why: "EM-05 P3 ('independently plans resourcing under uncertainty and defends staffing trade-offs') is forecasting capacity across attrition and ramp scenarios for a complex team, unaided, and declining headcount that would slow it down."}
      M3: {p: P4, sources: [brooks1975-mythical-man-month, gitlab-em-jd], why: "EM-05 P4 ('defines resource-planning practices others adopt and resolves cross-team allocation conflicts') is modeling capacity across several teams and proposing moving work or people to where the constraint actually is -- Director-level."}
      M4: {p: P4, sources: [brooks1975-mythical-man-month, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the headcount plan a sub-org's budget is built on, defending it line by line, not a deeper allocation behavior."}
      M5: {p: P5, sources: [brooks1975-mythical-man-month, gitlab-em-jd], why: "EM-05 P5 ('sets org-wide resourcing strategy and anticipates future capacity demand') matches VP-level ownership of a function's location, seniority-mix, and build/contract workforce shape."}
      M6: {p: P6, sources: [brooks1975-mythical-man-month, gitlab-em-jd], why: "EM-05 P6 ('defines headcount-planning best practice for the discipline and is recognized for it') is Brooks's nonlinear-capacity insight applied at the org-wide workforce-strategy register."}
    evidence:
      M1: "Plans the team's quarter against realistic capacity and shows the math when asked to take more."
      M2: "Forecasts capacity across attrition and ramp scenarios so the team never lurches between starving and drowning."
      M3: "Models capacity across several teams and proposes moving work or people to where the constraint actually is, trade-offs written down."
      M4: "Builds the headcount plan a sub-org's budget is built on, taking cuts strategically rather than spreading them evenly."
      M5: "Sets the function's location, seniority-mix, and build/contract workforce shape, tying growth to unit economics executives accept."
      M6: "Shapes org-wide workforce strategy across cycles -- growing, freezing, or reducing -- with the org's long-run capability protected."
