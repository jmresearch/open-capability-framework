role: Engineering Management
slug: engineering-management
variant: manager
minted: 2026-07-02
scope_note: >
  M1-M6 map to the leadership scope axis: one team (S1) -> a complex/critical team (S2) ->
  a domain, cross-team (S3) -> a sub-org (S4) -> a function (S5) -> org-wide (S6).
  Upper-level cells are written as indirect-leverage behaviors demonstrable before the seat
  is granted; some accountability (budget of record, board exposure) is only fully exercised
  in-seat. Consolidated from four independent sources by union (three ensemble runs plus a
  hand-built engineering-leadership workbook, genericized). R3 sourced-derivation retrofit
  (2026-07-09): every mapping now carries a bibliography source and a per-competency why;
  legacy free-text anchors resolve to bibliography keys (reusing existing catalog sourcing
  where the capability's own capability_levels.csv sourcing already anchors it, e.g. STRAT-02
  to Doerr's OKR literature rather than the original Locke & Latham citation, which has no
  bibliography entry); role flavor from the prior authored ladder survives only where it
  passes the cell-derivation instance test, stored under evidence:. One deliberate mapping
  change: STRAT-01 M4 moves from the pre-retrofit P5 to P4 -- Senior Director is a sub-org
  scope, and STRAT-01 P5 ("sets the enterprise strategic direction") is an enterprise-register
  bar P4 ("defines strategy-formulation approaches others adopt; resolves the hardest
  strategic trade-offs") already covers at that scope; this repoints the miscalibration
  platform-engineering-manager's own R3 retrofit already flagged for the same capability.
  Rendered ladder.md/ladder.csv/ladder.xlsx are derived from this file plus the catalog and
  must never be hand-edited.
ladder_name: Engineering Management (M1-M6) - Canonical
ladder_description: >
  People-leadership ladder (M1-M6) for engineering management, from first-line manager
  through SVP / org lead, spanning leadership & direction, execution & operations, people &
  talent, technical stewardship, communication & influence, and self & personal effectiveness.
derived: true
levels:
  - {code: M1, title: Engineering Manager, scope: one team, focus: builds one healthy, delivering team and the management fundamentals}
  - {code: M2, title: Senior Engineering Manager, scope: a complex / critical team, focus: runs a high-stakes team and multiplies senior ICs}
  - {code: M3, title: Director, scope: a domain (cross-team), focus: aligns a cross-team domain through leaders and mechanisms}
  - {code: M4, title: Senior Director, scope: a sub-org, focus: builds the operating system a sub-org runs on}
  - {code: M5, title: VP, scope: a function, focus: sets functional direction and represents engineering to the business}
  - {code: M6, title: SVP / Org Lead, scope: org-wide, focus: sets org-wide direction, culture, and the company-level bets}
competencies:
  # ---- Leadership & Direction ----
  - theme: Strategy Formulation
    capability: STRAT-01
    key_area: Leadership & Direction
    key_attribute: Strategy & Vision
    anchor: rumelt2011-good-strategy
    anchor_why: "real strategy is a diagnosis plus a coherent guiding policy and actions, not goals restated as ambition"
    mappings:
      M1: {p: P2, sources: [rumelt2011-good-strategy, gitlab-em-jd], why: "STRAT-01 P2 ('develops components of strategy and standard analyses independently with normal review') is Rumelt's diagnosis-plus-guiding-policy kernel applied to one team's plan, not yet the unaided strategic framing P3 expects for ambiguous problems."}
      M2: {p: P3, sources: [rumelt2011-good-strategy, gitlab-em-jd], why: "STRAT-01 P3 ('frames ambiguous strategic problems and shapes coherent strategy autonomously; the go-to strategist') is Rumelt's kernel test -- catching a 'strategy' that is really goals restated as ambition -- applied unaided on a complex/critical team, the harder judgment call P2's component-level analysis does not require."}
      M3: {p: P4, sources: [rumelt2011-good-strategy, gitlab-em-jd], why: "STRAT-01 P4 ('defines strategy-formulation approaches others adopt; resolves the hardest strategic trade-offs') is a domain strategy several teams plan against, not one team's document -- Director-level per GitLab's cross-team scope."}
      M4: {p: P4, sources: [rumelt2011-good-strategy, gitlab-em-jd], why: "M4 keeps P4; a sub-org strategy reconciling competing team strategies into one coherent investment thesis is still the pattern-setting behavior STRAT-01 P4 describes, not yet P5's enterprise-wide direction-setting -- sub-org scope does not reach the enterprise register P5 requires, so this competency stays on the ladder's usual M4:P4 plateau (this repoints the pre-retrofit M4:P5 curve; platform-engineering-manager's R3 retrofit already flagged the same P5-at-sub-org miscalibration for its own STRAT-01 mapping)."}
      M5: {p: P5, sources: [rumelt2011-good-strategy, gitlab-em-jd], why: "STRAT-01 P5 ('sets the enterprise strategic direction; anticipates major shifts reshaping the competitive landscape') matches VP-level ownership of strategy that is genuinely enterprise-facing -- multi-year direction defended at the executive table with market and delivery evidence -- a real step up from M4's sub-org-scoped pattern-setting, not a repeated bar."}
      M6: {p: P6, sources: [rumelt2011-good-strategy, gitlab-em-jd], why: "STRAT-01 P6 ('defines corporate-strategy practice recognized industry-wide; externally cited thought leader') is Rumelt's guiding-policy discipline applied at the org-wide, thesis-setting register."}
    evidence:
      M1: "Writes a team charter that names the problem the team exists to solve, not just its goals."
      M2: "Reframes a team's stalled 'strategy' around its actual obstacle after spotting it was really just goals restated as ambition."
      M3: "Publishes the domain strategy several teams plan against, naming the bets, non-goals, and rejected alternatives."
      M4: "Reconciles competing team strategies into one coherent investment thesis, cutting real programs to fund the guiding policy."
      M5: "Sets multi-year direction for a function and defends its trade-offs at the executive table with market and delivery evidence."
      M6: "Frames the company-level bets the executive team commits to, and revises the diagnosis publicly when it changes."
  - theme: Vision & Goal Alignment
    capability: STRAT-02
    key_area: Leadership & Direction
    key_attribute: Strategy & Vision
    anchor: doerr2018
    anchor_why: "cascading objectives is how strategy becomes goals people can hit or miss, not just a slogan"
    mappings:
      M1: {p: P2, sources: [doerr2018, gitlab-em-jd], why: "STRAT-02 P2 ('runs standard planning cycles and cascades objectives independently with normal review') is Doerr's committed-OKR mechanics applied to one team, specific enough that anyone can say whether a goal was hit."}
      M2: {p: P3, sources: [doerr2018, gitlab-em-jd], why: "STRAT-02 P3 ('designs planning for complex, interdependent units and resolves misalignment autonomously') is repairing vague or sandbagged goals and adding counter-metrics against gaming for a critical team -- unaided judgment P2's standard cycle does not require."}
      M3: {p: P4, sources: [doerr2018, gitlab-em-jd], why: "STRAT-02 P4 ('defines the planning and goal-cascade methodology others adopt; fixes the hardest alignment failures') is the goal-cascade format a domain runs on, catching cross-team collisions before the quarter starts -- Director-level."}
      M4: {p: P4, sources: [doerr2018, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the goal architecture a sub-org runs on -- drafting, calibration, and scoring rituals that function without them in the room -- not a deeper cascading behavior."}
      M5: {p: P5, sources: [doerr2018, gitlab-em-jd], why: "STRAT-02 P5 ('sets the enterprise planning operating model; anticipates shifts in how strategy translates to execution') matches VP-level ownership of function-level outcomes the business plans around."}
      M6: {p: P6, sources: [doerr2018, gitlab-em-jd], why: "STRAT-02 P6 ('defines strategic-planning best practice recognized across the field; externally credible authority') is Doerr's cascading-objectives discipline applied at the org-wide, mission-to-goal-line register."}
    evidence:
      M1: "Translates org direction into team goals specific enough that anyone can say whether they were hit."
      M2: "Repairs a vague or sandbagged goal during planning by adding leading indicators and a counter-metric against gaming."
      M3: "Runs the goal cadence a domain uses so objectives interlock across teams, catching collisions before the quarter starts."
      M4: "Builds the goal architecture a sub-org runs on, calibration and scoring rituals included, that functions without them in the room."
      M5: "Sets function-level outcomes the business plans around, brokering trade-offs with product and finance."
      M6: "Audits the line of sight from mission to every level's goals, and publicly retires goals that no longer serve it."
  - theme: Leading Change
    capability: EM-12
    key_area: Leadership & Direction
    key_attribute: Change & Organizational Design
    anchor: kotter1996
    anchor_why: "durable change needs urgency, a guiding coalition, and follow-through, not a mandate"
    mappings:
      M1: {p: P2, sources: [kotter1996, gitlab-em-jd], why: "EM-12 P2 ('leads a contained team change with normal review') is Kotter's urgency-plus-follow-through discipline applied to one team's change, naming the why and piloting rather than decreeing it."}
      M2: {p: P3, sources: [kotter1996, gitlab-em-jd], why: "EM-12 P3 ('independently drives significant change through resistance to durable adoption') is sequencing a disruptive change on a critical team with a stated case for urgency and staged wins, unaided -- and killing it publicly if it stalls."}
      M3: {p: P4, sources: [kotter1996, gitlab-em-jd], why: "EM-12 P4 ('defines change approaches others adopt and rescues stalled transformations') is building the coalition for a cross-team change before announcing it -- adoption voluntary before it is mandatory -- Director-level."}
      M4: {p: P4, sources: [kotter1996, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is running multiple concurrent changes across a sub-org without exceeding its absorption capacity, with explicit reversal criteria, not a deeper change behavior."}
      M5: {p: P5, sources: [kotter1996, gitlab-em-jd], why: "EM-12 P5 ('sets the org's transformation strategy and anticipates where change is needed next') matches VP-level ownership of function-wide transformation with an honest cost narrative executives sign up for."}
      M6: {p: P6, sources: [kotter1996, gitlab-em-jd], why: "EM-12 P6 ('defines effective engineering transformation for the discipline and shapes external practice') is Kotter's change model applied at the field-shaping, market-timed register."}
    evidence:
      M1: "Lands a team-level change by naming the why, piloting it, and following through past the initial dip."
      M2: "Sequences a disruptive change on a critical team with a stated case for urgency and staged early wins, and kills it publicly if it is not working."
      M3: "Builds the coalition for a cross-team change before announcing it, recruiting early adopters and converting skeptics on the record."
      M4: "Runs multiple concurrent changes across a sub-org without exceeding its absorption capacity, with explicit reversal criteria."
      M5: "Leads function-wide transformation with an honest cost narrative executives sign up for, anchored in reviews and incentives."
      M6: "Times and frames org-wide change against market conditions, absorbing the political cost personally so teams can execute."
  - theme: Organizational & Team Design
    capability: EM-04
    key_area: Leadership & Direction
    key_attribute: Change & Organizational Design
    anchor: skelton-pais2019
    anchor_why: "team boundaries, cognitive load, and interaction modes determine architecture and flow"
    mappings:
      M1: {p: P2, sources: [skelton-pais2019, gitlab-em-jd], why: "EM-04 P2 ('designs a sound structure for one team with normal review') is shaping roles, ownership boundaries, and on-call load inside one team deliberately -- Team Topologies at first-line scope."}
      M2: {p: P3, sources: [skelton-pais2019, gitlab-em-jd], why: "EM-04 P3 ('independently restructures teams to fit changing work and resolves boundary conflicts') is redrawing a critical team's boundaries when the system outgrows them, with a written rationale and a shown load reduction -- unaided."}
      M3: {p: P4, sources: [skelton-pais2019, gitlab-em-jd], why: "EM-04 P4 ('defines org-design approaches others adopt and reshapes the most tangled structures') is designing multi-team boundaries for a domain with the Conway's-law consequences named and neighboring leads co-signing -- Director-level."}
      M4: {p: P4, sources: [skelton-pais2019, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is designing a sub-org's structure around the work -- platform versus stream teams, new leadership seats -- modeling transition costs before the announcement, not a deeper design behavior."}
      M5: {p: P5, sources: [skelton-pais2019, gitlab-em-jd], why: "EM-04 P5 ('sets org-structuring strategy across the org and anticipates scaling inflection points') matches VP-level ownership of when a function's teams split, merge, or platformize."}
      M6: {p: P6, sources: [skelton-pais2019, gitlab-em-jd], why: "EM-04 P6 ('defines effective engineering-org design for the discipline and is cited externally on it') is Skelton & Pais's team-shape thesis applied at the org-wide, externally cited register."}
    evidence:
      M1: "Shapes roles, ownership boundaries, and on-call load inside the team so work flows without waiting on one person."
      M2: "Redraws a team's boundaries when the system outgrows them, showing the load reduction afterward -- fewer handoffs, fewer pages."
      M3: "Designs multi-team boundaries for a domain with the Conway's-law consequences named; neighboring leads co-sign the design."
      M4: "Designs a sub-org's structure around the work rather than around people, modeling transition costs before the announcement."
      M5: "Sets the function's principles for when to split, merge, or platformize teams, evolving shape ahead of scale inflections."
      M6: "Publishes the org-wide design principles other leaders use for their own restructures."
  - theme: Driving Alignment & Decision Clarity
    capability: LI-05
    key_area: Leadership & Direction
    key_attribute: Alignment & Adaptive Leadership
    anchor: bungay2011-art-of-action
    anchor_why: "mission command closes the knowledge, alignment, and effects gaps by briefing intent and freeing method"
    mappings:
      M1: {p: P2, sources: [bungay2011-art-of-action, gitlab-em-jd], why: "LI-05 P2 ('aligns direct partners on scoped decisions') is closing decisions in the room -- the call, the owner, the revisit date -- for one team, the smallest scale of Bungay's briefed-intent practice."}
      M2: {p: P3, sources: [bungay2011-art-of-action, gitlab-em-jd], why: "LI-05 P3 ('drives alignment across a domain; turns disagreement into committed direction') is briefing intent so a critical team makes correct calls in the leader's absence -- Bungay's freed-method discipline exercised unaided."}
      M3: {p: P4, sources: [bungay2011-art-of-action, gitlab-em-jd], why: "LI-05 P4 ('aligns multiple teams and leadership behind a direction') is aligning teams the leader does not run on shared intent, with real closure rules -- Director-level, beyond one domain's alignment."}
      M4: {p: P4, sources: [bungay2011-art-of-action, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is building a sub-org's decision architecture -- what gets decided where, by whom, how fast -- not a deeper alignment behavior."}
      M5: {p: P5, sources: [bungay2011-art-of-action, gitlab-em-jd], why: "LI-05 P5 ('creates forums/narratives through which the org aligns') matches VP-level ownership of the standing mechanisms that align a function with company strategy."}
      M6: {p: P6, sources: [bungay2011-art-of-action, gitlab-em-jd], why: "LI-05 P6 ('aligns the company behind direction; externally persuasive') is Bungay's briefed-intent practice applied at the org-wide, noise-resistant register."}
    evidence:
      M1: "Closes decisions in the room and writes down the call, the owner, and the revisit date where the team works."
      M2: "Briefs intent so well the team makes correct calls in their absence, catching drift at the weekly instead of the postmortem."
      M3: "Aligns teams they do not run on shared intent through one-page briefs and decision forums with real closure rules."
      M4: "Builds a sub-org's decision architecture and unblocks stuck decisions by fixing the process, not just the decision."
      M5: "Aligns a function with company strategy through briefed intent that executives and engineers repeat verbatim."
      M6: "Keeps an entire org pointed at the same intent through noise, repeating the direction until org-wide decisions visibly trace to it."
  - theme: Situational & Adaptive Leadership
    capability: LI-08
    key_area: Leadership & Direction
    key_attribute: Alignment & Adaptive Leadership
    anchor: hersey-blanchard1969
    anchor_why: "there is no single right style; the meta-skill is reading what the person, team, and moment need"
    mappings:
      M1: {p: P2, sources: [hersey-blanchard1969, gitlab-em-jd, heifetz2009-adaptive], why: "LI-08 P2 ('matches direction and support to each person's readiness per task ... and tells technical problems from adaptive ones') is Hersey & Blanchard's Situational Leadership model applied deliberately across one team, plus Heifetz's technical-versus-adaptive diagnosis at its most basic."}
      M2: {p: P3, sources: [hersey-blanchard1969, gitlab-em-jd, heifetz2009-adaptive], why: "LI-08 P3 ('flexes skillfully across a wide range of people and hard situations ... refuses to force technical fixes onto adaptive challenges') is applying Heifetz's diagnosis under conflicting demands on a critical team without losing a grounded center -- the competent band's hallmark."}
      M3: {p: P4, sources: [hersey-blanchard1969, gitlab-em-jd, heifetz2009-adaptive], why: "LI-08 P4 ('coaches other leaders to read what a person, team, or moment needs ... adapts across diverse teams while staying recognizably consistent in values') is teaching the diagnosis, not just practicing it -- Director-level per SFIA's higher responsibility band."}
      M4: {p: P4, sources: [hersey-blanchard1969, gitlab-em-jd, heifetz2009-adaptive], why: "M4 keeps P4; Senior Director scope is developing adaptive leadership as a discipline across a sub-org -- teaching leaders to diagnose technical-versus-adaptive at scale -- not a deeper personal-flexing behavior."}
      M5: {p: P5, sources: [hersey-blanchard1969, gitlab-em-jd, heifetz2009-adaptive], why: "LI-08 P5 ('develops adaptive leadership as an organizational discipline ... the leadership style changes when the situation does') matches VP-level ownership of the tone for adaptive, authentic leadership across a function."}
      M6: {p: P6, sources: [hersey-blanchard1969, gitlab-em-jd, heifetz2009-adaptive], why: "LI-08 P6 ('shapes an adaptive, grounded leadership culture ... style stays plastic to conditions while values stay fixed') is Heifetz's institution-level prescription for sustained adaptive work applied org-wide."}
    evidence:
      M1: "Delegates a familiar task to a seasoned engineer and coaches a struggling new hire through the same kind of task step by step, in the same week."
      M2: "Refuses to force a technical fix onto an adaptive challenge on a critical team, and names the difference in the room."
      M3: "Coaches a peer lead who defaults to hands-on rescue to recognize when a team's problem is adaptive, not technical, and to back off instead of fixing it themselves."
      M4: "Develops adaptive leadership as a discipline across a sub-org, teaching leaders to diagnose technical-versus-adaptive at scale."
      M5: "Sets the tone for adaptive, authentic leadership across a function, adjusting their own approach to what the function needs now."
      M6: "Keeps the org's leadership style recognizable through a merger that could have imported a completely different culture."
  # ---- Execution & Operations ----
  - theme: Planning & Estimation
    capability: PD-04
    key_area: Execution & Operations
    key_attribute: Planning & Prioritization
    anchor: mcconnell2006-estimation
    anchor_why: "estimates carry a cone of uncertainty that narrows with knowledge, and honest ranges beat confident points"
    mappings:
      M1: {p: P2, sources: [mcconnell2006-estimation, gitlab-em-jd], why: "PD-04 P2 ('estimates scoped work realistically; plans own 1-3 week projects') is McConnell's ranged-estimate discipline applied to one team's quarter, re-planning visibly when reality diverges instead of quietly slipping."}
      M2: {p: P3, sources: [mcconnell2006-estimation, gitlab-em-jd], why: "PD-04 P3 ('plans quarter-scale, multi-workstream efforts including dependencies') is planning a critical team through dependency-heavy work, buffering the riskiest items first, so its dates are the ones stakeholders trust."}
      M3: {p: P4, sources: [mcconnell2006-estimation, gitlab-em-jd], why: "PD-04 P4 ('expert at planning large programs; anticipates risk early') is running planning across a domain so team plans compose into one deliverable picture -- Director-level."}
      M4: {p: P4, sources: [mcconnell2006-estimation, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the planning system a sub-org runs on -- cadence, templates, dependency review -- not a deeper estimation behavior."}
      M5: {p: P5, sources: [mcconnell2006-estimation, gitlab-em-jd], why: "PD-04 P5 ('plans org-level programs across quarters/years') matches VP-level ownership of converting portfolio uncertainty into ranged commitments the business plans around."}
      M6: {p: P6, sources: [mcconnell2006-estimation, gitlab-em-jd], why: "PD-04 P6 ('shapes how the company plans major technical change') is McConnell's cone-of-uncertainty discipline applied at the company planning-philosophy register."}
    evidence:
      M1: "Publishes a team plan with ranged estimates and named assumptions, and re-plans visibly when reality diverges."
      M2: "Plans a critical team through dependency-heavy work, sequencing around external teams and buffering the riskiest items first."
      M3: "Runs planning across a domain so team plans compose into one deliverable picture, surfacing cross-team collisions weeks early."
      M4: "Builds the planning system a sub-org runs on and coaches leaders until plan quality is uniform across it."
      M5: "Converts portfolio uncertainty into ranged function-level commitments the business plans around."
      M6: "Sets the org's planning philosophy -- horizon, cadence, commitment culture -- and arbitrates when annual bets collide."
  - theme: Prioritization & Trade-offs
    capability: PD-02
    key_area: Execution & Operations
    key_attribute: Planning & Prioritization
    anchor: reinertsen2009-flow
    anchor_why: "cost of delay and queue economics make prioritization quantitative instead of loudest-voice-wins"
    mappings:
      M1: {p: P2, sources: [reinertsen2009-flow, gitlab-em-jd], why: "PD-02 P2 ('makes sound priority calls within scope; time-boxes uncertain work') is ranking one team's backlog with explicit cost-of-delay reasoning and saying no with the reasons attached."}
      M2: {p: P3, sources: [reinertsen2009-flow, gitlab-em-jd], why: "PD-02 P3 ('balances cost/value/risk across a domain; resists hype; decisions hold up over months') is trading scope, quality, and date on a critical deliverable with the reasoning written down, unaided."}
      M3: {p: P4, sources: [reinertsen2009-flow, gitlab-em-jd], why: "PD-02 P4 ('expert at portfolio-level trade-offs; surfaces hidden assumptions; trusted tiebreaker') is arbitrating priority conflicts between teams using a shared economic frame -- Director-level."}
      M4: {p: P4, sources: [reinertsen2009-flow, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is killing or deferring whole initiatives to keep a sub-org's portfolio inside real capacity, delivering the news to sponsors personally, not a deeper trade-off behavior."}
      M5: {p: P5, sources: [reinertsen2009-flow, gitlab-em-jd], why: "PD-02 P5 ('sets decision frameworks for the org') matches VP-level ownership of the investment split across run, grow, and transform for a function."}
      M6: {p: P6, sources: [reinertsen2009-flow, gitlab-em-jd], why: "PD-02 P6 ('influences company strategic direction through judgment') is Reinertsen's flow economics applied at the company-strategic, irreversible-bets register."}
    evidence:
      M1: "Ranks the backlog with explicit cost-of-delay reasoning and says no to a low-value request with the reasons attached."
      M2: "Trades scope, quality, and date on a critical deliverable with the reasoning written down so it travels."
      M3: "Arbitrates priority conflicts between teams using a shared economic frame they introduced, with the accepted trade-offs on record."
      M4: "Kills or defers whole initiatives to keep a sub-org's portfolio inside real capacity, delivering the news to sponsors personally."
      M5: "Sets the investment split across run, grow, and transform for a function with an economic case finance signs off on."
      M6: "Makes the org's few irreversible bets explicitly and stages the reversible ones, saying no to good ideas in public."
  - theme: Predictable Delivery & Execution
    capability: EM-07
    key_area: Execution & Operations
    key_attribute: Delivery & Reliability
    anchor: forsgren2018
    anchor_why: "software delivery performance predicts organizational performance and is measurable"
    mappings:
      M1: {p: P2, sources: [forsgren2018, gitlab-em-jd], why: "EM-07 P2 ('drives delivery of a standard program with normal review') is running one team's delivery cadence so commitments are met or renegotiated early, never silently missed."}
      M2: {p: P3, sources: [forsgren2018, gitlab-em-jd], why: "EM-07 P3 ('independently runs complex multi-team programs and recovers slipping delivery') is keeping delivery predictable on a system with heavy dependencies, recovering a slipping critical program unaided."}
      M3: {p: P4, sources: [forsgren2018, gitlab-em-jd], why: "EM-07 P4 ('defines delivery practices others adopt and rescues the most troubled programs') is running cross-team delivery with dependencies mapped and interface contracts negotiated before integration -- Director-level."}
      M4: {p: P4, sources: [forsgren2018, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is the program mechanisms -- dependency maps, integration checkpoints, single-threaded owners -- that let multi-quarter, multi-team programs land, not a deeper delivery behavior."}
      M5: {p: P5, sources: [forsgren2018, gitlab-em-jd], why: "EM-07 P5 ('sets the org's delivery strategy and anticipates systemic delivery risks') matches VP-level ownership of delivery forecasts executives plan the business on."}
      M6: {p: P6, sources: [forsgren2018, gitlab-em-jd], why: "EM-07 P6 ('defines what excellent program delivery means and shapes external practice') is Accelerate's engineered-delivery thesis applied at the org-defining register."}
    evidence:
      M1: "Runs a delivery cadence where commitments are met or renegotiated early, and flags slips with options, not apologies."
      M2: "Recovers a slipping critical program by re-scoping and communicating the new plan before being asked."
      M3: "Runs cross-team delivery with dependencies mapped, negotiating interface contracts between teams before integration, not after."
      M4: "Builds the program mechanisms that let multi-quarter, multi-team programs land, and coaches other leads to run them."
      M5: "Gives executives delivery forecasts they plan the business on, with early warning the moment a forecast breaks."
      M6: "Sets the org's execution bar for what 'on time' and 'done' mean, and personally intervenes on the few existential programs."
  - theme: Incident & Reliability Leadership
    capability: EM-10
    key_area: Execution & Operations
    key_attribute: Delivery & Reliability
    anchor: sre2016
    anchor_why: "error budgets, blameless postmortems, and toil caps make reliability an engineering discipline"
    mappings:
      M1: {p: P2, sources: [sre2016, gitlab-em-jd], why: "EM-10 P2 ('manages standard incidents and routine operational risk with normal review') is running blameless postmortems that produce completed actions on one team, and keeping on-call humane."}
      M2: {p: P3, sources: [sre2016, gitlab-em-jd], why: "EM-10 P3 ('independently leads severe incidents and drives durable remediation of risk') is commanding sev-1 incidents on a critical system calmly -- clear roles, decision log -- unaided."}
      M3: {p: P4, sources: [sre2016, gitlab-em-jd], why: "EM-10 P4 ('defines incident and risk practices others adopt and commands the worst crises calmly') is raising the postmortem and readiness bar across a domain -- SLOs adopted by teams they do not run -- Director-level."}
      M4: {p: P4, sources: [sre2016, gitlab-em-jd], why: "M4 keeps P4; Senior Director scope is a sub-org's reliability operating model -- SLO governance, severity taxonomy, an incident-commander bench -- not a deeper command behavior."}
      M5: {p: P5, sources: [sre2016, gitlab-em-jd], why: "EM-10 P5 ('sets the org's operational-risk strategy and anticipates systemic failure modes') matches VP-level ownership of representing operational risk at the executive table in revenue terms."}
      M6: {p: P6, sources: [sre2016, gitlab-em-jd], why: "EM-10 P6 ('defines what excellent operational risk management means and shapes external practice') is SRE's error-budget discipline applied at the customer-and-board-facing register."}
