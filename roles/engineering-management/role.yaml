      M2: "Rebuilds safety where it is damaged post-incident or post-conflict; dissenters are visibly protected from consequences."
      M3: "Reads safety across teams from signals -- who speaks in reviews, what surfaces in retros versus hallways -- and coaches the leads whose teams have gone quiet."
      M4: "Builds channels through which bad news travels up fast -- skip-levels, anonymous paths, incident amnesty -- and proves they are safe."
      M5: "Makes dissent safe in executive rooms, inviting challenge to their own proposals and rewarding the challengers."
      M6: "Makes it safe to tell the org's most powerful people they are wrong, including themselves, publicly."
